name: Visual Autonomous Production Policy

on:
  pull_request:
    paths:
      - 'data/character-assets/manifests/visual-autonomous-production-policy.v1.json'
      - 'data/character-assets/manifests/visual-autonomous-production-runner-state.v1.json'
      - 'data/character-assets/manifests/core5-era-setting-board-autonomous-queue.v2.json'
      - 'data/character-assets/manifests/core5-era-setting-board-execution-queue.v1.json'
      - 'data/character-assets/reviews/yui-character-design-master-pack-autonomous-v2.json'
      - 'data/character-assets/reviews/yui-character-design-master-pack-v1.json'
      - 'data/character-assets/reviews/yui-character-design-sheet-01-v1.rejects.json'
      - 'data/character-assets/reviews/yui-full-body-master-v2.rejects.json'
      - 'docs/visual/visual-autonomous-production-checklist-v1.md'
      - 'data/visual/all-character-life-choice-author-decision-packet-v1.json'
      - 'data/visual/all-character-life-choice-autonomous-authoring-queue-v1.json'
      - 'data/visual/all-character-life-choice-codex-author-decisions-v1.json'
      - 'scripts/quality/check-visual-autonomous-production-policy.ts'
      - 'scripts/quality/check-visual-autonomous-execution-adapters.ts'
      - 'scripts/quality/check-life-choice-autonomous-authoring-queue.ts'
      - '.github/workflows/visual-autonomous-production-policy.yml'
  push:
    branches: [main]
    paths:
      - 'data/character-assets/manifests/visual-autonomous-production-policy.v1.json'
      - 'data/character-assets/manifests/visual-autonomous-production-runner-state.v1.json'
      - 'data/character-assets/manifests/core5-era-setting-board-autonomous-queue.v2.json'
      - 'data/character-assets/manifests/core5-era-setting-board-execution-queue.v1.json'
      - 'data/character-assets/reviews/yui-character-design-master-pack-autonomous-v2.json'
      - 'data/character-assets/reviews/yui-character-design-master-pack-v1.json'
      - 'data/character-assets/reviews/yui-character-design-sheet-01-v1.rejects.json'
      - 'data/character-assets/reviews/yui-full-body-master-v2.rejects.json'
      - 'docs/visual/visual-autonomous-production-checklist-v1.md'
      - 'data/visual/all-character-life-choice-author-decision-packet-v1.json'
      - 'data/visual/all-character-life-choice-autonomous-authoring-queue-v1.json'
      - 'data/visual/all-character-life-choice-codex-author-decisions-v1.json'
      - 'scripts/quality/check-visual-autonomous-production-policy.ts'
      - 'scripts/quality/check-visual-autonomous-execution-adapters.ts'
      - 'scripts/quality/check-life-choice-autonomous-authoring-queue.ts'
      - '.github/workflows/visual-autonomous-production-policy.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate autonomous production authority and checklist
        run: node --experimental-strip-types scripts/quality/check-visual-autonomous-production-policy.ts
      - name: Validate Core5 and Yui autonomous execution adapters
        run: node --experimental-strip-types scripts/quality/check-visual-autonomous-execution-adapters.ts
      - name: Validate delegated 42-item life-choice authoring queue
        run: node --experimental-strip-types scripts/quality/check-life-choice-autonomous-authoring-queue.ts

name: unity-enemy-status-owner

on:
  pull_request:
    paths:
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/U2BattleController.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Status/EnemyStatusRuntimeState.cs'
      - 'src/game/data/title1BaseWeaponRuntimeAdmissionSource.ts'
      - 'scripts/unity/u47-simulator-evidence-sources.ts'
      - 'scripts/quality/check-unity-u47-simulator-manifest.ts'
      - 'scripts/quality/check-unity-enemy-status-owner.ts'
      - 'scripts/quality/check-unity-enemy-status-runtime-foundation.ts'
      - 'scripts/quality/unity-enemy-status-runtime-foundation/**'
      - 'docs/unity-enemy-status-owner-v1.md'
      - '.github/workflows/unity-enemy-status-owner.yml'
  push:
    branches: [main]
    paths:
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/U2BattleController.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Status/EnemyStatusRuntimeState.cs'
      - 'src/game/data/title1BaseWeaponRuntimeAdmissionSource.ts'
      - 'scripts/unity/u47-simulator-evidence-sources.ts'
      - 'scripts/quality/check-unity-u47-simulator-manifest.ts'
      - 'scripts/quality/check-unity-enemy-status-owner.ts'
      - 'scripts/quality/check-unity-enemy-status-runtime-foundation.ts'
      - 'scripts/quality/unity-enemy-status-runtime-foundation/**'
      - 'docs/unity-enemy-status-owner-v1.md'
      - '.github/workflows/unity-enemy-status-owner.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Re-check Status16 foundation binding
        run: node --experimental-strip-types scripts/quality/check-unity-enemy-status-runtime-foundation.ts
      - name: Re-run pure C# Status lifecycle contract
        run: |
          dotnet build scripts/quality/unity-enemy-status-runtime-foundation/EnemyStatusRuntimeFoundation.Contract.csproj --configuration Release --nologo
          dotnet run --project scripts/quality/unity-enemy-status-runtime-foundation/EnemyStatusRuntimeFoundation.Contract.csproj --configuration Release --no-build
      - name: Check U2EnemyActor Status ownership lifecycle
        run: node --experimental-strip-types scripts/quality/check-unity-enemy-status-owner.ts
      - name: Verify historical U47 simulator manifest remains behavior-equivalent
        run: node --experimental-strip-types scripts/quality/check-unity-u47-simulator-manifest.ts

name: PR135 Strict Type Fix One Shot

on:
  push:
    branches: [agent/title1-unlock-learning-progression-v1]
    paths:
      - '.github/workflows/pr135-type-fix-one-shot.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/title1-unlock-learning-progression-v1

      - name: Widen selected weapon id set without changing runtime semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/game/data/title1UnlockLearningProgressionSource.ts')
          text = path.read_text()
          old = "const selectedWeaponIds = new Set(selectedTitle1BaseWeaponCandidates.map((weapon) => weapon.weaponId));"
          new = "const selectedWeaponIds = new Set<string>(selectedTitle1BaseWeaponCandidates.map((weapon) => weapon.weaponId));"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target line, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/pr135-type-fix-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/data/title1UnlockLearningProgressionSource.ts .github/workflows/pr135-type-fix-one-shot.yml
          git commit -m 'fix: widen selected weapon id validation set'
          git push origin HEAD:agent/title1-unlock-learning-progression-v1

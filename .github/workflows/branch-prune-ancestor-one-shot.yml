name: Branch Prune Ancestor One Shot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-prune-ancestor-one-shot.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  prune-audited-safe-branches:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete only audited-safe branches
        shell: bash
        run: |
          set -uo pipefail

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          deleted=0
          kept=0
          failed=0

          expected_semantic_sha() {
            case "$1" in
              agent/seasonal-loading-key-art) echo '02bc3a24b4fbc79728cf21c2a61266468e2b3c31' ;;
              agent/top-living-night-key-art-v1) echo '2a3cd6dc2d6aa0cdc0e501296a671e4c3f100dd0' ;;
              maintenance/u49-integrity-audit-20260724) echo '74aceef453266b1710991e352ac915d287e7e8e3' ;;
              codex/polish-game-feel-foundation) echo '26bf0e3a3840bfa6ab4bfec0b05eb5c0d2878490' ;;
              feature/pro-quality-pass) echo 'd1b5ba877f268380f40c0caf2ce70a8abb790f04' ;;
              feature/progression-local-save-6) echo '485da96c1f357e2a1ad8adb9c411e42b019b4aca' ;;
              tmp-noop) echo '2f64ee5db425c9bf70124522b345018b0473d516' ;;
              feat/storybook-ui-overhaul) echo 'd162cec0a468181507accdd809187d232d04c73e' ;;
              feat/enemy-runtime-sheet-clean) echo '8f8be726435da7cccc5c743a0acbe76d83bdf3b9' ;;
              *) echo '' ;;
            esac
          }

          merged_pr_for_exact_head() {
            local branch="$1"
            local sha="$2"
            gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
              -f state=closed \
              -f "head=$GITHUB_REPOSITORY_OWNER:$branch" \
              -f per_page=100 \
              --jq ".[] | select(.merged_at != null and .head.sha == \"$sha\") | .number" \
              | head -n 1
          }

          mapfile -t branches < <(
            git for-each-ref refs/remotes/origin \
              --format='%(refname:strip=3)' \
              | grep -v '^HEAD$' \
              | sort -u
          )

          for branch in "${branches[@]}"; do
            case "$branch" in
              main|feat/lorebook-world-bible-web-v1)
                echo "KEEP protected/active: $branch"
                kept=$((kept + 1))
                continue
                ;;
            esac

            actual="$(git rev-parse "refs/remotes/origin/$branch")"
            delete_reason=''

            if git merge-base --is-ancestor "refs/remotes/origin/$branch" refs/remotes/origin/main; then
              delete_reason='fully contained in main'
            else
              merged_pr="$(merged_pr_for_exact_head "$branch" "$actual" || true)"
              if [ -n "$merged_pr" ]; then
                delete_reason="exact current head already merged by PR #$merged_pr"
              else
                expected="$(expected_semantic_sha "$branch")"
                if [ -n "$expected" ] && [ "$actual" = "$expected" ]; then
                  delete_reason='audited semantic successor already merged; exact head unchanged'
                fi
              fi
            fi

            if [ -n "$delete_reason" ]; then
              echo "DELETE $delete_reason: $branch"
              if git push origin --delete "$branch"; then
                deleted=$((deleted + 1))
              else
                echo "::warning::Failed to delete $branch"
                failed=$((failed + 1))
              fi
            else
              echo "KEEP non-ancestor, unmerged, or changed-since-audit: $branch"
              kept=$((kept + 1))
            fi
          done

          {
            echo '## Branch prune result'
            echo
            echo "- deleted audited-safe branches: $deleted"
            echo "- kept main/active/non-ancestor/unmerged/changed branches: $kept"
            echo "- delete failures: $failed"
            echo
            echo 'Safety rules:'
            echo '- never delete `main` or the active Lorebook branch'
            echo '- delete ordinary branches only when the tip is an ancestor of `origin/main`'
            echo '- accept squash/rebase merge cleanup only when GitHub reports a merged PR whose recorded head SHA exactly equals the current branch SHA'
            echo '- a small closed-unmerged semantic-superseded allowlist is SHA-pinned; any post-audit commit becomes KEEP automatically'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

name: unity-dream-alarm-prototype

on:
  pull_request:
    paths:
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/SelectedBaseWeapons/DreamAlarmPrototypeRuntime.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/SelectedBaseWeapons/DreamAlarmPrototypeRuntime.cs.meta'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2DelayedTriggerRuntime.cs'
      - 'src/game/data/baseWeaponSelectionSource.ts'
      - 'src/game/data/title1BaseWeaponRuntimeAdmissionSource.ts'
      - 'scripts/quality/check-unity-dream-alarm-prototype.ts'
      - 'scripts/quality/unity-dream-alarm/**'
      - 'docs/unity-dream-alarm-prototype-v1.md'
      - '.github/workflows/unity-dream-alarm-prototype.yml'
  push:
    branches: [main]
    paths:
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/SelectedBaseWeapons/DreamAlarmPrototypeRuntime.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/SelectedBaseWeapons/DreamAlarmPrototypeRuntime.cs.meta'
      - 'src/game/data/title1BaseWeaponRuntimeAdmissionSource.ts'
      - 'scripts/quality/check-unity-dream-alarm-prototype.ts'
      - 'scripts/quality/unity-dream-alarm/**'
      - 'docs/unity-dream-alarm-prototype-v1.md'
      - '.github/workflows/unity-dream-alarm-prototype.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check Dream Alarm staged caller proof
        run: node --experimental-strip-types scripts/quality/check-unity-dream-alarm-prototype.ts
      - name: Compile and execute Dream Alarm contract
        run: dotnet run --project scripts/quality/unity-dream-alarm/UnityDreamAlarm.Contract.csproj --configuration Release
      - name: Re-check delayed trigger foundation
        run: node --experimental-strip-types scripts/quality/check-unity-delayed-trigger-primitive.ts
      - name: Re-check Title1 Base Weapon admission
        run: node --experimental-strip-types scripts/quality/check-title1-base-weapon-runtime-admission.ts
      - name: Re-check Title1 Content Master integrity
        run: node --experimental-strip-types scripts/quality/check-title1-content-master-integrity.ts

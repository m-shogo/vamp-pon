name: Life Choice Author Decision Packet V1

on:
  pull_request:
    paths:
      - 'data/visual/core5-living-visual-profiles-v1.json'
      - 'data/visual/all-character-life-choice-author-review-queue-v1.json'
      - 'data/visual/core5-p0-life-choice-review-contract-v1.json'
      - 'data/visual/core5-p1-life-choice-review-contract-v1.json'
      - 'data/visual/core5-p2-life-choice-review-contract-v1.json'
      - 'data/visual/current21-extended-living-visual-profiles-v1.json'
      - 'data/visual/current16-life-choice-profile-migration-intake-v1.json'
      - 'data/visual/future15-living-visual-profiles-v1.json'
      - 'data/visual/future15-life-choice-profile-migration-intake-v1.json'
      - 'data/visual/all-character-life-choice-migration-aware-audit-v2.json'
      - 'data/visual/all-character-life-choice-review-queue-v2.json'
      - 'data/visual/all-character-life-choice-schema-migration-ready-v1.json'
      - 'data/visual/all-character-life-choice-partial-evidence-review-v1.json'
      - 'data/visual/life-choice-species-body-type-schema-adapter-v1.json'
      - 'data/visual/all-character-life-choice-author-decision-packet-v1.json'
      - 'docs/visual/life-choice-author-decision-packet-v1.md'
      - 'scripts/quality/build-life-choice-author-decision-packet-v1.ts'
      - '.github/workflows/life-choice-author-decision-packet-v1.yml'
  push:
    branches: [main]
    paths:
      - 'data/visual/core5-living-visual-profiles-v1.json'
      - 'data/visual/all-character-life-choice-author-review-queue-v1.json'
      - 'data/visual/core5-p0-life-choice-review-contract-v1.json'
      - 'data/visual/core5-p1-life-choice-review-contract-v1.json'
      - 'data/visual/core5-p2-life-choice-review-contract-v1.json'
      - 'data/visual/current21-extended-living-visual-profiles-v1.json'
      - 'data/visual/current16-life-choice-profile-migration-intake-v1.json'
      - 'data/visual/future15-living-visual-profiles-v1.json'
      - 'data/visual/future15-life-choice-profile-migration-intake-v1.json'
      - 'data/visual/all-character-life-choice-migration-aware-audit-v2.json'
      - 'data/visual/all-character-life-choice-review-queue-v2.json'
      - 'data/visual/all-character-life-choice-schema-migration-ready-v1.json'
      - 'data/visual/all-character-life-choice-partial-evidence-review-v1.json'
      - 'data/visual/life-choice-species-body-type-schema-adapter-v1.json'
      - 'data/visual/all-character-life-choice-author-decision-packet-v1.json'
      - 'docs/visual/life-choice-author-decision-packet-v1.md'
      - 'scripts/quality/build-life-choice-author-decision-packet-v1.ts'
      - '.github/workflows/life-choice-author-decision-packet-v1.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate 42 Human author decisions
        run: node --experimental-strip-types scripts/quality/build-life-choice-author-decision-packet-v1.ts
      - name: Validate materialized author packet
        run: node --experimental-strip-types scripts/quality/build-life-choice-author-decision-packet-v1.ts --check-materialized

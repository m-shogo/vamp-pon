name: unity-bellows-fan-telemetry

on:
  pull_request:
    paths:
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/SelectedBaseWeapons/BellowsFanPrototypeRuntime.cs'
      - 'scripts/quality/check-unity-bellows-fan-telemetry.ts'
      - 'scripts/quality/unity-bellows-fan-telemetry/**'
      - 'docs/unity-bellows-fan-telemetry-v1.md'
      - '.github/workflows/unity-bellows-fan-telemetry.yml'
  push:
    branches: [main]
    paths:
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/SelectedBaseWeapons/BellowsFanPrototypeRuntime.cs'
      - 'scripts/quality/check-unity-bellows-fan-telemetry.ts'
      - 'scripts/quality/unity-bellows-fan-telemetry/**'
      - 'docs/unity-bellows-fan-telemetry-v1.md'
      - '.github/workflows/unity-bellows-fan-telemetry.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check caller-owned Bellows telemetry
        run: node --experimental-strip-types scripts/quality/check-unity-bellows-fan-telemetry.ts
      - name: Compile and execute Bellows telemetry contract
        run: |
          dotnet build scripts/quality/unity-bellows-fan-telemetry/BellowsFanTelemetry.Contract.csproj --configuration Release --nologo
          dotnet run --project scripts/quality/unity-bellows-fan-telemetry/BellowsFanTelemetry.Contract.csproj --configuration Release --no-build
      - name: Re-check Bellows cone prototype
        run: node --experimental-strip-types scripts/quality/check-unity-bellows-fan-cone-prototype.ts
      - name: Re-check Title1 Base Weapon runtime admission
        run: node --experimental-strip-types scripts/quality/check-title1-base-weapon-runtime-admission.ts

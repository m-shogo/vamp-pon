name: U2 Multi Target Projectile One Shot

on:
  push:
    branches: [agent/unity-multitarget-projectile-primitive-v2]
    paths:
      - '.github/workflows/u2-multitarget-projectile-one-shot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unity-multitarget-projectile-primitive-v2
      - name: Add deterministic allocation-conscious multi-target projectile primitive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('unity/VampPonUnity/Assets/_Project/Scripts/Runtime/U2BattleController.cs')
          text = path.read_text()
          anchor = '        private U2EnemyActor FindNearestEnemy()\n'
          count = text.count(anchor)
          if count != 1:
              raise SystemExit(f'expected exactly one FindNearestEnemy anchor, got {count}')

          block = '''        private readonly List<U2EnemyActor> nearestEnemyTargetScratch = new(8);
        private Action<U2EnemyActor> collectTargetableEnemyAction;

        public int FireGameplayProjectilesAtNearestTargets(
            float damage,
            int pierce,
            int maxTargets,
            EnemyStatusApplicationRequest? statusApplicationRequest = null)
        {
            if (maxTargets <= 0) return 0;

            nearestEnemyTargetScratch.Clear();
            collectTargetableEnemyAction ??= CollectTargetableEnemyForScratch;
            enemies.ForEach(collectTargetableEnemyAction);
            if (nearestEnemyTargetScratch.Count == 0) return 0;

            var targetCount = Math.Min(maxTargets, nearestEnemyTargetScratch.Count);
            SortNearestEnemyScratchPrefix(targetCount);

            var fired = 0;
            for (var i = 0; i < targetCount; i++)
            {
                if (FireGameplayProjectileAtTarget(
                    nearestEnemyTargetScratch[i],
                    damage,
                    pierce,
                    statusApplicationRequest))
                {
                    fired++;
                }
            }
            return fired;
        }

        private void CollectTargetableEnemyForScratch(U2EnemyActor enemy)
        {
            if (enemy != null && enemy.IsTargetable) nearestEnemyTargetScratch.Add(enemy);
        }

        private void SortNearestEnemyScratchPrefix(int targetCount)
        {
            for (var i = 0; i < targetCount; i++)
            {
                var nearestIndex = i;
                var nearestDistance = DistanceSquaredFromPlayer(nearestEnemyTargetScratch[i]);
                var nearestInstanceId = nearestEnemyTargetScratch[i].GetInstanceID();

                for (var candidateIndex = i + 1; candidateIndex < nearestEnemyTargetScratch.Count; candidateIndex++)
                {
                    var candidate = nearestEnemyTargetScratch[candidateIndex];
                    var candidateDistance = DistanceSquaredFromPlayer(candidate);
                    var candidateInstanceId = candidate.GetInstanceID();
                    if (candidateDistance < nearestDistance ||
                        (Math.Abs(candidateDistance - nearestDistance) <= 0.0001f && candidateInstanceId < nearestInstanceId))
                    {
                        nearestIndex = candidateIndex;
                        nearestDistance = candidateDistance;
                        nearestInstanceId = candidateInstanceId;
                    }
                }

                if (nearestIndex == i) continue;
                var swap = nearestEnemyTargetScratch[i];
                nearestEnemyTargetScratch[i] = nearestEnemyTargetScratch[nearestIndex];
                nearestEnemyTargetScratch[nearestIndex] = swap;
            }
        }

        private float DistanceSquaredFromPlayer(U2EnemyActor enemy)
            => (enemy.transform.position - playerRoot.position).sqrMagnitude;

'''
          path.write_text(text.replace(anchor, block + anchor))
          PY
          rm .github/workflows/u2-multitarget-projectile-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add unity/VampPonUnity/Assets/_Project/Scripts/Runtime/U2BattleController.cs .github/workflows/u2-multitarget-projectile-one-shot.yml
          git commit -m 'feat: add deterministic multi-target projectile primitive'
          git push origin HEAD:agent/unity-multitarget-projectile-primitive-v2

name: Slice Core5 original sprite sheets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - public/assets/prototypes/sprite-sheets/core5-original/**
      - scripts/prototypes/slice-core5-original-sheets.ts
      - scripts/prototypes/core5-image/png-rgba.ts
      - data/character-assets/core5-52px-sprite-sheet-cells.json
      - .github/workflows/slice-core5-original-sheets.yml

permissions:
  contents: write

concurrency:
  group: core5-original-slice
  cancel-in-progress: true

jobs:
  slice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Slice 180px frames
        run: node --experimental-strip-types scripts/prototypes/slice-core5-original-sheets.ts

      - name: Verify generated frame count
        run: |
          test "$(find public/assets/prototypes/sprite-sheets/core5-original-frames -type f -name '*.png' | wc -l | tr -d ' ')" = "240"
          test "$(find public/assets/prototypes/sprite-sheets/core5-original-frames -type f -name 'manifest.json' | wc -l | tr -d ' ')" = "6"

      - name: Commit generated frames
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/prototypes/sprite-sheets/core5-original-frames
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Core5 originalを180pxフレームへ分割"
            git push origin HEAD:main
          fi

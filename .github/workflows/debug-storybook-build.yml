name: Debug storybook UI build

on:
  push:
    branches:
      - feat/storybook-ui-overhaul

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/storybook-ui-overhaul
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture build
        run: |
          mkdir -p reports
          pnpm build > reports/storybook-ui-build.log 2>&1 || true
      - name: Commit build report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/storybook-ui-build.log
          git commit -m "絵本調UIのビルド結果を記録" || exit 0
          git push origin HEAD:feat/storybook-ui-overhaul

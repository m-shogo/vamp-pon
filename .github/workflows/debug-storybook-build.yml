name: Finalize storybook UI

on:
  push:
    branches:
      - feat/storybook-ui-overhaul

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/storybook-ui-overhaul
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Apply type fixes
        run: node scripts/patch-storybook-type-fixes.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "絵本調UIの型修正と検査ファイル整理" || exit 0
          git push origin HEAD:feat/storybook-ui-overhaul

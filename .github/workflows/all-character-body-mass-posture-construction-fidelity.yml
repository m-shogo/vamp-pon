      - 'scripts/quality/check-character-production-generation-entrypoint.ts'
      - '.github/workflows/all-character-body-mass-posture-construction-fidelity.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all-character body mass posture construction fidelity authority
        run: node --experimental-strip-types scripts/quality/check-all-character-body-mass-posture-construction-fidelity.ts

name: All Character Body Mass Posture Construction Fidelity Master

on:
  pull_request:
    paths:
      - 'docs/visual/all-character-body-mass-posture-construction-fidelity-master-v1.md'
      - 'data/visual/all-character-body-mass-posture-construction-fidelity-master-v1.json'
      - 'tools/asset-factory/scripts/export-face-skull-landmark-locked-character-design-prompt.ts'
      - 'scripts/quality/check-all-character-body-mass-posture-construction-fidelity.ts'
      - 'scripts/quality/check-character-production-generation-entrypoint.ts'
      - '.github/workflows/all-character-body-mass-posture-construction-fidelity.yml'

name: unity-slam-wave-query-primitive

on:
  pull_request:
    paths:
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2EnemySlamWaveQueryRuntime.cs'
      - 'src/game/data/title1BaseWeaponRuntimeAdmissionSource.ts'
      - 'scripts/quality/check-unity-slam-wave-query-primitive.ts'
      - 'scripts/quality/check-title1-base-weapon-runtime-admission.ts'
      - 'scripts/quality/check-unity-knockback-vector-primitive.ts'
      - 'scripts/quality/check-unity-bellows-fan-cone-prototype.ts'
      - 'scripts/quality/unity-slam-wave-query/**'
      - 'docs/unity-slam-wave-query-primitive-v1.md'
      - 'docs/title1-base-weapon-runtime-admission-v1.md'
      - '.github/workflows/unity-slam-wave-query-primitive.yml'
  push:
    branches: [main]
    paths:
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2EnemySlamWaveQueryRuntime.cs'
      - 'src/game/data/title1BaseWeaponRuntimeAdmissionSource.ts'
      - 'scripts/quality/check-unity-slam-wave-query-primitive.ts'
      - 'scripts/quality/check-title1-base-weapon-runtime-admission.ts'
      - 'scripts/quality/check-unity-knockback-vector-primitive.ts'
      - 'scripts/quality/check-unity-bellows-fan-cone-prototype.ts'
      - 'scripts/quality/unity-slam-wave-query/**'
      - 'docs/unity-slam-wave-query-primitive-v1.md'
      - 'docs/title1-base-weapon-runtime-admission-v1.md'
      - '.github/workflows/unity-slam-wave-query-primitive.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check reusable slam-wave query primitive
        run: node --experimental-strip-types scripts/quality/check-unity-slam-wave-query-primitive.ts
      - name: Compile and execute slam-wave query contract
        run: |
          dotnet build scripts/quality/unity-slam-wave-query/UnitySlamWaveQuery.Contract.csproj --configuration Release --nologo
          dotnet run --project scripts/quality/unity-slam-wave-query/UnitySlamWaveQuery.Contract.csproj --configuration Release --no-build
      - name: Re-check Title1 Base Weapon runtime admission
        run: node --experimental-strip-types scripts/quality/check-title1-base-weapon-runtime-admission.ts
      - name: Re-check reusable knockback primitive
        run: node --experimental-strip-types scripts/quality/check-unity-knockback-vector-primitive.ts
      - name: Re-check Bellows cone proof
        run: node --experimental-strip-types scripts/quality/check-unity-bellows-fan-cone-prototype.ts
      - name: Re-check Title1 Content Master integrity
        run: node --experimental-strip-types scripts/quality/check-title1-content-master-integrity.ts

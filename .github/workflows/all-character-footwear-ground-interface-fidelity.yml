name: All Character Footwear Ground Interface Fidelity Master

on:
  pull_request:
    paths:
      - 'docs/visual/all-character-footwear-ground-interface-fidelity-master-v1.md'
      - 'data/visual/all-character-footwear-ground-interface-fidelity-master-v1.json'
      - 'docs/visual/character-production-generation-entrypoint-v9.md'
      - 'data/visual/character-production-generation-entrypoint-v9.json'
      - 'src/game/data/characterReferenceProductionEntrypoint.ts'
      - 'tools/asset-factory/scripts/export-footwear-ground-interface-locked-character-design-prompt.ts'
      - 'scripts/quality/check-all-character-footwear-ground-interface-fidelity.ts'
      - 'scripts/quality/check-character-production-generation-entrypoint.ts'
      - '.github/workflows/all-character-footwear-ground-interface-fidelity.yml'
  push:
    branches: [main]
    paths:
      - 'docs/visual/all-character-footwear-ground-interface-fidelity-master-v1.md'
      - 'data/visual/all-character-footwear-ground-interface-fidelity-master-v1.json'
      - 'docs/visual/character-production-generation-entrypoint-v9.md'
      - 'data/visual/character-production-generation-entrypoint-v9.json'
      - 'src/game/data/characterReferenceProductionEntrypoint.ts'
      - 'tools/asset-factory/scripts/export-footwear-ground-interface-locked-character-design-prompt.ts'
      - 'scripts/quality/check-all-character-footwear-ground-interface-fidelity.ts'
      - 'scripts/quality/check-character-production-generation-entrypoint.ts'
      - '.github/workflows/all-character-footwear-ground-interface-fidelity.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate footwear and ground-interface authority for all 36 characters
        run: node --experimental-strip-types scripts/quality/check-all-character-footwear-ground-interface-fidelity.ts

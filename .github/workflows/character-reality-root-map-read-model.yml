name: Character Reality Root Map Read Model

on:
  pull_request:
    paths:
      - 'docs/character-reality-root-map-read-model-v1.md'
      - 'src/game/data/characterRealityRootMapReadModel.ts'
      - 'src/game/data/characterRealityRootRegistry.ts'
      - 'src/game/data/characterAuthorDbCoverageManifest.ts'
      - 'scripts/quality/check-character-reality-root-map-read-model.ts'
      - '.github/workflows/character-reality-root-map-read-model.yml'
  push:
    branches: [main]
    paths:
      - 'docs/character-reality-root-map-read-model-v1.md'
      - 'src/game/data/characterRealityRootMapReadModel.ts'
      - 'src/game/data/characterRealityRootRegistry.ts'
      - 'src/game/data/characterAuthorDbCoverageManifest.ts'
      - 'scripts/quality/check-character-reality-root-map-read-model.ts'
      - '.github/workflows/character-reality-root-map-read-model.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 36-character Reality Root geography map read model
        run: node --experimental-strip-types scripts/quality/check-character-reality-root-map-read-model.ts

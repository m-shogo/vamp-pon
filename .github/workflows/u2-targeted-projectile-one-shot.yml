name: U2 Targeted Projectile One Shot

on:
  push:
    branches: [agent/unity-targeted-projectile-primitive-v1]
    paths:
      - '.github/workflows/u2-targeted-projectile-one-shot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unity-targeted-projectile-primitive-v1
      - name: Refactor projectile spawn into explicit target primitive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('unity/VampPonUnity/Assets/_Project/Scripts/Runtime/U2BattleController.cs')
          text = path.read_text()
          old = '''        public bool FireGameplayProjectile(
            float damage,
            int pierce,
            EnemyStatusApplicationRequest? statusApplicationRequest)
        {
            var target = FindNearestEnemy();
            if (target == null) return false;

            var projectile = GetPooled(projectiles);
            projectile.Activate(
                playerRoot.position,
                target.transform.position - playerRoot.position,
                config.projectileSpeed,
                damage,
                pierce,
                config.projectileLifetime,
                statusApplicationRequest);
            return true;
        }'''
          new = '''        public bool FireGameplayProjectile(
            float damage,
            int pierce,
            EnemyStatusApplicationRequest? statusApplicationRequest)
        {
            var target = FindNearestEnemy();
            return FireGameplayProjectileAtTarget(target, damage, pierce, statusApplicationRequest);
        }

        public bool FireGameplayProjectileAtTarget(
            U2EnemyActor target,
            float damage,
            int pierce,
            EnemyStatusApplicationRequest? statusApplicationRequest = null)
        {
            if (target == null || !target.IsTargetable) return false;

            var projectile = GetPooled(projectiles);
            projectile.Activate(
                playerRoot.position,
                target.transform.position - playerRoot.position,
                config.projectileSpeed,
                damage,
                pierce,
                config.projectileLifetime,
                statusApplicationRequest);
            return true;
        }'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one projectile overload anchor, got {count}')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/u2-targeted-projectile-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add unity/VampPonUnity/Assets/_Project/Scripts/Runtime/U2BattleController.cs .github/workflows/u2-targeted-projectile-one-shot.yml
          git commit -m 'feat: add explicit target projectile primitive'
          git push origin HEAD:agent/unity-targeted-projectile-primitive-v1

name: Character Ordinary Life Reservoir

on:
  pull_request:
    paths:
      - 'docs/00-current-story-world-master.md'
      - 'docs/character-personal-profile-canon-v1.md'
      - 'docs/character-reality-root-registry-v1.md'
      - 'docs/character-ordinary-life-reservoir-v1.md'
      - 'src/game/data/seasonArchitecture.ts'
      - 'src/game/data/characterOrdinaryLifeReservoir.ts'
      - 'scripts/quality/check-character-ordinary-life-reservoir.ts'
      - '.github/workflows/character-ordinary-life-reservoir.yml'
  push:
    branches: [main]
    paths:
      - 'docs/00-current-story-world-master.md'
      - 'docs/character-personal-profile-canon-v1.md'
      - 'docs/character-reality-root-registry-v1.md'
      - 'docs/character-ordinary-life-reservoir-v1.md'
      - 'src/game/data/seasonArchitecture.ts'
      - 'src/game/data/characterOrdinaryLifeReservoir.ts'
      - 'scripts/quality/check-character-ordinary-life-reservoir.ts'
      - '.github/workflows/character-ordinary-life-reservoir.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 36-character ordinary-life reservoir and Canon boundaries
        run: node --experimental-strip-types scripts/quality/check-character-ordinary-life-reservoir.ts

name: Core5 Color Application Master

on:
  pull_request:
    paths:
      - 'docs/visual/core5-color-application-master-v1.md'
      - 'data/visual/core5-color-application-master-v1.json'
      - 'src/game/data/characterThemeColors.ts'
      - 'src/game/data/characterReferenceGenerationHandoff.ts'
      - 'tools/asset-factory/scripts/export-character-asset-prompt.ts'
      - 'scripts/quality/check-core5-color-application-master.ts'
      - '.github/workflows/core5-color-application-master.yml'
  push:
    branches: [main]
    paths:
      - 'docs/visual/core5-color-application-master-v1.md'
      - 'data/visual/core5-color-application-master-v1.json'
      - 'src/game/data/characterThemeColors.ts'
      - 'src/game/data/characterReferenceGenerationHandoff.ts'
      - 'tools/asset-factory/scripts/export-character-asset-prompt.ts'
      - 'scripts/quality/check-core5-color-application-master.ts'
      - '.github/workflows/core5-color-application-master.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Core5 color application master
        run: node --experimental-strip-types scripts/quality/check-core5-color-application-master.ts
      - name: Smoke-test resolved Core5 color prompt
        run: |
          node --experimental-strip-types tools/asset-factory/scripts/export-character-asset-prompt.ts \
            --character yui --kind character_reference --format json --output /tmp/yui-color.json
          node --experimental-strip-types tools/asset-factory/scripts/export-character-asset-prompt.ts \
            --character asa --kind character_reference --format json --output /tmp/asa-color.json
          node - <<'NODE'
          const yui = require('/tmp/yui-color.json');
          const asa = require('/tmp/asa-color.json');
          for (const [id, x, theme, accent] of [
            ['yui', yui, '#264A86', '#F6B44B'],
            ['asa', asa, '#F4A7B9', '#F7D94C'],
          ]) {
            if (!x.authorityOrder.includes('docs/visual/core5-color-application-master-v1.md')) throw new Error(`${id}: color master missing from authority order`);
            if (!x.core5ColorApplicationProfile) throw new Error(`${id}: resolved color profile missing`);
            if (x.core5ColorApplicationProfile.canonical.themeHex !== theme) throw new Error(`${id}: theme hex mismatch`);
            if (x.core5ColorApplicationProfile.canonical.accentHex !== accent) throw new Error(`${id}: accent hex mismatch`);
            if (x.unknownColorMayBeInventedByImageModel !== false) throw new Error(`${id}: unknown color policy weakened`);
            if (!x.prompt.includes('CORE5 COLOR APPLICATION MASTER — REQUIRED COLOR AUTHORITY.')) throw new Error(`${id}: prompt block missing`);
          }
          NODE

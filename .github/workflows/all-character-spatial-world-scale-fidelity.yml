name: All Character Spatial World Scale Fidelity Master

on:
  pull_request:
    paths:
      - 'docs/visual/all-character-spatial-world-scale-fidelity-master-v1.md'
      - 'data/visual/all-character-spatial-world-scale-fidelity-master-v1.json'
      - 'data/visual/character-production-generation-entrypoint-v1.json'
      - 'tools/asset-factory/scripts/export-production-character-design-prompt.ts'
      - 'scripts/quality/check-all-character-spatial-world-scale-fidelity.mjs'
      - '.github/workflows/all-character-spatial-world-scale-fidelity.yml'
  push:
    branches: [main]
    paths:
      - 'docs/visual/all-character-spatial-world-scale-fidelity-master-v1.md'
      - 'data/visual/all-character-spatial-world-scale-fidelity-master-v1.json'
      - 'data/visual/character-production-generation-entrypoint-v1.json'
      - 'tools/asset-factory/scripts/export-production-character-design-prompt.ts'
      - 'scripts/quality/check-all-character-spatial-world-scale-fidelity.mjs'
      - '.github/workflows/all-character-spatial-world-scale-fidelity.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all-character spatial world-scale fidelity authority
        run: node scripts/quality/check-all-character-spatial-world-scale-fidelity.mjs

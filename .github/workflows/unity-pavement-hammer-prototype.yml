name: unity-pavement-hammer-prototype

on:
  pull_request:
    paths:
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/SelectedBaseWeapons/PavementHammerPrototypeRuntime.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/SelectedBaseWeapons/PavementHammerPrototypeRuntime.cs.meta'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2EnemySlamWaveQueryRuntime.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2EnemyKnockbackRuntime.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2EnemyBreakStaggerRuntime.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Status/EnemyStatusRuntimeState.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Status/EnemyStatusApplicationRequest.cs'
      - 'src/game/data/title1BaseWeaponRuntimeAdmissionSource.ts'
      - 'scripts/quality/check-unity-pavement-hammer-prototype.ts'
      - 'scripts/quality/check-unity-break-stagger-primitive.ts'
      - 'scripts/quality/check-unity-slam-wave-query-primitive.ts'
      - 'scripts/quality/check-title1-base-weapon-runtime-admission.ts'
      - 'scripts/quality/unity-pavement-hammer/**'
      - 'docs/unity-pavement-hammer-prototype-v1.md'
      - 'docs/unity-break-stagger-primitive-v1.md'
      - 'docs/unity-slam-wave-query-primitive-v1.md'
      - 'docs/title1-base-weapon-runtime-admission-v1.md'
      - '.github/workflows/unity-pavement-hammer-prototype.yml'
  push:
    branches: [main]
    paths:
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/SelectedBaseWeapons/PavementHammerPrototypeRuntime.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/SelectedBaseWeapons/PavementHammerPrototypeRuntime.cs.meta'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2EnemySlamWaveQueryRuntime.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2EnemyKnockbackRuntime.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2EnemyBreakStaggerRuntime.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Status/EnemyStatusRuntimeState.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Status/EnemyStatusApplicationRequest.cs'
      - 'src/game/data/title1BaseWeaponRuntimeAdmissionSource.ts'
      - 'scripts/quality/check-unity-pavement-hammer-prototype.ts'
      - 'scripts/quality/check-unity-break-stagger-primitive.ts'
      - 'scripts/quality/check-unity-slam-wave-query-primitive.ts'
      - 'scripts/quality/check-title1-base-weapon-runtime-admission.ts'
      - 'scripts/quality/unity-pavement-hammer/**'
      - 'docs/unity-pavement-hammer-prototype-v1.md'
      - 'docs/unity-break-stagger-primitive-v1.md'
      - 'docs/unity-slam-wave-query-primitive-v1.md'
      - 'docs/title1-base-weapon-runtime-admission-v1.md'
      - '.github/workflows/unity-pavement-hammer-prototype.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check Pavement Hammer prototype caller
        run: node --experimental-strip-types scripts/quality/check-unity-pavement-hammer-prototype.ts
      - name: Compile and execute Pavement Hammer contract
        run: |
          dotnet build scripts/quality/unity-pavement-hammer/UnityPavementHammer.Contract.csproj --configuration Release --nologo
          dotnet run --project scripts/quality/unity-pavement-hammer/UnityPavementHammer.Contract.csproj --configuration Release --no-build
      - name: Re-check break stagger primitive
        run: node --experimental-strip-types scripts/quality/check-unity-break-stagger-primitive.ts
      - name: Re-check slam wave primitive
        run: node --experimental-strip-types scripts/quality/check-unity-slam-wave-query-primitive.ts
      - name: Re-check Title1 Base Weapon runtime admission
        run: node --experimental-strip-types scripts/quality/check-title1-base-weapon-runtime-admission.ts
      - name: Re-check Title1 Content Master integrity
        run: node --experimental-strip-types scripts/quality/check-title1-content-master-integrity.ts

name: PR169 Runtime Projectile Recovery Launcher

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  recover:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/unity-multitarget-admission-drift'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unity-multitarget-admission-drift
      - name: Execute guarded recovery payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          payload = Path('.github/workflows/runtime-projectile-recovery-one-shot.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = payload.index(marker) + len(marker)
          end = payload.index("\n          PY\n", start)
          lines = payload[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          Path('/tmp/runtime-projectile-recovery.py').write_text(script + '\n')
          PY
          python /tmp/runtime-projectile-recovery.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore actual Unity projectile runtime primitives'
          git push origin HEAD:fix/unity-multitarget-admission-drift

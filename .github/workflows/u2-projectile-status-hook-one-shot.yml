name: U2 Projectile Runtime Recovery Launcher

on:
  push:
    branches: [fix/unity-multitarget-admission-drift]
    paths:
      - '.github/workflows/u2-projectile-status-hook-one-shot.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unity-multitarget-admission-drift
      - name: Execute current-architecture recovery payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          payload = Path('.github/workflows/runtime-projectile-recovery-one-shot.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = payload.index(marker) + len(marker)
          end = payload.index("\n          PY\n", start)
          script = textwrap.dedent(payload[start:end])
          Path('/tmp/runtime-projectile-recovery.py').write_text(script)
          PY
          python /tmp/runtime-projectile-recovery.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore actual Unity projectile runtime primitives'
          git push origin HEAD:fix/unity-multitarget-admission-drift

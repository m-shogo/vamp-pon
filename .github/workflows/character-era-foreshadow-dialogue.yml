name: Character Era Foreshadow Dialogue

on:
  pull_request:
    paths:
      - 'docs/character-era-foreshadow-dialogue-reservoir-v1.md'
      - 'src/game/data/characterEraForeshadowDialogueReservoir.ts'
      - 'scripts/quality/check-character-era-foreshadow-dialogue.ts'
      - 'src/game/data/characterRealityRootRegistry.ts'
      - 'src/game/data/seasonArchitecture.ts'
      - '.github/workflows/character-era-foreshadow-dialogue.yml'
  push:
    branches: [main]
    paths:
      - 'docs/character-era-foreshadow-dialogue-reservoir-v1.md'
      - 'src/game/data/characterEraForeshadowDialogueReservoir.ts'
      - 'scripts/quality/check-character-era-foreshadow-dialogue.ts'
      - 'src/game/data/characterRealityRootRegistry.ts'
      - 'src/game/data/seasonArchitecture.ts'
      - '.github/workflows/character-era-foreshadow-dialogue.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 36-character era, foreshadow, dialogue boundaries
        run: node --experimental-strip-types scripts/quality/check-character-era-foreshadow-dialogue.ts

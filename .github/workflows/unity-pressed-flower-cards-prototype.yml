name: unity-pressed-flower-cards-prototype

on:
  pull_request:
    paths:
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/SelectedBaseWeapons/PressedFlowerCardsPrototypeRuntime.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/SelectedBaseWeapons/PressedFlowerCardsPrototypeRuntime.cs.meta'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2PersistentTrapRuntime.cs'
      - 'src/game/data/baseWeaponSelectionSource.ts'
      - 'src/game/data/title1BaseWeaponRuntimeAdmissionSource.ts'
      - 'scripts/quality/check-unity-pressed-flower-cards-prototype.ts'
      - 'scripts/quality/unity-pressed-flower-cards/**'
      - 'docs/unity-pressed-flower-cards-prototype-v1.md'
      - '.github/workflows/unity-pressed-flower-cards-prototype.yml'
  push:
    branches: [main]
    paths:
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/SelectedBaseWeapons/PressedFlowerCardsPrototypeRuntime.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/SelectedBaseWeapons/PressedFlowerCardsPrototypeRuntime.cs.meta'
      - 'src/game/data/title1BaseWeaponRuntimeAdmissionSource.ts'
      - 'scripts/quality/check-unity-pressed-flower-cards-prototype.ts'
      - 'scripts/quality/unity-pressed-flower-cards/**'
      - 'docs/unity-pressed-flower-cards-prototype-v1.md'
      - '.github/workflows/unity-pressed-flower-cards-prototype.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check Pressed Flower Cards staged caller proof
        run: node --experimental-strip-types scripts/quality/check-unity-pressed-flower-cards-prototype.ts
      - name: Compile and execute Pressed Flower Cards contract
        run: dotnet run --project scripts/quality/unity-pressed-flower-cards/UnityPressedFlowerCards.Contract.csproj --configuration Release
      - name: Re-check trap persistence foundation
        run: node --experimental-strip-types scripts/quality/check-unity-trap-persistence-primitive.ts
      - name: Re-check Title1 Base Weapon admission
        run: node --experimental-strip-types scripts/quality/check-title1-base-weapon-runtime-admission.ts
      - name: Re-check Title1 Content Master integrity
        run: node --experimental-strip-types scripts/quality/check-title1-content-master-integrity.ts

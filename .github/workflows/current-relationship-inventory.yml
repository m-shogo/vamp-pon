name: Current Relationship Inventory

on:
  pull_request:
    paths:
      - 'src/game/data/currentRelationshipInventory.ts'
      - 'docs/RELATIONSHIPS.md'
      - 'docs/design-targets/generated/character-relationship-arc-map-v1.json'
      - 'scripts/quality/check-current-relationship-inventory.ts'
      - '.github/workflows/current-relationship-inventory.yml'
  push:
    branches: [main]
    paths:
      - 'src/game/data/currentRelationshipInventory.ts'
      - 'docs/RELATIONSHIPS.md'
      - 'docs/design-targets/generated/character-relationship-arc-map-v1.json'
      - 'scripts/quality/check-current-relationship-inventory.ts'
      - '.github/workflows/current-relationship-inventory.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Current24 relationship inventory
        run: node --experimental-strip-types scripts/quality/check-current-relationship-inventory.ts

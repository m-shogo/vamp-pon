name: unity-return-compass-needle-prototype

on:
  pull_request:
    paths:
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/SelectedBaseWeapons/ReturnCompassNeedlePrototypeRuntime.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/SelectedBaseWeapons/ReturnCompassNeedlePrototypeRuntime.cs.meta'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2ReturningWaypointMotionRuntime.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2EnemyHomingPrioritySelectionRuntime.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Status/EnemyStatusRuntimeState.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Status/EnemyStatusApplicationRequest.cs'
      - 'src/game/data/baseWeaponSelectionSource.ts'
      - 'src/game/data/title1BaseWeaponRuntimeAdmissionSource.ts'
      - 'scripts/quality/check-unity-return-compass-needle-prototype.ts'
      - 'scripts/quality/unity-return-compass-needle/**'
      - 'docs/unity-return-compass-needle-prototype-v1.md'
      - '.github/workflows/unity-return-compass-needle-prototype.yml'
  push:
    branches: [main]
    paths:
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/SelectedBaseWeapons/ReturnCompassNeedlePrototypeRuntime.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/SelectedBaseWeapons/ReturnCompassNeedlePrototypeRuntime.cs.meta'
      - 'scripts/quality/check-unity-return-compass-needle-prototype.ts'
      - 'scripts/quality/unity-return-compass-needle/**'
      - 'docs/unity-return-compass-needle-prototype-v1.md'
      - '.github/workflows/unity-return-compass-needle-prototype.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check Return Compass Needle staged caller proof
        run: node --experimental-strip-types scripts/quality/check-unity-return-compass-needle-prototype.ts
      - name: Compile and execute Return Compass Needle contract
        run: |
          dotnet build scripts/quality/unity-return-compass-needle/UnityReturnCompassNeedle.Contract.csproj --configuration Release --nologo
          dotnet run --project scripts/quality/unity-return-compass-needle/UnityReturnCompassNeedle.Contract.csproj --configuration Release --no-build
      - name: Re-check returning waypoint foundation
        run: node --experimental-strip-types scripts/quality/check-unity-returning-waypoint-motion.ts
      - name: Re-check homing priority selector
        run: node --experimental-strip-types scripts/quality/check-unity-homing-priority-selection-primitive.ts
      - name: Re-check Title1 Base Weapon admission
        run: node --experimental-strip-types scripts/quality/check-title1-base-weapon-runtime-admission.ts
      - name: Re-check Title1 Content Master integrity
        run: node --experimental-strip-types scripts/quality/check-title1-content-master-integrity.ts

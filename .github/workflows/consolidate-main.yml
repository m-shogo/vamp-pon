name: Consolidate Main

on:
  push:
    paths:
      - .github/workflows/consolidate-main.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge remaining visual branch onto current main
        env:
          TARGET_BRANCH: integration/main-consolidation-20260809
          VISUAL_BRANCH: agent/top-living-night-key-art-v1
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$VISUAL_BRANCH"
          git checkout -B "$TARGET_BRANCH" origin/main
          git merge --no-ff -X ours "origin/$VISUAL_BRANCH" \
            -m "merge: consolidate PR78 visual work onto current main"
          git push --force-with-lease origin "$TARGET_BRANCH"

# one-shot consolidation; remove after main is clean

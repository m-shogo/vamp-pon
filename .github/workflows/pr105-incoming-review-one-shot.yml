name: PR105 Incoming Visual Review One Shot

on:
  push:
    branches: [art/top-core5-v3-incoming-batch]
    paths:
      - 'docs/design-targets/generated/top-living-night-v3/incoming/**'
      - '.github/workflows/pr105-incoming-review-one-shot.yml'

permissions:
  contents: read

jobs:
  package-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build review contact sheets
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw

          root = Path('docs/design-targets/generated/top-living-night-v3/incoming')
          out = Path('artifacts/pr105-incoming-review')
          out.mkdir(parents=True, exist_ok=True)

          def sheet(paths, dest, cols=3, thumb=(260, 564), label_h=36):
              items = []
              for p in paths:
                  im = Image.open(p).convert('RGBA')
                  canvas = Image.new('RGBA', (thumb[0], thumb[1] + label_h), (24,24,24,255))
                  fitted = ImageOps.contain(im, thumb)
                  x = (thumb[0] - fitted.width)//2
                  y = (thumb[1] - fitted.height)//2
                  canvas.alpha_composite(fitted, (x,y))
                  d = ImageDraw.Draw(canvas)
                  d.text((8, thumb[1]+8), p.name, fill=(255,255,255,255))
                  items.append(canvas.convert('RGB'))
              rows = (len(items)+cols-1)//cols
              page = Image.new('RGB', (cols*thumb[0], rows*(thumb[1]+label_h)), (15,15,15))
              for i, im in enumerate(items):
                  page.paste(im, ((i%cols)*thumb[0], (i//cols)*(thumb[1]+label_h)))
              page.save(dest, quality=92)

          candidate = [root/'top-living-night-core5-candidate-430x932.png']
          variants = sorted((root/'variants').glob('*.png'))
          layers = sorted((root/'layers').glob('*.png'))
          effects = sorted((root/'effects').glob('*.png'))

          sheet(candidate + variants, out/'candidate-variants-contact-sheet.jpg', cols=4, thumb=(215,466))
          sheet(layers, out/'structural-layers-contact-sheet.jpg', cols=3, thumb=(215,466))
          sheet(effects, out/'effects-contact-sheet.jpg', cols=5, thumb=(170,370))

          # Copy originals for full-resolution review.
          import shutil
          for src in [*candidate, *variants, *layers, *effects]:
              rel = src.relative_to(root)
              dst = out/'originals'/rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          PY

      - name: Upload incoming visual review pack
        uses: actions/upload-artifact@v4
        with:
          name: pr105-incoming-visual-review-${{ github.sha }}
          path: artifacts/pr105-incoming-review
          retention-days: 3

name: PR93 Head Cleanup One Shot

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-merged-head:
    runs-on: ubuntu-latest
    steps:
      - name: Delete PR93 head only when exact merged provenance matches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          branch='feature/top-final-effect-companion-pack'

          state="$(gh api "repos/${repo}/pulls/93" --jq '.state')"
          merged_at="$(gh api "repos/${repo}/pulls/93" --jq '.merged_at // ""')"
          head_ref="$(gh api "repos/${repo}/pulls/93" --jq '.head.ref')"
          head_sha="$(gh api "repos/${repo}/pulls/93" --jq '.head.sha')"

          if [ "$state" != 'closed' ] || [ -z "$merged_at" ]; then
            echo 'PR #93 is not merged; refusing cleanup.'
            exit 1
          fi
          if [ "$head_ref" != "$branch" ]; then
            echo "PR #93 head ref changed: ${head_ref}"
            exit 1
          fi

          response="$(gh api "repos/${repo}/git/ref/heads/${branch}" 2>/dev/null || true)"
          if [ -z "$response" ]; then
            echo "Already absent: ${branch}"
            exit 0
          fi
          branch_sha="$(printf '%s' "$response" | jq -r '.object.sha // empty')"
          if [ -z "$branch_sha" ] || [ "$branch_sha" != "$head_sha" ]; then
            echo "Branch moved or ref lookup failed: branch=${branch_sha} pr=${head_sha}"
            exit 1
          fi

          gh api --method DELETE "repos/${repo}/git/refs/heads/${branch}"
          echo "Deleted exact merged PR #93 head: ${branch}@${head_sha}"

name: Runtime Projectile Recovery One Shot

on:
  push:
    branches: [fix/unity-multitarget-admission-drift]
    paths:
      - '.github/workflows/runtime-projectile-recovery-one-shot.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unity-multitarget-admission-drift
      - name: Restore projectile Status targeted and multi-target runtime primitives
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          battle = Path('unity/VampPonUnity/Assets/_Project/Scripts/Runtime/U2BattleController.cs')
          text = battle.read_text()

          old_lists = '''        private readonly List<U2VfxActor> vfxActors = new(48);
        private readonly List<U2EnemyActor> activeEnemies = new(64);
'''
          new_lists = '''        private readonly List<U2VfxActor> vfxActors = new(48);
        private readonly List<U2EnemyActor> activeEnemies = new(64);
        private readonly List<U2EnemyActor> nearestEnemyTargetScratch = new(8);
'''
          if text.count(old_lists) != 1:
              raise SystemExit(f'list anchor mismatch: {text.count(old_lists)}')
          text = text.replace(old_lists, new_lists)

          old_fire = '''        public bool FireGameplayProjectile(float damage, int pierce)
        {
            var target = FindNearestEnemy();
            var projectile = FirstInactive(projectiles);
            if (target == null || projectile == null) return false;
            projectile.Activate(player.position, target, config.projectileSpeed, damage, pierce);
            feedbackBridge?.PlayWeaponFire(); FiredProjectileCount++; PlayerAttackFired?.Invoke(); return true;
        }
'''
          new_fire = '''        public bool FireGameplayProjectile(float damage, int pierce)
            => FireGameplayProjectile(damage, pierce, null);

        public bool FireGameplayProjectile(
            float damage,
            int pierce,
            EnemyStatusApplicationRequest? statusApplicationRequest)
        {
            var target = FindNearestEnemy();
            return FireGameplayProjectileAtTarget(target, damage, pierce, statusApplicationRequest);
        }

        public bool FireGameplayProjectileAtTarget(
            U2EnemyActor target,
            float damage,
            int pierce,
            EnemyStatusApplicationRequest? statusApplicationRequest = null)
        {
            if (target == null || !target.IsTargetable) return false;
            var projectile = FirstInactive(projectiles);
            if (projectile == null) return false;
            projectile.Activate(player.position, target, config.projectileSpeed, damage, pierce, statusApplicationRequest);
            feedbackBridge?.PlayWeaponFire();
            FiredProjectileCount++;
            PlayerAttackFired?.Invoke();
            return true;
        }

        public int FireGameplayProjectilesAtNearestTargets(
            float damage,
            int pierce,
            int maxTargets,
            EnemyStatusApplicationRequest? statusApplicationRequest = null)
        {
            if (maxTargets <= 0) return 0;
            nearestEnemyTargetScratch.Clear();
            for (var enemyIndex = 0; enemyIndex < enemies.Count; enemyIndex++)
            {
                var enemy = enemies[enemyIndex];
                if (enemy != null && enemy.IsTargetable) nearestEnemyTargetScratch.Add(enemy);
            }
            if (nearestEnemyTargetScratch.Count == 0) return 0;

            var targetCount = Math.Min(maxTargets, nearestEnemyTargetScratch.Count);
            SortNearestEnemyScratchPrefix(targetCount);
            var fired = 0;
            for (var i = 0; i < targetCount; i++)
            {
                if (FireGameplayProjectileAtTarget(
                    nearestEnemyTargetScratch[i],
                    damage,
                    pierce,
                    statusApplicationRequest)) fired++;
            }
            return fired;
        }

        private void SortNearestEnemyScratchPrefix(int targetCount)
        {
            for (var i = 0; i < targetCount; i++)
            {
                var nearestIndex = i;
                var nearestDistance = DistanceSquaredFromPlayer(nearestEnemyTargetScratch[i]);
                var nearestPoolOrder = PoolOrderOf(nearestEnemyTargetScratch[i]);
                for (var candidateIndex = i + 1; candidateIndex < nearestEnemyTargetScratch.Count; candidateIndex++)
                {
                    var candidate = nearestEnemyTargetScratch[candidateIndex];
                    var candidateDistance = DistanceSquaredFromPlayer(candidate);
                    var candidatePoolOrder = PoolOrderOf(candidate);
                    if (candidateDistance < nearestDistance ||
                        (Math.Abs(candidateDistance - nearestDistance) <= 0.0001f && candidatePoolOrder < nearestPoolOrder))
                    {
                        nearestIndex = candidateIndex;
                        nearestDistance = candidateDistance;
                        nearestPoolOrder = candidatePoolOrder;
                    }
                }
                if (nearestIndex == i) continue;
                var swap = nearestEnemyTargetScratch[i];
                nearestEnemyTargetScratch[i] = nearestEnemyTargetScratch[nearestIndex];
                nearestEnemyTargetScratch[nearestIndex] = swap;
            }
        }

        private float DistanceSquaredFromPlayer(U2EnemyActor enemy)
            => (enemy.transform.position - player.position).sqrMagnitude;

        private int PoolOrderOf(U2EnemyActor enemy) => enemies.IndexOf(enemy);
'''
          if text.count(old_fire) != 1:
              raise SystemExit(f'fire anchor mismatch: {text.count(old_fire)}')
          text = text.replace(old_fire, new_fire)

          old_hit = '''                    var hitPosition = projectile.transform.position;
                    var hitTarget = projectile.Target;
                    projectile.ConsumeHit();
                    var defeated = hitTarget.TakeDamage(projectile.Damage > 0f ? projectile.Damage : config.projectileDamage, config.damageFlashSeconds);
                    feedbackBridge?.PlayEnemyHit();
'''
          new_hit = '''                    var hitPosition = projectile.transform.position;
                    var hitTarget = projectile.Target;
                    var defeated = hitTarget.TakeDamage(projectile.Damage > 0f ? projectile.Damage : config.projectileDamage, config.damageFlashSeconds);
                    if (!defeated) projectile.ApplyStatusOnHit(hitTarget);
                    projectile.ConsumeHit();
                    feedbackBridge?.PlayEnemyHit();
'''
          if text.count(old_hit) != 1:
              raise SystemExit(f'hit anchor mismatch: {text.count(old_hit)}')
          text = text.replace(old_hit, new_hit)

          old_projectile_fields = '''        private Vector3 direction;
        private float speed;
        private float lifeSeconds;

        public U2EnemyActor Target { get; private set; }
        public float Damage { get; private set; }
        public int PierceRemaining { get; private set; }
'''
          new_projectile_fields = '''        private Vector3 direction;
        private float speed;
        private float lifeSeconds;
        private EnemyStatusApplicationRequest? statusApplicationRequest;

        public U2EnemyActor Target { get; private set; }
        public float Damage { get; private set; }
        public int PierceRemaining { get; private set; }
        public bool HasStatusApplication => statusApplicationRequest.HasValue;
'''
          if text.count(old_projectile_fields) != 1:
              raise SystemExit(f'projectile fields anchor mismatch: {text.count(old_projectile_fields)}')
          text = text.replace(old_projectile_fields, new_projectile_fields)

          old_activate = '''        public void Activate(Vector3 origin, U2EnemyActor target, float projectileSpeed, float damage, int pierce)
        {
            Target = target;
            Damage = damage;
            PierceRemaining = Mathf.Max(0, pierce);
            speed = projectileSpeed;
            lifeSeconds = 1.8f;
            transform.position = origin;
            var targetPosition = target != null ? target.transform.position : origin + Vector3.up;
            direction = (targetPosition - origin).sqrMagnitude > 0.0001f ? (targetPosition - origin).normalized : Vector3.up;
            IsActive = true;
            gameObject.SetActive(true);
        }

        public void ConsumeHit()
'''
          new_activate = '''        public void Activate(Vector3 origin, U2EnemyActor target, float projectileSpeed, float damage, int pierce)
            => Activate(origin, target, projectileSpeed, damage, pierce, null);

        public void Activate(
            Vector3 origin,
            U2EnemyActor target,
            float projectileSpeed,
            float damage,
            int pierce,
            EnemyStatusApplicationRequest? statusApplicationRequest)
        {
            Target = target;
            Damage = damage;
            PierceRemaining = Mathf.Max(0, pierce);
            speed = projectileSpeed;
            lifeSeconds = 1.8f;
            this.statusApplicationRequest = statusApplicationRequest;
            transform.position = origin;
            var targetPosition = target != null ? target.transform.position : origin + Vector3.up;
            direction = (targetPosition - origin).sqrMagnitude > 0.0001f ? (targetPosition - origin).normalized : Vector3.up;
            IsActive = true;
            gameObject.SetActive(true);
        }

        public EnemyStatusApplyResult? ApplyStatusOnHit(U2EnemyActor target)
        {
            if (target == null || !statusApplicationRequest.HasValue) return null;
            return statusApplicationRequest.Value.ApplyTo(target.Statuses);
        }

        public override void Deactivate()
        {
            statusApplicationRequest = null;
            Target = null;
            base.Deactivate();
        }

        public void ConsumeHit()
'''
          if text.count(old_activate) != 1:
              raise SystemExit(f'projectile activate anchor mismatch: {text.count(old_activate)}')
          text = text.replace(old_activate, new_activate)
          battle.write_text(text)

          evidence = Path('scripts/unity/u47-simulator-evidence-sources.ts')
          text = evidence.read_text()
          anchor = "  if (file.endsWith('U2BattleController.cs')) normalized = normalized\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'evidence U2 anchor mismatch: {text.count(anchor)}')

          recovery_normalizer = r'''  // Projectile Status / targeted / multi-target primitives below have zero live Selected16 callers.
  // Normalize only these unreachable reusable primitives for historical U47 evidence. Never normalize coordinator call-sites.
  if (file.endsWith('U2BattleController.cs')) normalized = normalized
      .replace('        private readonly List<U2EnemyActor> nearestEnemyTargetScratch = new(8);\n', '')
      .replace(`''' + new_fire.rstrip() + r'''`, `''' + old_fire.rstrip() + r'''`)
      .replace(`''' + new_hit.rstrip() + r'''`, `''' + old_hit.rstrip() + r'''`)
      .replace(`''' + new_projectile_fields.rstrip() + r'''`, `''' + old_projectile_fields.rstrip() + r'''`)
      .replace(`''' + new_activate.rstrip() + r'''`, `''' + old_activate.rstrip() + r'''`);
'''
          text = text.replace(anchor, recovery_normalizer + anchor)
          evidence.write_text(text)

          # Replace stale PR-specific checkers with permanent current-architecture semantic contracts.
          Path('scripts/quality/check-unity-projectile-status-application-hook.ts').write_text(r'''import { readFileSync } from 'node:fs';

import { title1BaseWeaponRuntimeAdmissionSummary } from '../../src/game/data/title1BaseWeaponRuntimeAdmissionSource.ts';

function assert(condition: unknown, message: string): asserts condition {
  if (!condition) throw new Error(message);
}

const battleSource = readFileSync(new URL('../../unity/VampPonUnity/Assets/_Project/Scripts/Runtime/U2BattleController.cs', import.meta.url), 'utf8');
const coordinatorSource = readFileSync(new URL('../../unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Stage1GameplayRuntimeCoordinator.cs', import.meta.url), 'utf8');
const requestSource = readFileSync(new URL('../../unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Status/EnemyStatusApplicationRequest.cs', import.meta.url), 'utf8');
const evidenceSource = readFileSync(new URL('../unity/u47-simulator-evidence-sources.ts', import.meta.url), 'utf8');

assert(requestSource.includes('public readonly struct EnemyStatusApplicationRequest'), 'typed Status application request missing');
assert(requestSource.includes('EnemyStatusRuntimeKind kind'), 'request must carry typed Status kind');
assert(requestSource.includes('EnemyStatusApplicationPolicy policy'), 'request must carry exact caller application policy');
assert(requestSource.includes('return state.Apply(Kind, Policy);'), 'request must delegate to shared Status policy semantics');
assert(!requestSource.includes('durationSeconds:'), 'request type must not hide hard-coded duration defaults');

assert(battleSource.includes('public bool FireGameplayProjectile(float damage, int pierce)\n            => FireGameplayProjectile(damage, pierce, null);'), 'legacy projectile API must remain source-compatible');
assert(battleSource.includes('EnemyStatusApplicationRequest? statusApplicationRequest'), 'projectile APIs must accept optional typed Status request');
assert(battleSource.includes('private EnemyStatusApplicationRequest? statusApplicationRequest;'), 'pooled projectile must own optional Status request state');
assert(battleSource.includes('public bool HasStatusApplication => statusApplicationRequest.HasValue;'), 'projectile request state must be observable for verification');
assert(battleSource.includes('this.statusApplicationRequest = statusApplicationRequest;'), 'projectile Activate must capture request');
assert(battleSource.includes('statusApplicationRequest = null;\n            Target = null;\n            base.Deactivate();'), 'projectile Deactivate must clear request and target before pooling');
assert(battleSource.includes('return statusApplicationRequest.Value.ApplyTo(target.Statuses);'), 'projectile Status hook must route through U2EnemyActor shared Status state');

const damage = battleSource.indexOf('var defeated = hitTarget.TakeDamage(');
const apply = battleSource.indexOf('if (!defeated) projectile.ApplyStatusOnHit(hitTarget);');
const consume = battleSource.indexOf('projectile.ConsumeHit();', damage);
assert(damage >= 0 && apply > damage && consume > apply, 'same-hit order must be damage -> surviving Status application -> projectile consume');

assert(coordinatorSource.includes('battle.FireGameplayProjectile(effect.damage * damageMultiplier, effect.pierce)'), 'current live coordinator must still use legacy no-request path');
assert(!coordinatorSource.includes('EnemyStatusApplicationRequest'), 'no live Selected16 Status request caller may be invented by the generic hook recovery');
assert(evidenceSource.includes('Projectile Status / targeted / multi-target primitives below have zero live Selected16 callers.'), 'historical evidence normalizer must document unreachable primitive boundary');
assert(!evidenceSource.includes(".replace('battle.FireGameplayProjectile(effect.damage * damageMultiplier, effect.pierce)'"), 'normalizer must never hide a future live coordinator Status call-site');

assert(title1BaseWeaponRuntimeAdmissionSummary.unityAdmittedRuntimeCount === 0, 'generic hook recovery must not admit Selected16');
assert(title1BaseWeaponRuntimeAdmissionSummary.statusApplicationBlockedWeaponCount === 16, 'STATUS_APPLICATION remains blocked until a real Selected16 caller exists');

console.log(JSON.stringify({ status: 'PASS', typedRequest: true, damageBeforeStatus: true, pooledRequestReset: true, liveStatusRequestCallers: 0 }, null, 2));
''')

          Path('scripts/quality/check-unity-targeted-projectile-primitive.ts').write_text(r'''import { readFileSync } from 'node:fs';

import { title1BaseWeaponRuntimeAdmissionSummary } from '../../src/game/data/title1BaseWeaponRuntimeAdmissionSource.ts';

function assert(condition: unknown, message: string): asserts condition {
  if (!condition) throw new Error(message);
}

const battleSource = readFileSync(new URL('../../unity/VampPonUnity/Assets/_Project/Scripts/Runtime/U2BattleController.cs', import.meta.url), 'utf8');
const coordinatorSource = readFileSync(new URL('../../unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Stage1GameplayRuntimeCoordinator.cs', import.meta.url), 'utf8');
const evidenceSource = readFileSync(new URL('../unity/u47-simulator-evidence-sources.ts', import.meta.url), 'utf8');

assert(battleSource.includes('public bool FireGameplayProjectileAtTarget('), 'explicit target projectile primitive missing');
assert(battleSource.includes('U2EnemyActor target,'), 'targeted primitive must accept typed enemy actor');
assert(battleSource.includes('EnemyStatusApplicationRequest? statusApplicationRequest = null'), 'targeted primitive must preserve optional Status transport');
assert(battleSource.includes('if (target == null || !target.IsTargetable) return false;'), 'targeted primitive must fail closed for null/non-targetable target');
assert(battleSource.includes('var projectile = FirstInactive(projectiles);'), 'targeted primitive must reuse current projectile pool');
assert(battleSource.includes('projectile.Activate(player.position, target, config.projectileSpeed, damage, pierce, statusApplicationRequest);'), 'targeted primitive must preserve current target-based projectile architecture');
assert(battleSource.includes('return FireGameplayProjectileAtTarget(target, damage, pierce, statusApplicationRequest);'), 'nearest API must delegate to canonical targeted spawn');
assert(battleSource.match(/public bool FireGameplayProjectileAtTarget\(/g)?.length === 1, 'targeted spawn must have one canonical implementation');

assert(coordinatorSource.includes('battle.FireGameplayProjectile(effect.damage * damageMultiplier, effect.pierce)'), 'live Stage1 coordinator must remain nearest-target before Candidate vertical slice');
assert(!coordinatorSource.includes('FireGameplayProjectileAtTarget'), 'live coordinator must not select explicit targets yet');
assert(battleSource.includes('FireGameplayProjectilesAtNearestTargets'), 'later multi-target primitive must compose the canonical targeted spawn');
assert(evidenceSource.includes('Projectile Status / targeted / multi-target primitives below have zero live Selected16 callers.'), 'U47 normalizer must explicitly scope targeted primitive as unreachable');
assert(!evidenceSource.includes(".replace('battle.FireGameplayProjectile(effect.damage * damageMultiplier, effect.pierce)'"), 'normalizer must never hide live coordinator target selection');

assert(title1BaseWeaponRuntimeAdmissionSummary.unityAdmittedRuntimeCount === 0, 'targeted primitive recovery alone must not admit Selected16');
console.log(JSON.stringify({ status: 'PASS', canonicalProjectileSpawnPrimitive: 'FireGameplayProjectileAtTarget', liveTargetSelection: 'nearest-target', statusRequestTransportPreserved: true }, null, 2));
''')

          Path('scripts/quality/check-unity-multitarget-projectile-primitive.ts').write_text(r'''import { readFileSync } from 'node:fs';

import { title1BaseWeaponRuntimeAdmissionSummary } from '../../src/game/data/title1BaseWeaponRuntimeAdmissionSource.ts';

function assert(condition: unknown, message: string): asserts condition {
  if (!condition) throw new Error(message);
}

const battleSource = readFileSync(new URL('../../unity/VampPonUnity/Assets/_Project/Scripts/Runtime/U2BattleController.cs', import.meta.url), 'utf8');
const coordinatorSource = readFileSync(new URL('../../unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Stage1GameplayRuntimeCoordinator.cs', import.meta.url), 'utf8');
const evidenceSource = readFileSync(new URL('../unity/u47-simulator-evidence-sources.ts', import.meta.url), 'utf8');

assert(battleSource.includes('private readonly List<U2EnemyActor> nearestEnemyTargetScratch = new(8);'), 'multi-target query must reuse controller-owned scratch');
assert(battleSource.includes('for (var enemyIndex = 0; enemyIndex < enemies.Count; enemyIndex++)'), 'multi-target query must enumerate existing pool without LINQ');
assert(battleSource.includes('if (enemy != null && enemy.IsTargetable) nearestEnemyTargetScratch.Add(enemy);'), 'only targetable enemies may enter scratch');
assert(battleSource.includes('public int FireGameplayProjectilesAtNearestTargets('), 'multi-target primitive missing');
assert(battleSource.includes('if (maxTargets <= 0) return 0;'), 'non-positive target cap must fail closed');
assert(battleSource.includes('var targetCount = Math.Min(maxTargets, nearestEnemyTargetScratch.Count);'), 'caller target cap must be enforced');
assert(battleSource.includes('SortNearestEnemyScratchPrefix(targetCount);'), 'deterministic nearest-prefix selection missing');
assert(battleSource.includes('FireGameplayProjectileAtTarget('), 'multi-target primitive must reuse canonical target spawn');
assert(battleSource.includes('Math.Abs(candidateDistance - nearestDistance) <= 0.0001f && candidatePoolOrder < nearestPoolOrder'), 'equal-distance tie must use deterministic pool order');
assert(battleSource.includes('private int PoolOrderOf(U2EnemyActor enemy) => enemies.IndexOf(enemy);'), 'pool-order tie break must avoid Unity GetInstanceID dependency');
assert(!battleSource.includes('GetInstanceID()'), 'Unity 6000.5 runtime primitive must not depend on obsolete GetInstanceID tie break');
assert(battleSource.includes('(enemy.transform.position - player.position).sqrMagnitude'), 'distance comparison must use squared distance from current player transform');

const multiStart = battleSource.indexOf('public int FireGameplayProjectilesAtNearestTargets(');
const nearestStart = battleSource.indexOf('public bool TryGetNearestEnemyPosition', multiStart);
assert(multiStart >= 0 && nearestStart > multiStart, 'cannot isolate multi-target source block');
const block = battleSource.slice(multiStart, nearestStart);
for (const forbidden of ['Enumerable.', '.OrderBy(', '.ThenBy(', '.ToList(', 'new List<', '.Sort(']) {
  assert(!block.includes(forbidden), `multi-target hot path must avoid ${forbidden}`);
}

assert(coordinatorSource.includes('battle.FireGameplayProjectile(effect.damage * damageMultiplier, effect.pierce)'), 'current live coordinator must remain nearest-target');
assert(!coordinatorSource.includes('FireGameplayProjectilesAtNearestTargets'), 'multi-target primitive must remain unreachable until real Selected16 caller lands');
assert(evidenceSource.includes('nearestEnemyTargetScratch = new(8)'), 'U47 normalizer must explicitly strip unreachable multi-target scratch');
assert(!evidenceSource.includes(".replace('battle.FireGameplayProjectilesAtNearestTargets"), 'normalizer must never hide future live multi-target call-site');
assert(title1BaseWeaponRuntimeAdmissionSummary.unityAdmittedRuntimeCount === 0, 'unused multi-target primitive must not admit Selected16');
assert(title1BaseWeaponRuntimeAdmissionSummary.statusApplicationBlockedWeaponCount === 16, 'STATUS_APPLICATION remains shared blocker until real caller');

console.log(JSON.stringify({ status: 'PASS', reusableScratch: true, targetableOnly: true, deterministicNearestPrefix: true, equalDistanceTieBreak: 'pool-order', getInstanceIdDependency: false, liveCallers: 0 }, null, 2));
''')

          # Remove stale branch-targeting one-shots that survived their original PRs.
          stale = [
              '.github/workflows/u2-projectile-status-hook-one-shot.yml',
              '.github/workflows/u2-targeted-projectile-one-shot.yml',
              '.github/workflows/u2-multitarget-projectile-one-shot.yml',
              '.github/workflows/u47-targeted-projectile-normalizer-one-shot.yml',
              '.github/workflows/u47-multitarget-normalizer-one-shot.yml',
          ]
          for name in stale:
              Path(name).unlink(missing_ok=True)
          Path('.github/workflows/runtime-projectile-recovery-one-shot.yml').unlink(missing_ok=True)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore actual Unity projectile runtime primitives'
          git push origin HEAD:fix/unity-multitarget-admission-drift

name: All Character Body Adornment Marking Topology Fidelity Master

on:
  pull_request:
    paths:
      - 'docs/visual/all-character-body-adornment-marking-topology-fidelity-master-v1.md'
      - 'data/visual/all-character-body-adornment-marking-topology-fidelity-master-v1.json'
      - 'docs/visual/character-production-generation-entrypoint-v5.md'
      - 'data/visual/character-production-generation-entrypoint-v5.json'
      - 'src/game/data/characterReferenceProductionEntrypoint.ts'
      - 'tools/asset-factory/scripts/export-body-adornment-topology-locked-character-design-prompt.ts'
      - 'scripts/quality/check-all-character-body-adornment-marking-topology-fidelity.ts'
      - 'scripts/quality/check-character-production-generation-entrypoint.ts'
      - '.github/workflows/all-character-body-adornment-marking-topology-fidelity.yml'
  push:
    branches: [main]
    paths:
      - 'docs/visual/all-character-body-adornment-marking-topology-fidelity-master-v1.md'
      - 'data/visual/all-character-body-adornment-marking-topology-fidelity-master-v1.json'
      - 'docs/visual/character-production-generation-entrypoint-v5.md'
      - 'data/visual/character-production-generation-entrypoint-v5.json'
      - 'src/game/data/characterReferenceProductionEntrypoint.ts'
      - 'tools/asset-factory/scripts/export-body-adornment-topology-locked-character-design-prompt.ts'
      - 'scripts/quality/check-all-character-body-adornment-marking-topology-fidelity.ts'
      - 'scripts/quality/check-character-production-generation-entrypoint.ts'
      - '.github/workflows/all-character-body-adornment-marking-topology-fidelity.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate body adornment and marking topology authority for all 36 characters
        run: node --experimental-strip-types scripts/quality/check-all-character-body-adornment-marking-topology-fidelity.ts

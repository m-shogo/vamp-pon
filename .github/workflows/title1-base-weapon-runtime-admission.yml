      - 'scripts/quality/check-title1-base-weapon-runtime-admission.ts'
      - '.github/workflows/title1-base-weapon-runtime-admission.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check upstream Selected16 Web admission
        run: node --experimental-strip-types scripts/quality/check-selected16-runtime-admission-matrix.ts
      - name: Check Unity runtime admission evidence overlay
        run: node --experimental-strip-types scripts/quality/check-title1-base-weapon-runtime-admission.ts

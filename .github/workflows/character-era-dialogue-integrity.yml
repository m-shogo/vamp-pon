name: Character Era Dialogue Integrity

on:
  pull_request:
    paths:
      - 'src/game/data/characterEraSceneSeedRegistry.ts'
      - 'src/game/data/characterEraFingerprintRegistry.ts'
      - 'src/game/data/characterEraForeshadowDialogueReservoir.ts'
      - 'scripts/quality/check-character-era-dialogue-integrity.ts'
      - 'docs/character-era-dialogue-integrity-v1.md'
      - '.github/workflows/character-era-dialogue-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'src/game/data/characterEraSceneSeedRegistry.ts'
      - 'src/game/data/characterEraFingerprintRegistry.ts'
      - 'src/game/data/characterEraForeshadowDialogueReservoir.ts'
      - 'scripts/quality/check-character-era-dialogue-integrity.ts'
      - 'docs/character-era-dialogue-integrity-v1.md'
      - '.github/workflows/character-era-dialogue-integrity.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 36-character Era dialogue integrity
        run: node --experimental-strip-types scripts/quality/check-character-era-dialogue-integrity.ts

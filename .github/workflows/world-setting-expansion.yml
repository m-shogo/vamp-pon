name: World Setting Expansion

on:
  pull_request:
    paths:
      - 'docs/00-current-story-world-master.md'
      - 'docs/CANON.md'
      - 'docs/WORLD.md'
      - 'docs/STORY.md'
      - 'docs/world-*.md'
      - 'docs/story-*.md'
      - 'docs/core5-era-*.md'
      - 'docs/era-*.md'
      - 'docs/season-*.md'
      - 'docs/research/era-*.md'
      - 'docs/dream-feast-party-social-bible-v1.md'
      - 'docs/stage-world-lore-integration-v1.md'
      - 'docs/character-family-household-atlas-v1.md'
      - 'docs/character-height-age-era-lineup-v1.md'
      - 'docs/character-interior-social-dynamics-bible-v1.md'
      - 'docs/sakumei-*.md'
      - 'docs/sakuyaza-*.md'
      - 'docs/gunjo-*.md'
      - 'public/lorebook/data/core5-era-canon.v1.json'
      - 'src/game/data/core5EraCanon.ts'
      - 'src/game/data/seasonArchitecture.ts'
      - 'src/game/data/storyWorldMasterSource.ts'
      - 'src/game/data/dreamSocialWorldSource.ts'
      - 'src/game/data/worldSettingExpansionIndex.ts'
      - 'src/game/data/worldSettingConflictRegister.ts'
      - 'src/game/data/stageWorldLoreIntegration.ts'
      - 'src/game/data/sakumeiCandidateSource.ts'
      - 'scripts/quality/check-world-setting-expansion.ts'
      - '.github/workflows/world-setting-expansion.yml'
  push:
    branches: [main]
    paths:
      - 'docs/00-current-story-world-master.md'
      - 'docs/CANON.md'
      - 'docs/WORLD.md'
      - 'docs/STORY.md'
      - 'docs/world-*.md'
      - 'docs/story-*.md'
      - 'docs/core5-era-*.md'
      - 'docs/era-*.md'
      - 'docs/season-*.md'
      - 'docs/research/era-*.md'
      - 'docs/dream-feast-party-social-bible-v1.md'
      - 'docs/stage-world-lore-integration-v1.md'
      - 'docs/character-family-household-atlas-v1.md'
      - 'docs/character-height-age-era-lineup-v1.md'
      - 'docs/character-interior-social-dynamics-bible-v1.md'
      - 'docs/sakumei-*.md'
      - 'docs/sakuyaza-*.md'
      - 'docs/gunjo-*.md'
      - 'public/lorebook/data/core5-era-canon.v1.json'
      - 'src/game/data/core5EraCanon.ts'
      - 'src/game/data/seasonArchitecture.ts'
      - 'src/game/data/storyWorldMasterSource.ts'
      - 'src/game/data/dreamSocialWorldSource.ts'
      - 'src/game/data/worldSettingExpansionIndex.ts'
      - 'src/game/data/worldSettingConflictRegister.ts'
      - 'src/game/data/stageWorldLoreIntegration.ts'
      - 'src/game/data/sakumeiCandidateSource.ts'
      - 'scripts/quality/check-world-setting-expansion.ts'
      - '.github/workflows/world-setting-expansion.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Story / World, Era x Generation x Season, P0-P2 and authority boundaries
        run: node --experimental-strip-types scripts/quality/check-world-setting-expansion.ts

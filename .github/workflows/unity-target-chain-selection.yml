name: unity-target-chain-selection

on:
  pull_request:
    paths:
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2EnemyTargetChainSelectionRuntime.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2EnemyTargetChainSelectionRuntime.cs.meta'
      - 'scripts/quality/check-unity-target-chain-selection-primitive.ts'
      - 'scripts/quality/unity-target-chain-selection/**'
      - 'docs/unity-target-chain-selection-primitive-v1.md'
      - '.github/workflows/unity-target-chain-selection.yml'
  push:
    branches: [main]
    paths:
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2EnemyTargetChainSelectionRuntime.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2EnemyTargetChainSelectionRuntime.cs.meta'
      - 'scripts/quality/check-unity-target-chain-selection-primitive.ts'
      - 'scripts/quality/unity-target-chain-selection/**'
      - 'docs/unity-target-chain-selection-primitive-v1.md'
      - '.github/workflows/unity-target-chain-selection.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check target chain selection foundation
        run: node --experimental-strip-types scripts/quality/check-unity-target-chain-selection-primitive.ts
      - name: Compile and execute target chain selector contract
        run: |
          dotnet build scripts/quality/unity-target-chain-selection/UnityTargetChainSelection.Contract.csproj --configuration Release --nologo
          dotnet run --project scripts/quality/unity-target-chain-selection/UnityTargetChainSelection.Contract.csproj --configuration Release --no-build
      - name: Re-check Title1 Content Master integrity
        run: node --experimental-strip-types scripts/quality/check-title1-content-master-integrity.ts

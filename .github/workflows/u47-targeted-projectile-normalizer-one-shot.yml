name: U47 Targeted Projectile Normalizer One Shot

on:
  push:
    branches: [agent/unity-targeted-projectile-primitive-v1]
    paths:
      - '.github/workflows/u47-targeted-projectile-normalizer-one-shot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unity-targeted-projectile-primitive-v1
      - name: Normalize behavior-equivalent target-spawn refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/unity/u47-simulator-evidence-sources.ts')
          text = path.read_text()
          anchor = "  if (file.endsWith('U2BattleController.cs')) normalized = normalized\n"
          count = text.count(anchor)
          if count != 1:
              raise SystemExit(f'expected exactly one U2 normalizer anchor, got {count}')

          targeted = '''        public bool FireGameplayProjectile(
            float damage,
            int pierce,
            EnemyStatusApplicationRequest? statusApplicationRequest)
        {
            var target = FindNearestEnemy();
            return FireGameplayProjectileAtTarget(target, damage, pierce, statusApplicationRequest);
        }

        public bool FireGameplayProjectileAtTarget(
            U2EnemyActor target,
            float damage,
            int pierce,
            EnemyStatusApplicationRequest? statusApplicationRequest = null)
        {
            if (target == null || !target.IsTargetable) return false;

            var projectile = GetPooled(projectiles);
            projectile.Activate(
                playerRoot.position,
                target.transform.position - playerRoot.position,
                config.projectileSpeed,
                damage,
                pierce,
                config.projectileLifetime,
                statusApplicationRequest);
            return true;
        }'''
          previous = '''        public bool FireGameplayProjectile(
            float damage,
            int pierce,
            EnemyStatusApplicationRequest? statusApplicationRequest)
        {
            var target = FindNearestEnemy();
            if (target == null) return false;

            var projectile = GetPooled(projectiles);
            projectile.Activate(
                playerRoot.position,
                target.transform.position - playerRoot.position,
                config.projectileSpeed,
                damage,
                pierce,
                config.projectileLifetime,
                statusApplicationRequest);
            return true;
        }'''

          prelude = f'''  if (file.endsWith('U2BattleController.cs')) normalized = normalized.replace(`{targeted}`, `{previous}`);\n'''
          text = text.replace(anchor, prelude + anchor)
          path.write_text(text)
          PY
          rm .github/workflows/u47-targeted-projectile-normalizer-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/unity/u47-simulator-evidence-sources.ts .github/workflows/u47-targeted-projectile-normalizer-one-shot.yml
          git commit -m 'fix: normalize targeted projectile refactor for U47 evidence'
          git push origin HEAD:agent/unity-targeted-projectile-primitive-v1

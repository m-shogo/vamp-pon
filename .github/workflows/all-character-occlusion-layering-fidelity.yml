name: All Character Occlusion Layering Fidelity Master

on:
  pull_request:
    paths:
      - 'docs/visual/all-character-occlusion-layering-fidelity-master-v1.md'
      - 'data/visual/all-character-occlusion-layering-fidelity-master-v1.json'
      - 'data/visual/character-production-generation-entrypoint-v1.json'
      - 'tools/asset-factory/scripts/export-production-character-design-prompt.ts'
      - 'scripts/quality/check-all-character-occlusion-layering-fidelity.ts'
      - '.github/workflows/all-character-occlusion-layering-fidelity.yml'
  push:
    branches: [main]
    paths:
      - 'docs/visual/all-character-occlusion-layering-fidelity-master-v1.md'
      - 'data/visual/all-character-occlusion-layering-fidelity-master-v1.json'
      - 'data/visual/character-production-generation-entrypoint-v1.json'
      - 'tools/asset-factory/scripts/export-production-character-design-prompt.ts'
      - 'scripts/quality/check-all-character-occlusion-layering-fidelity.ts'
      - '.github/workflows/all-character-occlusion-layering-fidelity.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all-character occlusion layering fidelity authority
        run: node --experimental-strip-types scripts/quality/check-all-character-occlusion-layering-fidelity.ts

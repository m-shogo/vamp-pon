name: Toumon Simple Sigil Canon

on:
  pull_request:
    paths:
      - 'docs/design/emblem-canon.md'
      - 'docs/design/az-emblem-canon.md'
      - 'docs/design/world-labels.md'
      - 'docs/design/toumon-simple-sigil-canon-v2.md'
      - 'docs/design/toumon-inworld-behavior-contract-v1.md'
      - 'docs/design/ip-symbol-merch-system-v1.md'
      - 'docs/prompts/az-emblem-asset-prompts.md'
      - 'src/game/data/emblemCanon.ts'
      - 'src/game/data/toumonSimpleSigilCanon.ts'
      - 'src/game/data/characterThemeColors.ts'
      - 'src/game/data/characterCommercialIdentity.ts'
      - 'scripts/quality/check-toumon-simple-sigil-canon.ts'
      - '.github/workflows/toumon-simple-sigil-canon.yml'
  push:
    branches: [main]
    paths:
      - 'docs/design/emblem-canon.md'
      - 'docs/design/az-emblem-canon.md'
      - 'docs/design/world-labels.md'
      - 'docs/design/toumon-simple-sigil-canon-v2.md'
      - 'docs/design/toumon-inworld-behavior-contract-v1.md'
      - 'docs/design/ip-symbol-merch-system-v1.md'
      - 'docs/prompts/az-emblem-asset-prompts.md'
      - 'src/game/data/emblemCanon.ts'
      - 'src/game/data/toumonSimpleSigilCanon.ts'
      - 'src/game/data/characterThemeColors.ts'
      - 'src/game/data/characterCommercialIdentity.ts'
      - 'scripts/quality/check-toumon-simple-sigil-canon.ts'
      - '.github/workflows/toumon-simple-sigil-canon.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Current21 simple Toumon sigils
        run: node --experimental-strip-types scripts/quality/check-toumon-simple-sigil-canon.ts
      - name: Reject old ornate emblem authority
        run: |
          ! grep -q 'ランタン外枠' docs/design/emblem-canon.md
          grep -q 'simple abstract sigil' docs/design/emblem-canon.md
          grep -q 'SUPERSEDED VISUAL DESIGN' docs/design/az-emblem-canon.md
          grep -q 'Current Toumon simple-sigil authority' docs/design/world-labels.md
          grep -q '16px' docs/design/toumon-simple-sigil-canon-v2.md
          grep -q '夜の記録帳' docs/design/ip-symbol-merch-system-v1.md
          grep -q 'RASTER / IMAGE GENERATION HOLD' docs/prompts/az-emblem-asset-prompts.md
          grep -q 'AI image generation must not decide the canonical Toumon shape' docs/prompts/az-emblem-asset-prompts.md
          ! grep -q '^## Core5 prompts$' docs/prompts/az-emblem-asset-prompts.md
          ! grep -q '^## Circle10 prompts$' docs/prompts/az-emblem-asset-prompts.md
          ! grep -q '^## Shadow5 prompts$' docs/prompts/az-emblem-asset-prompts.md
      - name: Guard in-world semantic and privacy boundaries
        run: |
          grep -q 'Power Sourceではない' docs/design/toumon-inworld-behavior-contract-v1.md
          grep -q 'privacy bypass deviceにしない' docs/design/toumon-inworld-behavior-contract-v1.md
          grep -q '相性診断ではない' docs/design/toumon-inworld-behavior-contract-v1.md
          grep -q 'Series Mystery reservoir' docs/design/toumon-inworld-behavior-contract-v1.md
          grep -q 'semantic fixation' docs/design/toumon-inworld-behavior-contract-v1.md

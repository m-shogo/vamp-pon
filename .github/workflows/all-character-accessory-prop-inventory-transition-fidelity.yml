name: All Character Accessory Prop Inventory Transition Fidelity Master

on:
  pull_request:
    paths:
      - 'docs/visual/all-character-accessory-prop-inventory-transition-fidelity-master-v1.md'
      - 'data/visual/all-character-accessory-prop-inventory-transition-fidelity-master-v1.json'
      - 'docs/visual/character-production-generation-entrypoint-v6.md'
      - 'data/visual/character-production-generation-entrypoint-v6.json'
      - 'src/game/data/characterReferenceProductionEntrypoint.ts'
      - 'tools/asset-factory/scripts/export-accessory-prop-inventory-locked-character-design-prompt.ts'
      - 'scripts/quality/check-all-character-accessory-prop-inventory-transition-fidelity.ts'
      - 'scripts/quality/check-character-production-generation-entrypoint.ts'
      - '.github/workflows/all-character-accessory-prop-inventory-transition-fidelity.yml'
  push:
    branches: [main]
    paths:
      - 'docs/visual/all-character-accessory-prop-inventory-transition-fidelity-master-v1.md'
      - 'data/visual/all-character-accessory-prop-inventory-transition-fidelity-master-v1.json'
      - 'docs/visual/character-production-generation-entrypoint-v6.md'
      - 'data/visual/character-production-generation-entrypoint-v6.json'
      - 'src/game/data/characterReferenceProductionEntrypoint.ts'
      - 'tools/asset-factory/scripts/export-accessory-prop-inventory-locked-character-design-prompt.ts'
      - 'scripts/quality/check-all-character-accessory-prop-inventory-transition-fidelity.ts'
      - 'scripts/quality/check-character-production-generation-entrypoint.ts'
      - '.github/workflows/all-character-accessory-prop-inventory-transition-fidelity.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate accessory prop inventory transition authority for all 36 characters
        run: node --experimental-strip-types scripts/quality/check-all-character-accessory-prop-inventory-transition-fidelity.ts

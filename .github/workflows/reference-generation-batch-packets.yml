name: Reference Generation Batch Packets

on:
  pull_request:
    paths:
      - 'src/game/data/referenceFirstBulkGenerationQueue.ts'
      - 'src/game/data/referenceGenerationBatchPackets.ts'
      - 'src/game/data/enemyProductionDatabase.ts'
      - 'src/game/data/itemAssetProductionDatabase.ts'
      - 'src/game/data/weaponVisualSharedSource.ts'
      - 'scripts/quality/check-reference-generation-batch-packets.ts'
      - 'scripts/export-reference-generation-batch-packets.ts'
      - '.github/workflows/reference-generation-batch-packets.yml'
  push:
    branches: [main]
    paths:
      - 'src/game/data/referenceFirstBulkGenerationQueue.ts'
      - 'src/game/data/referenceGenerationBatchPackets.ts'
      - 'src/game/data/enemyProductionDatabase.ts'
      - 'src/game/data/itemAssetProductionDatabase.ts'
      - 'src/game/data/weaponVisualSharedSource.ts'
      - 'scripts/quality/check-reference-generation-batch-packets.ts'
      - 'scripts/export-reference-generation-batch-packets.ts'
      - '.github/workflows/reference-generation-batch-packets.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate homogeneous batch packets
        run: node --experimental-strip-types scripts/quality/check-reference-generation-batch-packets.ts
      - name: Export deterministic packet manifest
        run: node --experimental-strip-types scripts/export-reference-generation-batch-packets.ts /tmp/reference-generation-batch-packets-v1.json
      - name: Parse exported packet manifest
        run: node -e "const fs=require('fs'); const p='/tmp/reference-generation-batch-packets-v1.json'; const d=JSON.parse(fs.readFileSync(p,'utf8')); if(!Array.isArray(d.packets)||d.packets.length!==d.summary.packetCount) process.exit(1); console.log('packets='+d.packets.length+', references='+d.summary.totalReferences+', candidates='+d.summary.totalCandidateCapacity);"

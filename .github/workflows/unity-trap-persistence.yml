name: unity-trap-persistence

on:
  pull_request:
    paths:
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2PersistentTrapRuntime.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2PersistentTrapRuntime.cs.meta'
      - 'scripts/quality/check-unity-trap-persistence-primitive.ts'
      - 'scripts/quality/unity-trap-persistence/**'
      - 'docs/unity-trap-persistence-primitive-v1.md'
      - '.github/workflows/unity-trap-persistence.yml'
  push:
    branches: [main]
    paths:
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2PersistentTrapRuntime.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2PersistentTrapRuntime.cs.meta'
      - 'scripts/quality/check-unity-trap-persistence-primitive.ts'
      - 'scripts/quality/unity-trap-persistence/**'
      - 'docs/unity-trap-persistence-primitive-v1.md'
      - '.github/workflows/unity-trap-persistence.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check trap persistence foundation
        run: node --experimental-strip-types scripts/quality/check-unity-trap-persistence-primitive.ts
      - name: Compile and execute trap persistence contract
        run: |
          dotnet build scripts/quality/unity-trap-persistence/UnityTrapPersistence.Contract.csproj --configuration Release --nologo
          dotnet run --project scripts/quality/unity-trap-persistence/UnityTrapPersistence.Contract.csproj --configuration Release --no-build
      - name: Re-check Title1 Content Master integrity
        run: node --experimental-strip-types scripts/quality/check-title1-content-master-integrity.ts

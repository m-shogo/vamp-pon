name: All Character Skin Coverage Exposure Boundary Fidelity Master

on:
  pull_request:
    paths:
      - 'docs/visual/all-character-skin-coverage-exposure-boundary-fidelity-master-v1.md'
      - 'data/visual/all-character-skin-coverage-exposure-boundary-fidelity-master-v1.json'
      - 'docs/visual/character-production-generation-entrypoint-v7.md'
      - 'data/visual/character-production-generation-entrypoint-v7.json'
      - 'src/game/data/characterReferenceProductionEntrypoint.ts'
      - 'tools/asset-factory/scripts/export-skin-coverage-locked-character-design-prompt.ts'
      - 'scripts/quality/check-all-character-skin-coverage-exposure-boundary-fidelity.ts'
      - 'scripts/quality/check-character-production-generation-entrypoint.ts'
      - '.github/workflows/all-character-skin-coverage-exposure-boundary-fidelity.yml'
  push:
    branches: [main]
    paths:
      - 'docs/visual/all-character-skin-coverage-exposure-boundary-fidelity-master-v1.md'
      - 'data/visual/all-character-skin-coverage-exposure-boundary-fidelity-master-v1.json'
      - 'docs/visual/character-production-generation-entrypoint-v7.md'
      - 'data/visual/character-production-generation-entrypoint-v7.json'
      - 'src/game/data/characterReferenceProductionEntrypoint.ts'
      - 'tools/asset-factory/scripts/export-skin-coverage-locked-character-design-prompt.ts'
      - 'scripts/quality/check-all-character-skin-coverage-exposure-boundary-fidelity.ts'
      - 'scripts/quality/check-character-production-generation-entrypoint.ts'
      - '.github/workflows/all-character-skin-coverage-exposure-boundary-fidelity.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skin coverage and exposure boundary authority for all 36 characters
        run: node --experimental-strip-types scripts/quality/check-all-character-skin-coverage-exposure-boundary-fidelity.ts

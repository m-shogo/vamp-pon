name: Yatsukage Current21 Relationship

on:
  pull_request:
    paths:
      - 'src/game/data/current21YatsukageRelationshipSource.ts'
      - 'src/game/data/spotlightEnemyCharacterSource.ts'
      - 'src/game/data/yatsukageIdentitySource.ts'
      - 'src/game/data/currentRelationshipInventory.ts'
      - 'docs/yatsukage-current21-relationship-matrix-v1.md'
      - 'scripts/quality/check-yatsukage-current21-relationship.ts'
      - '.github/workflows/yatsukage-current21-relationship.yml'
  push:
    branches: [main]
    paths:
      - 'src/game/data/current21YatsukageRelationshipSource.ts'
      - 'src/game/data/spotlightEnemyCharacterSource.ts'
      - 'src/game/data/yatsukageIdentitySource.ts'
      - 'src/game/data/currentRelationshipInventory.ts'
      - 'docs/yatsukage-current21-relationship-matrix-v1.md'
      - 'scripts/quality/check-yatsukage-current21-relationship.ts'
      - '.github/workflows/yatsukage-current21-relationship.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check 八影 x Current21 relationship matrix
        run: node --experimental-strip-types scripts/quality/check-yatsukage-current21-relationship.ts

name: TOP Final Art Intake

on:
  push:
    branches:
      - agent/top-living-night-key-art-v1
    paths:
      - 'docs/design-targets/generated/top-living-night-v3/incoming/top-living-night-core5-candidate-430x932.png'

permissions:
  contents: write

concurrency:
  group: top-final-art-intake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stage incoming candidate at canonical path
        run: python3 scripts/unity/stage-top-living-night-final-art-intake.py

      - name: Register exact candidate SHA and reset stale evidence
        run: node --experimental-strip-types scripts/unity/register-top-living-night-final-art.ts

      - name: Verify candidate and Core5 provenance
        run: |
          node --experimental-strip-types scripts/quality/check-top-living-night-final-art-candidate.ts
          node --experimental-strip-types scripts/quality/check-top-living-night-core5-candidate-provenance.ts
          node --experimental-strip-types scripts/quality/check-top-living-night-final-identity-boundary.ts
          node --experimental-strip-types scripts/quality/check-top-living-night-approval-consistency.ts

      - name: Remove one-shot incoming file
        run: git rm -- docs/design-targets/generated/top-living-night-v3/incoming/top-living-night-core5-candidate-430x932.png

      - name: Stage only final-art intake authority changes
        shell: bash
        run: |
          set -euo pipefail
          allowed=(
            docs/design-targets/generated/top-living-night-v3/incoming/top-living-night-core5-candidate-430x932.png
            docs/design-targets/generated/top-living-night-v3/final/top-living-night-core5-final-430x932.png
            docs/design-targets/generated/top-living-night-v3/final-art-status.json
            docs/design-targets/generated/top-living-night-v3/core5-identity-review-status.json
            docs/design-targets/generated/top-living-night-v3/crop-review-status.json
            docs/design-targets/generated/top-living-night-v3/motion-review-status.json
            docs/design-targets/generated/top-living-night-v3/human-visual-review-status.json
            docs/design-targets/generated/top-living-night-v3/runtime-unity-verification.json
            docs/design-targets/generated/top-living-night-v3/runtime-device-evidence.json
            docs/design-targets/generated/loading-seasonal-v1/runtime-capture-manifest.json
            docs/design-targets/generated/loading-seasonal-v1/manifest.json
          )
          git add -A -- "${allowed[@]}"
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            found=false
            for expected in "${allowed[@]}"; do
              if [[ "$path" == "$expected" ]]; then found=true; break; fi
            done
            if [[ "$found" != true ]]; then
              echo "Unexpected staged path: $path" >&2
              exit 1
            fi
          done
          git diff --cached --check

      - name: Commit guarded registration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'art: register TOP Core5 final candidate'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

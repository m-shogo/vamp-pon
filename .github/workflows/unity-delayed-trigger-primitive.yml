name: unity-delayed-trigger-primitive

on:
  pull_request:
    paths:
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2DelayedTriggerRuntime.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2DelayedTriggerRuntime.cs.meta'
      - 'scripts/quality/unity-delayed-trigger/**'
      - 'scripts/quality/check-unity-delayed-trigger-primitive.ts'
      - 'docs/unity-delayed-trigger-primitive-v1.md'
      - 'src/game/data/title1BaseWeaponRuntimeAdmissionSource.ts'
      - '.github/workflows/unity-delayed-trigger-primitive.yml'
  push:
    branches: [main]
    paths:
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2DelayedTriggerRuntime.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2DelayedTriggerRuntime.cs.meta'
      - 'scripts/quality/unity-delayed-trigger/**'
      - 'scripts/quality/check-unity-delayed-trigger-primitive.ts'
      - 'docs/unity-delayed-trigger-primitive-v1.md'
      - 'src/game/data/title1BaseWeaponRuntimeAdmissionSource.ts'
      - '.github/workflows/unity-delayed-trigger-primitive.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check delayed trigger primitive boundary
        run: node --experimental-strip-types scripts/quality/check-unity-delayed-trigger-primitive.ts
      - name: Compile and execute delayed trigger contract
        run: dotnet run --project scripts/quality/unity-delayed-trigger/UnityDelayedTrigger.Contract.csproj --configuration Release

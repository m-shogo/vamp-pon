name: Shared Source Generation Handoff Diagnostics

on:
  pull_request:
    paths:
      - 'src/game/data/sharedSourceGenerationHandoff.ts'
      - 'src/game/data/assetFactoryCatalog.ts'
      - 'src/game/data/assetGenerationPolicy.ts'
      - 'src/game/data/commercialProductionProfile.ts'
      - 'src/game/data/namedObjectVisualSharedSource.ts'
      - 'src/game/data/progressionRewardSharedSource.ts'
      - 'src/game/data/stageVisualSharedSource.ts'
      - 'src/game/data/starBeastVisualSharedSource.ts'
      - 'src/game/data/weaponVisualSharedSource.ts'
      - 'scripts/quality/check-shared-source-generation-handoffs.ts'
      - '.github/workflows/shared-source-generation-handoff-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Load handoff module and summary
        run: |
          node --experimental-strip-types --input-type=module - <<'NODE'
          const m = await import('./src/game/data/sharedSourceGenerationHandoff.ts');
          console.log(JSON.stringify(m.sharedSourceGenerationHandoffSummary, null, 2));
          if (m.sharedSourceGenerationHandoffs.length !== m.sharedSourceGenerationHandoffSummary.total) process.exit(1);
          NODE
      - name: Validate Asset Factory linkage lane
        run: |
          node --experimental-strip-types --input-type=module - <<'NODE'
          const h = await import('./src/game/data/sharedSourceGenerationHandoff.ts');
          const c = await import('./src/game/data/assetFactoryCatalog.ts');
          const p = await import('./src/game/data/assetGenerationPolicy.ts');
          if (h.assetFactorySharedSourceHandoffs.length !== c.assetFactoryPromptCatalog.length) throw new Error(`handoff/catalog ${h.assetFactorySharedSourceHandoffs.length}/${c.assetFactoryPromptCatalog.length}`);
          for (const [i, x] of h.assetFactorySharedSourceHandoffs.entries()) {
            const r = c.assetFactoryPromptCatalog[i];
            const contract = p.assetGenerationContractByKey.get(r.key);
            if (!contract) throw new Error(`missing contract ${r.key}`);
            if (x.existingAssetFactory?.contractId !== contract.contractId) throw new Error(`contract mismatch ${r.key}`);
            if (x.target.transparentRequirement !== contract.outputLock.alphaPolicy) throw new Error(`alpha mismatch ${r.key}`);
          }
          console.log(`asset-factory-linked=${h.assetFactorySharedSourceHandoffs.length}`);
          NODE
      - name: Validate direct Shared Source lanes
        run: |
          node --experimental-strip-types --input-type=module - <<'NODE'
          const h = await import('./src/game/data/sharedSourceGenerationHandoff.ts');
          const counts = {
            starBeast: h.starBeastGenerationHandoffs.length,
            weapon: h.weaponGenerationHandoffs.length,
            stageKeyArt: h.stageKeyArtGenerationHandoffs.length,
            namedObject: h.namedObjectGenerationHandoffs.length,
            reward: h.rewardGenerationHandoffs.length,
            toumon: h.toumonGenerationHandoffs.length,
          };
          console.log(JSON.stringify(counts));
          const expected = {starBeast:21, weapon:15, stageKeyArt:20, namedObject:21, reward:40, toumon:21};
          for (const [k,v] of Object.entries(expected)) if (counts[k] !== v) throw new Error(`${k} ${counts[k]}/${v}`);
          const ren = h.starBeastGenerationHandoffs.find(x => x.handoffId.includes(':star-beast:ren:'));
          if (!ren || ren.approval.sourceReadiness !== 'BLOCKED') throw new Error('Ren blocker missing');
          if (!h.weaponGenerationHandoffs.every(x => x.approval.sourceReadiness === 'READY_FOR_CANDIDATE')) throw new Error('weapon readiness drift');
          if (!h.stageKeyArtGenerationHandoffs.every(x => x.approval.sourceReadiness === 'READY_FOR_CANDIDATE')) throw new Error('stage key-art readiness drift');
          if (!h.namedObjectGenerationHandoffs.every(x => x.approval.sourceReadiness === 'BLOCKED')) throw new Error('named object hold drift');
          if (!h.rewardGenerationHandoffs.every(x => x.approval.sourceReadiness === 'BLOCKED')) throw new Error('reward hold drift');
          if (!h.toumonGenerationHandoffs.every(x => x.approval.sourceReadiness === 'BLOCKED')) throw new Error('toumon hold drift');
          NODE
      - name: Validate universal approval boundary lane
        run: |
          node --experimental-strip-types --input-type=module - <<'NODE'
          const h = await import('./src/game/data/sharedSourceGenerationHandoff.ts');
          for (const x of h.sharedSourceGenerationHandoffs) {
            if (!x.approval.humanApprovalRequired || !x.approval.oneShotFinalForbidden) throw new Error(`approval gate ${x.handoffId}`);
            if (x.approval.approvedReferenceDefault || x.approval.approvedWebDefault || x.approval.approvedUnityDefault || x.approval.productionReadyDefault || x.approval.runtimeApprovedDefault) throw new Error(`default approval ${x.handoffId}`);
            if (!x.forbiddenInterpretation.some(v => /one-shot final/i.test(v))) throw new Error(`one-shot prose ${x.handoffId}`);
            if (!x.forbiddenInterpretation.some(v => /Web composition as a Unity runtime asset/i.test(v))) throw new Error(`surface separation ${x.handoffId}`);
          }
          console.log(`universal-boundary=${h.sharedSourceGenerationHandoffs.length}`);
          NODE
      - name: Run full generation handoff checker
        run: node --experimental-strip-types scripts/quality/check-shared-source-generation-handoffs.ts

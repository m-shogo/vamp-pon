name: Shared Source Generation Handoff Lane Diagnostics

on:
  pull_request:
    paths:
      - 'src/game/data/sharedSourceGenerationHandoff.ts'
      - 'src/game/data/assetFactoryCatalog.ts'
      - 'src/game/data/assetGenerationPolicy.ts'
      - 'src/game/data/commercialProductionProfile.ts'
      - 'src/game/data/namedObjectVisualSharedSource.ts'
      - 'src/game/data/progressionRewardSharedSource.ts'
      - 'src/game/data/stageVisualSharedSource.ts'
      - 'src/game/data/starBeastVisualSharedSource.ts'
      - 'src/game/data/weaponVisualSharedSource.ts'
      - 'scripts/quality/check-shared-source-generation-handoffs.ts'
      - '.github/workflows/shared-source-generation-handoff-diagnostic-jobs.yml'

permissions:
  contents: read

jobs:
  module-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --experimental-strip-types --input-type=module -e "const m=await import('./src/game/data/sharedSourceGenerationHandoff.ts'); console.log(JSON.stringify(m.sharedSourceGenerationHandoffSummary)); if(m.sharedSourceGenerationHandoffs.length!==m.sharedSourceGenerationHandoffSummary.total) process.exit(1)"

  asset-factory-linkage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --experimental-strip-types --input-type=module - <<'NODE'
          const h=await import('./src/game/data/sharedSourceGenerationHandoff.ts');
          const c=await import('./src/game/data/assetFactoryCatalog.ts');
          const p=await import('./src/game/data/assetGenerationPolicy.ts');
          if(h.assetFactorySharedSourceHandoffs.length!==c.assetFactoryPromptCatalog.length) throw new Error('catalog coverage');
          for(const [i,x] of h.assetFactorySharedSourceHandoffs.entries()){
            const r=c.assetFactoryPromptCatalog[i]; const contract=p.assetGenerationContractByKey.get(r.key);
            if(!contract) throw new Error('missing contract '+r.key);
            if(x.existingAssetFactory?.contractId!==contract.contractId) throw new Error('contract mismatch '+r.key);
            if(x.target.transparentRequirement!==contract.outputLock.alphaPolicy) throw new Error('alpha mismatch '+r.key);
          }
          console.log('assetFactory='+h.assetFactorySharedSourceHandoffs.length);
          NODE

  direct-lanes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --experimental-strip-types --input-type=module - <<'NODE'
          const h=await import('./src/game/data/sharedSourceGenerationHandoff.ts');
          const expected=[['starBeastGenerationHandoffs',21],['weaponGenerationHandoffs',15],['stageKeyArtGenerationHandoffs',20],['namedObjectGenerationHandoffs',21],['rewardGenerationHandoffs',40],['toumonGenerationHandoffs',21]];
          for(const [key,count] of expected) if(h[key].length!==count) throw new Error(`${key} ${h[key].length}/${count}`);
          const ren=h.starBeastGenerationHandoffs.find(x=>x.handoffId.includes(':star-beast:ren:'));
          if(!ren||ren.approval.sourceReadiness!=='BLOCKED') throw new Error('Ren blocker');
          if(!h.weaponGenerationHandoffs.every(x=>x.approval.sourceReadiness==='READY_FOR_CANDIDATE')) throw new Error('weapon readiness');
          if(!h.stageKeyArtGenerationHandoffs.every(x=>x.approval.sourceReadiness==='READY_FOR_CANDIDATE')) throw new Error('stage readiness');
          if(!h.namedObjectGenerationHandoffs.every(x=>x.approval.sourceReadiness==='BLOCKED')) throw new Error('named object hold');
          if(!h.rewardGenerationHandoffs.every(x=>x.approval.sourceReadiness==='BLOCKED')) throw new Error('reward hold');
          if(!h.toumonGenerationHandoffs.every(x=>x.approval.sourceReadiness==='BLOCKED')) throw new Error('toumon hold');
          console.log('direct lanes OK');
          NODE

  approval-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --experimental-strip-types --input-type=module - <<'NODE'
          const h=await import('./src/game/data/sharedSourceGenerationHandoff.ts');
          for(const x of h.sharedSourceGenerationHandoffs){
            if(!x.approval.humanApprovalRequired||!x.approval.oneShotFinalForbidden) throw new Error('gate '+x.handoffId);
            if(x.approval.approvedReferenceDefault||x.approval.approvedWebDefault||x.approval.approvedUnityDefault||x.approval.productionReadyDefault||x.approval.runtimeApprovedDefault) throw new Error('approval default '+x.handoffId);
            if(!x.forbiddenInterpretation.some(v=>/one-shot final/i.test(v))) throw new Error('one-shot '+x.handoffId);
            if(!x.forbiddenInterpretation.some(v=>/Web composition as a Unity runtime asset/i.test(v))) throw new Error('surface '+x.handoffId);
          }
          console.log('approval boundaries='+h.sharedSourceGenerationHandoffs.length);
          NODE

  full-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --experimental-strip-types scripts/quality/check-shared-source-generation-handoffs.ts

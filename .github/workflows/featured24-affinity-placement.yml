name: Featured24 Affinity Placement

on:
  pull_request:
    paths:
      - 'src/game/data/featuredRelationshipAffinityPlacementSource.ts'
      - 'src/game/data/featuredRelationshipAffinityBeatSource.ts'
      - 'src/game/data/series1StageCampaignContentSource.ts'
      - 'docs/featured24-affinity-placement-v1.md'
      - 'scripts/quality/check-featured-relationship-affinity-placement.ts'
      - '.github/workflows/featured24-affinity-placement.yml'
  push:
    branches: [main]
    paths:
      - 'src/game/data/featuredRelationshipAffinityPlacementSource.ts'
      - 'src/game/data/featuredRelationshipAffinityBeatSource.ts'
      - 'src/game/data/series1StageCampaignContentSource.ts'
      - 'docs/featured24-affinity-placement-v1.md'
      - 'scripts/quality/check-featured-relationship-affinity-placement.ts'
      - '.github/workflows/featured24-affinity-placement.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Featured24 Result / Hub Affinity placement
        run: node --experimental-strip-types scripts/quality/check-featured-relationship-affinity-placement.ts

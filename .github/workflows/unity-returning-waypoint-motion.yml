name: unity-returning-waypoint-motion

on:
  pull_request:
    paths:
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2ReturningWaypointMotionRuntime.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2ReturningWaypointMotionRuntime.cs.meta'
      - 'scripts/quality/check-unity-returning-waypoint-motion.ts'
      - 'scripts/quality/unity-returning-waypoint/**'
      - 'docs/unity-returning-waypoint-motion-primitive-v1.md'
      - '.github/workflows/unity-returning-waypoint-motion.yml'
  push:
    branches: [main]
    paths:
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2ReturningWaypointMotionRuntime.cs'
      - 'unity/VampPonUnity/Assets/_Project/Scripts/Runtime/Gameplay/Primitives/U2ReturningWaypointMotionRuntime.cs.meta'
      - 'scripts/quality/check-unity-returning-waypoint-motion.ts'
      - 'scripts/quality/unity-returning-waypoint/**'
      - 'docs/unity-returning-waypoint-motion-primitive-v1.md'
      - '.github/workflows/unity-returning-waypoint-motion.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check returning waypoint motion foundation
        run: node --experimental-strip-types scripts/quality/check-unity-returning-waypoint-motion.ts
      - name: Compile and execute returning waypoint contract
        run: |
          dotnet build scripts/quality/unity-returning-waypoint/UnityReturningWaypoint.Contract.csproj --configuration Release --nologo
          dotnet run --project scripts/quality/unity-returning-waypoint/UnityReturningWaypoint.Contract.csproj --configuration Release --no-build
      - name: Re-check returning motion foundation
        run: node --experimental-strip-types scripts/quality/check-unity-returning-projectile-primitive.ts
      - name: Re-check Title1 Content Master integrity
        run: node --experimental-strip-types scripts/quality/check-title1-content-master-integrity.ts

name: Merged Lorebook Branch Delete One Shot

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-exact-merged-branches:
    if: github.event.issue.pull_request && github.event.issue.number == 81 && github.event.comment.body == '/cleanup-merged-lorebook-branches-v2'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify exact merged heads, then delete refs
        shell: bash
        run: |
          set -euo pipefail

          verify_branch() {
            local pr="$1"
            local branch="$2"
            local expected="$3"
            local actual
            local merged_head

            actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null || true)"
            if [ -n "$actual" ] && [ "$actual" != "$expected" ]; then
              echo "::error::${branch} moved after audit: expected ${expected}, got ${actual}"
              exit 1
            fi

            merged_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq 'if .merged_at != null then .head.sha else "" end')"
            if [ "$merged_head" != "$expected" ]; then
              echo "::error::PR #${pr} merged-head proof mismatch: expected ${expected}, got ${merged_head}"
              exit 1
            fi
          }

          delete_branch_if_present() {
            local branch="$1"
            local actual
            actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null || true)"
            if [ -n "$actual" ]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
              echo "Deleted: ${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          }

          verify_branch 80 feat/lorebook-world-bible-web-v1 ec29dd8b915f7ebb43dd1da27419d5e60befb45a
          verify_branch 81 fix/lorebook-motion-postmerge 7bf047d6d84cddb03be5217303f9bea1a78ea431

          delete_branch_if_present feat/lorebook-world-bible-web-v1
          delete_branch_if_present fix/lorebook-motion-postmerge

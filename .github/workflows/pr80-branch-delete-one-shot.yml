name: Final Audited Remote Branch Cleanup

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

jobs:
  fire-final-cleanup:
    if: >-
      github.event.pull_request.merged == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'chore/final-cleanup-fire' &&
      github.event.pull_request.title == 'chore: fire final remote cleanup now'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TRIGGER_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Verify all remaining refs, then delete them
        shell: bash
        run: |
          set -euo pipefail

          current_branch_sha() {
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/$1" --jq '.object.sha' 2>/dev/null || true
          }

          verify_exact_merged_branch() {
            local branch="$1"
            local actual
            local pulls
            local matched

            actual="$(current_branch_sha "$branch")"
            if [ -z "$actual" ]; then
              echo "Already absent: ${branch}"
              return
            fi

            pulls="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" -f state=closed -f "head=${GITHUB_REPOSITORY_OWNER}:${branch}" -f per_page=100)"
            matched="$(printf '%s' "$pulls" | jq -r --arg sha "$actual" '[.[] | select(.merged_at != null and .head.sha == $sha)] | length')"
            if [ "$matched" -lt 1 ]; then
              echo "::error::No merged PR records current exact head for ${branch}: ${actual}"
              exit 1
            fi
          }

          verify_superseded_pr85() {
            local branch='agent/lorebook-dawn-canon-v2'
            local expected='84a009ad4f0c08f7484016c07ab07a4493c91270'
            local actual
            local state
            local merged_at
            local head
            local rescue_merged
            local rescue_head
            local forbidden

            actual="$(current_branch_sha "$branch")"
            if [ -z "$actual" ]; then
              echo "Already absent: ${branch}"
              return
            fi
            if [ "$actual" != "$expected" ]; then
              echo "::error::Superseded PR85 branch moved after audit: expected ${expected}, got ${actual}"
              exit 1
            fi

            state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/85" --jq '.state')"
            merged_at="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/85" --jq '.merged_at // ""')"
            head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/85" --jq '.head.sha')"
            if [ "$state" != 'closed' ] || [ -n "$merged_at" ] || [ "$head" != "$expected" ]; then
              echo "::error::PR85 no longer matches closed/unmerged audited state"
              exit 1
            fi

            rescue_merged="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/86" --jq '.merged_at // ""')"
            rescue_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/86" --jq '.head.sha')"
            if [ -z "$rescue_merged" ] || [ "$rescue_head" != '52d2197be5da2079c6c5bf0808c3e18c9d84113b' ]; then
              echo "::error::Authority-safe rescue PR86 proof failed"
              exit 1
            fi

            forbidden="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/86/files" --jq '.[].filename' | grep -E '^(docs/CANON.md|docs/STORY.md|docs/RELATIONSHIPS.md|public/lorebook/data/world-bible.v1.json|public/lorebook/data/setting-decision-lab.v1.json|public/lorebook/data/history-atlas.v1.json|docs/character-star-beast-constellation-canon-v1.md|src/game/data/characterThemeColors.ts|public/lorebook/data/character-themes.v1.json)$' || true)"
            if [ -n "$forbidden" ]; then
              echo "::error::PR86 unexpectedly changed Current authority: ${forbidden}"
              exit 1
            fi
          }

          delete_branch_if_present() {
            local branch="$1"
            if [ -n "$(current_branch_sha "$branch")" ]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
              echo "Deleted: ${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          }

          trigger='chore/final-cleanup-fire'
          trigger_actual="$(current_branch_sha "$trigger")"
          if [ -z "$trigger_actual" ] || [ "$trigger_actual" != "$TRIGGER_HEAD" ]; then
            echo "::error::Cleanup trigger branch changed or disappeared: expected ${TRIGGER_HEAD}, got ${trigger_actual}"
            exit 1
          fi

          if [ -n "$(current_branch_sha agent/title1-canon-series-foundation-v3)" ]; then
            echo "::error::Preserved proposal branch unexpectedly reappeared after PR89 close cleanup"
            exit 1
          fi

          verify_exact_merged_branch chore/main-ci-cleanup-trigger
          verify_exact_merged_branch integration/lorebook-dawn-series-safe
          verify_superseded_pr85
          verify_exact_merged_branch chore/final-remote-branch-cleanup

          delete_branch_if_present chore/main-ci-cleanup-trigger
          delete_branch_if_present integration/lorebook-dawn-series-safe
          delete_branch_if_present agent/lorebook-dawn-canon-v2
          delete_branch_if_present chore/final-remote-branch-cleanup
          delete_branch_if_present "$trigger"

# Trigger-only branch: closing its PR fires the guarded cleanup above.

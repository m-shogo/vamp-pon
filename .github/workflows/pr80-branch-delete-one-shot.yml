name: Merged Lorebook Branch Delete One Shot

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-audited-merged-branches:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.event.pull_request.title == 'chore: retrigger exact merged branch cleanup'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TRIGGER_PR: ${{ github.event.pull_request.number }}
      TRIGGER_BRANCH: ${{ github.event.pull_request.head.ref }}
      TRIGGER_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Verify merged or semantically rescued heads, then delete refs
        shell: bash
        run: |
          set -euo pipefail

          current_branch_sha() {
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/$1" --jq '.object.sha' 2>/dev/null || true
          }

          merged_pr_head() {
            gh api "repos/${GITHUB_REPOSITORY}/pulls/$1" --jq 'if .merged_at != null then .head.sha else "" end'
          }

          verify_exact_merged_pr_branch() {
            local pr="$1"
            local branch="$2"
            local expected="$3"
            local actual
            local merged_head

            actual="$(current_branch_sha "$branch")"
            if [ -n "$actual" ] && [ "$actual" != "$expected" ]; then
              echo "::error::${branch} moved after audit: expected ${expected}, got ${actual}"
              exit 1
            fi

            merged_head="$(merged_pr_head "$pr")"
            if [ "$merged_head" != "$expected" ]; then
              echo "::error::PR #${pr} merged-head proof mismatch: expected ${expected}, got ${merged_head}"
              exit 1
            fi
          }

          verify_pr80_semantic_rescue() {
            local branch='feat/lorebook-world-bible-web-v1'
            local merged_head='ec29dd8b915f7ebb43dd1da27419d5e60befb45a'
            local expected_js='7650b5906b8e338317ef679e621c83e3f62d926f'
            local expected_css='673d533e896db1e6e4e1857cd73c2bd41c81c634'
            local actual
            local pr_head
            local ahead
            local behind
            local files
            local branch_js
            local branch_css
            local main_js
            local main_css

            pr_head="$(merged_pr_head 80)"
            if [ "$pr_head" != "$merged_head" ]; then
              echo "::error::PR #80 merged-head proof mismatch: expected ${merged_head}, got ${pr_head}"
              exit 1
            fi

            actual="$(current_branch_sha "$branch")"
            if [ -z "$actual" ]; then
              echo "Already absent: ${branch}"
              return
            fi

            ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${merged_head}...${actual}" --jq '.ahead_by')"
            behind="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${merged_head}...${actual}" --jq '.behind_by')"
            files="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${merged_head}...${actual}" --jq '.files[].filename' | sort | paste -sd ',' -)"

            if [ "$ahead" != '2' ] || [ "$behind" != '0' ]; then
              echo "::error::Unexpected PR80 post-merge topology: ahead=${ahead}, behind=${behind}"
              exit 1
            fi
            if [ "$files" != 'public/lorebook/motion-enhancement.js,public/lorebook/motion.css' ]; then
              echo "::error::Unexpected PR80 post-merge files: ${files}"
              exit 1
            fi

            branch_js="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/contents/public/lorebook/motion-enhancement.js" -f ref="$actual" --jq '.sha')"
            branch_css="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/contents/public/lorebook/motion.css" -f ref="$actual" --jq '.sha')"
            main_js="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/contents/public/lorebook/motion-enhancement.js" -f ref=main --jq '.sha')"
            main_css="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/contents/public/lorebook/motion.css" -f ref=main --jq '.sha')"

            if [ "$branch_js" != "$expected_js" ] || [ "$main_js" != "$expected_js" ]; then
              echo "::error::motion-enhancement.js is not byte-identical between rescued branch and main"
              exit 1
            fi
            if [ "$branch_css" != "$expected_css" ] || [ "$main_css" != "$expected_css" ]; then
              echo "::error::motion.css is not byte-identical between rescued branch and main"
              exit 1
            fi
          }

          delete_branch_if_present() {
            local branch="$1"
            if [ -n "$(current_branch_sha "$branch")" ]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
              echo "Deleted: ${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          }

          verify_pr80_semantic_rescue
          verify_exact_merged_pr_branch 81 fix/lorebook-motion-postmerge 7bf047d6d84cddb03be5217303f9bea1a78ea431
          verify_exact_merged_pr_branch 82 chore/exact-merged-branch-cleanup-trigger 22ffcddab2564424d2f6190e4be94795c0eb4807
          verify_exact_merged_pr_branch "$TRIGGER_PR" "$TRIGGER_BRANCH" "$TRIGGER_HEAD"

          delete_branch_if_present feat/lorebook-world-bible-web-v1
          delete_branch_if_present fix/lorebook-motion-postmerge
          delete_branch_if_present chore/exact-merged-branch-cleanup-trigger
          delete_branch_if_present "$TRIGGER_BRANCH"

name: Patch rarity and category colors

on:
  push:
    branches:
      - fix/rarity-category-colors

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/rarity-category-colors

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Apply patch
        run: node scripts/patch-rarity-category-colors.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/game/ui/overlays.ts src/game/ui/hud.ts scripts/patch-rarity-category-colors.mjs .github/workflows/patch-rarity-category-colors.yml
          git commit -m "レアリティ表示とレアカテゴリ色を分離"
          git push origin HEAD:fix/rarity-category-colors

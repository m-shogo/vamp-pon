name: Core5 P2 Life Choice Review Contract
on:
  pull_request:
    paths:
      - 'data/visual/core5-living-visual-profiles-v1.json'
      - 'data/visual/all-character-life-choice-author-review-queue-v1.json'
      - 'data/visual/core5-p2-life-choice-review-contract-v1.json'
      - 'scripts/quality/build-core5-p2-life-choice-review-contract.ts'
      - '.github/workflows/core5-p2-life-choice-review-contract.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --experimental-strip-types scripts/quality/build-core5-p2-life-choice-review-contract.ts --emit

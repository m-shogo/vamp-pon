name: Constellation Story Clue Reservoir

on:
  pull_request:
    paths:
      - 'docs/constellation-story-clue-reservoir-v1.md'
      - 'src/game/data/constellationStoryClueReservoir.ts'
      - 'scripts/quality/check-constellation-story-clue-reservoir.ts'
      - '.github/workflows/constellation-story-clue-reservoir.yml'
  push:
    branches: [main]
    paths:
      - 'docs/constellation-story-clue-reservoir-v1.md'
      - 'src/game/data/constellationStoryClueReservoir.ts'
      - 'scripts/quality/check-constellation-story-clue-reservoir.ts'
      - '.github/workflows/constellation-story-clue-reservoir.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate research-backed constellation story clue reservoir
        run: node --experimental-strip-types scripts/quality/check-constellation-story-clue-reservoir.ts

name: Title1 Merged Branch Delete One Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/title1-merged-branch-delete-one-shot.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only blob-identical merged Title1 branches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const targets = [
              'agent/title1-unlock-learning-progression-v1',
              'agent/title1-unlock-learning-progression-clean',
            ];
            const paths = [
              '.github/workflows/title1-unlock-learning-progression.yml',
              'docs/title1-unlock-learning-progression-source-v1.md',
              'scripts/quality/check-title1-unlock-learning-progression.ts',
              'src/game/data/title1UnlockLearningProgressionSource.ts',
              'src/game/data/title1UnlockResolutionSource.ts',
            ];
            const openPulls = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            async function blob(path, ref) {
              const r = await github.rest.repos.getContent({ owner, repo, path, ref });
              if (Array.isArray(r.data) || r.data.type !== 'file') throw new Error(`${ref}:${path} is not a file`);
              return r.data.sha;
            }
            for (const branch of targets) {
              if (openPulls.some(pr => pr.head.repo?.full_name === `${owner}/${repo}` && pr.head.ref === branch)) {
                throw new Error(`${branch} is an open PR head`);
              }
              let ref;
              try {
                ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              } catch (error) {
                if (error.status === 404) { console.log(`${branch}: already absent`); continue; }
                throw error;
              }
              const observedSha = ref.data.object.sha;
              for (const path of paths) {
                const branchBlob = await blob(path, observedSha);
                const mainBlob = await blob(path, 'main');
                if (branchBlob !== mainBlob) throw new Error(`${branch}:${path} differs from main`);
              }
              const refAgain = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              if (refAgain.data.object.sha !== observedSha) throw new Error(`${branch} moved during audit`);
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
              console.log(`deleted merged blob-identical branch ${branch}`);
            }

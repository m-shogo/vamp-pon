name: Life Choice Partial Evidence Review V1

on:
  pull_request:
    paths:
      - 'data/visual/current21-extended-living-visual-profiles-v1.json'
      - 'data/visual/current16-life-choice-profile-migration-intake-v1.json'
      - 'data/visual/future15-living-visual-profiles-v1.json'
      - 'data/visual/future15-life-choice-profile-migration-intake-v1.json'
      - 'data/visual/all-character-life-choice-migration-aware-audit-v2.json'
      - 'data/visual/all-character-life-choice-review-queue-v2.json'
      - 'data/visual/all-character-life-choice-schema-migration-ready-v1.json'
      - 'data/visual/life-choice-species-body-type-schema-adapter-v1.json'
      - 'data/visual/character-production-generation-entrypoint-v6.json'
      - 'data/visual/character-production-generation-entrypoint-v7.json'
      - 'data/visual/character-production-generation-entrypoint-v8.json'
      - 'data/visual/character-production-generation-entrypoint-v9.json'
      - 'docs/visual/character-production-generation-entrypoint-v6.md'
      - 'docs/visual/character-production-generation-entrypoint-v8.md'
      - 'data/visual/all-character-life-choice-partial-evidence-review-v1.json'
      - 'docs/visual/life-choice-partial-evidence-review-v1.md'
      - 'scripts/quality/build-life-choice-partial-evidence-review-v1.ts'
      - '.github/workflows/life-choice-partial-evidence-review-v1.yml'
  push:
    branches: [main]
    paths:
      - 'data/visual/current21-extended-living-visual-profiles-v1.json'
      - 'data/visual/current16-life-choice-profile-migration-intake-v1.json'
      - 'data/visual/future15-living-visual-profiles-v1.json'
      - 'data/visual/future15-life-choice-profile-migration-intake-v1.json'
      - 'data/visual/all-character-life-choice-migration-aware-audit-v2.json'
      - 'data/visual/all-character-life-choice-review-queue-v2.json'
      - 'data/visual/all-character-life-choice-schema-migration-ready-v1.json'
      - 'data/visual/life-choice-species-body-type-schema-adapter-v1.json'
      - 'data/visual/character-production-generation-entrypoint-v6.json'
      - 'data/visual/character-production-generation-entrypoint-v7.json'
      - 'data/visual/character-production-generation-entrypoint-v8.json'
      - 'data/visual/character-production-generation-entrypoint-v9.json'
      - 'docs/visual/character-production-generation-entrypoint-v6.md'
      - 'docs/visual/character-production-generation-entrypoint-v8.md'
      - 'data/visual/all-character-life-choice-partial-evidence-review-v1.json'
      - 'docs/visual/life-choice-partial-evidence-review-v1.md'
      - 'scripts/quality/build-life-choice-partial-evidence-review-v1.ts'
      - '.github/workflows/life-choice-partial-evidence-review-v1.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate 56 partial-evidence decisions
        run: node --experimental-strip-types scripts/quality/build-life-choice-partial-evidence-review-v1.ts
      - name: Validate materialized partial-evidence packet
        run: node --experimental-strip-types scripts/quality/build-life-choice-partial-evidence-review-v1.ts --check-materialized

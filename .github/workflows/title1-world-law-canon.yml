name: Title1 World Law Canon

on:
  pull_request:
    paths:
      - 'docs/title1-world-law-canon-v1.md'
      - 'docs/series-commercial-franchise-architecture-v1.md'
      - 'docs/RELATIONSHIPS.md'
      - 'docs/character-star-beast-constellation-canon-v1.md'
      - 'src/game/data/characterThemeColors.ts'
      - 'public/lorebook/data/title1-world-law.v1.json'
      - '.github/workflows/title1-world-law-canon.yml'
  push:
    branches: [main]
    paths:
      - 'docs/title1-world-law-canon-v1.md'
      - 'docs/series-commercial-franchise-architecture-v1.md'
      - 'docs/RELATIONSHIPS.md'
      - 'docs/character-star-beast-constellation-canon-v1.md'
      - 'src/game/data/characterThemeColors.ts'
      - 'public/lorebook/data/title1-world-law.v1.json'
      - '.github/workflows/title1-world-law-canon.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate promoted Title 1 world laws
        run: |
          node <<'NODE'
          const fs = require('fs');
          const fail = (message) => { console.error(message); process.exitCode = 1; };
          const canon = fs.readFileSync('docs/title1-world-law-canon-v1.md', 'utf8');
          const relations = fs.readFileSync('docs/RELATIONSHIPS.md', 'utf8');
          const stars = fs.readFileSync('docs/character-star-beast-constellation-canon-v1.md', 'utf8');
          const commercial = fs.readFileSync('docs/series-commercial-franchise-architecture-v1.md', 'utf8');
          const themeSource = fs.readFileSync('src/game/data/characterThemeColors.ts', 'utf8');
          const model = JSON.parse(fs.readFileSync('public/lorebook/data/title1-world-law.v1.json', 'utf8'));

          if (model.schemaVersion !== 1) fail('world-law schemaVersion must be 1');
          if (model.status !== 'CANON_READ_MODEL') fail('world-law read model must be CANON_READ_MODEL');
          if (model.source !== 'docs/title1-world-law-canon-v1.md') fail('world-law source drift');
          if (model.laws.length !== 10) fail(`expected 10 promoted laws, got ${model.laws.length}`);
          if (model.seriesOpen.length !== 8) fail(`expected 8 Series/production OPEN questions, got ${model.seriesOpen.length}`);
          if (model.series.length !== 3) fail('series architecture must preserve 1/2/3');
          if (model.laws.some((item) => item.status !== 'CANON')) fail('all Title 1 laws in this model must be CANON');

          const law = (id) => model.laws.find((item) => item.id === id);
          for (const id of ['night','black-ink','black-youka','star-beast','named-object','night-geography','maintainers','yui-tomori','kuroori','yui-seal']) {
            if (!law(id)) fail(`missing promoted law: ${id}`);
          }
          if (!law('black-ink')?.summary.includes('一つの意味だけが正しい')) fail('Black Ink fixation law drift');
          if (!law('yui-tomori')?.summary.includes('同じ物理ランタン')) fail('Yui/Tomori same physical lantern drift');
          if (!law('yui-tomori')?.summary.includes('血縁Canonではない')) fail('Yui/Tomori no-blood guardrail drift');
          if (!law('yui-seal')?.summary.includes('過去のユイ自身')) fail('Yui voluntary sealed memory drift');
          if (!law('night-geography')?.summary.includes('局所Night layer')) fail('Night local layer canon drift');
          if (!law('maintainers')?.summary.includes('複数の時代')) fail('distributed maintainer canon drift');

          for (const phrase of [
            '一つの意味だけが正しい',
            '同じ物理ランタン',
            '血縁Canonにはしない',
            '過去のユイ自身が、クロオリへ一つだけ',
            '複数の人が現実時間の中で『どう残すか』を自分で選んだ物',
            '局所Night layerが重なり合う',
            'maintainerは一人ではない',
            '人間が長い歴史の中で星へ見出してきた',
          ]) {
            if (!canon.includes(phrase)) fail(`Title 1 canon missing phrase: ${phrase}`);
          }

          if (!relations.includes('favoriteRelationship != canon romance vote')) fail('relationship popularity guardrail missing');
          if (!relations.includes('同じ物理ランタン')) fail('relationship source lost same-lantern canon');
          if (!relations.includes('血縁Canonではない')) fail('relationship source lost no-blood guardrail');
          if (!stars.includes('血縁Canonではない')) fail('Star Beast source lost no-blood guardrail');
          if (!stars.includes('商品都合でCanonを変更しない')) fail('Star Beast commercial guardrail missing');
          if (!commercial.includes('Title 1 Happy End never becomes false')) fail('series commercial source lost Title 1 integrity');
          if (!commercial.includes('forced romance')) fail('series commercial source must explicitly block popularity-driven forced romance');

          for (const phrase of ['leo-lantern-lineage','同じ物理ランタン','血縁Canonではない','canes-venatici-siblings']) {
            if (!themeSource.includes(phrase)) fail(`character theme source drift: ${phrase}`);
          }

          const series = Object.fromEntries(model.series.map((item) => [item.id, item]));
          if (!series['1']?.theme.includes('選び直す')) fail('Title 1 theme drift');
          if (!series['2']?.theme.includes('受け取る')) fail('Title 2 theme drift');
          if (!series['3']?.theme.includes('手放す')) fail('Title 3 theme drift');
          const imm = model.immutable.join('\n');
          for (const phrase of ['Happy Endは本物','growthを続編でresetしない','buddy / non-romance','siblings / non-romance','not blood Canon','Popularityだけでrelationship type']) {
            if (!imm.includes(phrase)) fail(`series immutable guardrail missing: ${phrase}`);
          }

          if (process.exitCode) process.exit(process.exitCode);
          console.log('Title 1 world-law canon OK: 10 laws / 8 open / series 1-3 integrity preserved');
          NODE

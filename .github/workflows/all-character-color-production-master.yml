name: All Character Color Production Master

on:
  pull_request:
    paths:
      - 'docs/visual/all-character-color-production-master-v1.md'
      - 'data/visual/all-character-color-production-master-v1.json'
      - 'src/game/data/characterThemeColors.ts'
      - 'data/visual/core5-color-application-master-v1.json'
      - 'data/visual/future15-living-visual-profiles-v1.json'
      - 'tools/asset-factory/scripts/export-color-aware-character-design-prompt.ts'
      - 'data/visual/character-production-generation-entrypoint-v1.json'
      - 'scripts/quality/check-all-character-color-production-master.ts'
      - '.github/workflows/all-character-color-production-master.yml'
  push:
    branches: [main]
    paths:
      - 'docs/visual/all-character-color-production-master-v1.md'
      - 'data/visual/all-character-color-production-master-v1.json'
      - 'src/game/data/characterThemeColors.ts'
      - 'data/visual/core5-color-application-master-v1.json'
      - 'data/visual/future15-living-visual-profiles-v1.json'
      - 'tools/asset-factory/scripts/export-color-aware-character-design-prompt.ts'
      - 'data/visual/character-production-generation-entrypoint-v1.json'
      - 'scripts/quality/check-all-character-color-production-master.ts'
      - '.github/workflows/all-character-color-production-master.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all 36 color production profiles
        run: node --experimental-strip-types scripts/quality/check-all-character-color-production-master.ts

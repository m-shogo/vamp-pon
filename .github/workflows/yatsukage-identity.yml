name: Yatsukage Identity

on:
  pull_request:
    paths:
      - 'src/game/data/yatsukageIdentitySource.ts'
      - 'src/game/data/spotlightEnemyCharacterSource.ts'
      - 'src/game/data/enemyProductionDatabase.ts'
      - 'docs/yatsukage-identity-v1.md'
      - 'scripts/quality/check-yatsukage-identity.ts'
      - '.github/workflows/yatsukage-identity.yml'
  push:
    branches: [main]
    paths:
      - 'src/game/data/yatsukageIdentitySource.ts'
      - 'src/game/data/spotlightEnemyCharacterSource.ts'
      - 'src/game/data/enemyProductionDatabase.ts'
      - 'docs/yatsukage-identity-v1.md'
      - 'scripts/quality/check-yatsukage-identity.ts'
      - '.github/workflows/yatsukage-identity.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check 夜綴りの八影 identity
        run: node --experimental-strip-types scripts/quality/check-yatsukage-identity.ts

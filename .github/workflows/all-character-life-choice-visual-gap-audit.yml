name: All Character Life Choice Visual Gap Audit

on:
  pull_request:
    paths:
      - 'data/visual/core5-living-visual-profiles-v1.json'
      - 'data/visual/current21-extended-living-visual-profiles-v1.json'
      - 'data/visual/future15-living-visual-profiles-v1.json'
      - 'data/visual/all-character-life-choice-visual-gap-audit-v1.json'
      - 'docs/visual/all-character-life-choice-visual-gap-audit-v1.md'
      - 'scripts/quality/build-all-character-life-choice-visual-gap-audit.ts'
      - 'scripts/quality/check-all-character-life-choice-visual-gap-audit.ts'
      - 'docs/visual/all-character-life-choice-visual-gap-audit-generator-v1.md'
      - '.github/workflows/all-character-life-choice-visual-gap-audit.yml'
  push:
    branches: [main]
    paths:
      - 'data/visual/core5-living-visual-profiles-v1.json'
      - 'data/visual/current21-extended-living-visual-profiles-v1.json'
      - 'data/visual/future15-living-visual-profiles-v1.json'
      - 'data/visual/all-character-life-choice-visual-gap-audit-v1.json'
      - 'docs/visual/all-character-life-choice-visual-gap-audit-v1.md'
      - 'scripts/quality/build-all-character-life-choice-visual-gap-audit.ts'
      - 'scripts/quality/check-all-character-life-choice-visual-gap-audit.ts'
      - 'docs/visual/all-character-life-choice-visual-gap-audit-generator-v1.md'
      - '.github/workflows/all-character-life-choice-visual-gap-audit.yml'

jobs:
  derive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive compact 36-character life-choice visual gap audit
        run: node --experimental-strip-types scripts/quality/build-all-character-life-choice-visual-gap-audit.ts --emit-compact
      - name: Validate materialized audit when present
        run: |
          if [ -f scripts/quality/check-all-character-life-choice-visual-gap-audit.ts ]; then
            node --experimental-strip-types scripts/quality/check-all-character-life-choice-visual-gap-audit.ts
          fi

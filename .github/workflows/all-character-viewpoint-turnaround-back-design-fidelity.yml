name: All Character Viewpoint Turnaround Back Design Fidelity Master

on:
  pull_request:
    paths:
      - 'docs/visual/all-character-viewpoint-turnaround-back-design-fidelity-master-v1.md'
      - 'data/visual/all-character-viewpoint-turnaround-back-design-fidelity-master-v1.json'
      - 'data/visual/character-production-generation-entrypoint-v1.json'
      - 'src/game/data/characterReferenceProductionEntrypoint.ts'
      - 'tools/asset-factory/scripts/export-viewpoint-turnaround-character-design-prompt.ts'
      - 'scripts/quality/check-all-character-viewpoint-turnaround-back-design-fidelity.ts'
      - '.github/workflows/all-character-viewpoint-turnaround-back-design-fidelity.yml'
      - 'data/visual/core5-living-visual-profiles-v1.json'
      - 'data/visual/current21-extended-living-visual-profiles-v1.json'
      - 'data/visual/future15-living-visual-profiles-v1.json'
  push:
    branches: [main]
    paths:
      - 'docs/visual/all-character-viewpoint-turnaround-back-design-fidelity-master-v1.md'
      - 'data/visual/all-character-viewpoint-turnaround-back-design-fidelity-master-v1.json'
      - 'data/visual/character-production-generation-entrypoint-v1.json'
      - 'src/game/data/characterReferenceProductionEntrypoint.ts'
      - 'tools/asset-factory/scripts/export-viewpoint-turnaround-character-design-prompt.ts'
      - 'scripts/quality/check-all-character-viewpoint-turnaround-back-design-fidelity.ts'
      - '.github/workflows/all-character-viewpoint-turnaround-back-design-fidelity.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate all-character viewpoint turnaround back-design fidelity authority
        run: node --experimental-strip-types scripts/quality/check-all-character-viewpoint-turnaround-back-design-fidelity.ts

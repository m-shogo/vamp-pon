name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify assets
        run: pnpm assets:verify 2>&1 | tee assets-output.txt

      - name: Run tests
        run: pnpm test 2>&1 | tee test-output.txt

      - name: Build
        if: always()
        run: pnpm build 2>&1 | tee build-output.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics
          path: |
            assets-output.txt
            test-output.txt
            build-output.txt
          if-no-files-found: ignore

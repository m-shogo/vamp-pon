name: Final Branch Equivalence Audit One Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-branch-audit-one-shot.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  audit-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch candidate cleanup branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            agent/title1-unlock-learning-progression-v1 \
            agent/title1-unlock-learning-progression-clean \
            agent/reference-first-bulk-generation-queue-v1
          do
            git fetch --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          done

      - name: Verify Title1 duplicate branches are blob-identical to main
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            .github/workflows/title1-unlock-learning-progression.yml
            docs/title1-unlock-learning-progression-source-v1.md
            scripts/quality/check-title1-unlock-learning-progression.ts
            src/game/data/title1UnlockLearningProgressionSource.ts
            src/game/data/title1UnlockResolutionSource.ts
          )
          for branch in \
            agent/title1-unlock-learning-progression-v1 \
            agent/title1-unlock-learning-progression-clean
          do
            if git show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
              git diff --exit-code origin/main "origin/${branch}" -- "${paths[@]}"
              echo "${branch}: changed blobs identical to main"
            fi
          done

      - name: Verify old reference queue is functionally superseded by main
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/reference-first-bulk-generation-queue-v1
          if ! git show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
            echo "${branch}: already absent"
            exit 0
          fi

          rm -rf /tmp/reference-old /tmp/reference-main
          git worktree add --detach /tmp/reference-old "origin/${branch}"
          git worktree add --detach /tmp/reference-main origin/main

          (
            cd /tmp/reference-old
            node --experimental-strip-types scripts/quality/check-reference-first-bulk-generation-queue.ts
            node --experimental-strip-types scripts/export-reference-first-bulk-generation-queue.ts /tmp/reference-old.json
          )
          (
            cd /tmp/reference-main
            node --experimental-strip-types scripts/quality/check-reference-first-bulk-generation-queue.ts
            node --experimental-strip-types scripts/export-reference-first-bulk-generation-queue.ts /tmp/reference-main.json
          )

          node <<'NODE'
          const fs = require('fs');
          const canonical = value => {
            if (Array.isArray(value)) return value.map(canonical);
            if (value && typeof value === 'object') {
              return Object.fromEntries(Object.keys(value).sort().map(k => [k, canonical(value[k])]));
            }
            return value;
          };
          const oldData = canonical(JSON.parse(fs.readFileSync('/tmp/reference-old.json', 'utf8')));
          const mainData = canonical(JSON.parse(fs.readFileSync('/tmp/reference-main.json', 'utf8')));
          const a = JSON.stringify(oldData);
          const b = JSON.stringify(mainData);
          if (a !== b) {
            console.error('old reference queue export differs from main; preserve branch');
            process.exit(1);
          }
          console.log('old reference queue export is exactly equivalent to main');
          NODE

      - name: Delete only audited branches with execution-time race guards
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const targets = [
              'agent/title1-unlock-learning-progression-v1',
              'agent/title1-unlock-learning-progression-clean',
              'agent/reference-first-bulk-generation-queue-v1',
            ];
            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            for (const branch of targets) {
              if (openPulls.some(pr => pr.head.repo?.full_name === `${owner}/${repo}` && pr.head.ref === branch)) {
                throw new Error(`${branch} became an open PR head; abort deletion`);
              }
              try {
                await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              } catch (error) {
                if (error.status === 404) {
                  console.log(`${branch}: already absent`);
                  continue;
                }
                throw error;
              }
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
              console.log(`deleted audited branch: ${branch}`);
            }

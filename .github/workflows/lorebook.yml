name: Lorebook

on:
  pull_request:
    paths:
      - 'public/lorebook/**'
      - 'docs/lorebook-**'
      - 'docs/CANON.md'
      - 'docs/STORY.md'
      - 'docs/RELATIONSHIPS.md'
      - 'docs/night-black-ink-star-beast-canon-v1.md'
      - 'docs/series-commercial-franchise-architecture-v1.md'
      - 'docs/character-star-beast-constellation-canon-v1.md'
      - 'src/game/data/characterThemeColors.ts'
      - '.github/workflows/lorebook.yml'
  push:
    branches: [main]
    paths:
      - 'public/lorebook/**'
      - 'docs/lorebook-**'
      - 'docs/CANON.md'
      - 'docs/STORY.md'
      - 'docs/RELATIONSHIPS.md'
      - 'docs/night-black-ink-star-beast-canon-v1.md'
      - 'docs/series-commercial-franchise-architecture-v1.md'
      - 'docs/character-star-beast-constellation-canon-v1.md'
      - 'src/game/data/characterThemeColors.ts'
      - '.github/workflows/lorebook.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          for file in app.js enhancements.js profile-enhancement.js relationship-enhancement.js combat-enhancement.js history-enhancement.js decision-lab.js theme-enhancement.js franchise-enhancement.js motion-enhancement.js; do
            node --check "public/lorebook/$file"
          done

      - name: Validate lorebook schemas, canon and franchise contracts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const readJson = (name) => JSON.parse(fs.readFileSync(`public/lorebook/data/${name}`, 'utf8'));
          const world = readJson('world-bible.v1.json');
          const personal = readJson('personal-profiles.v1.json');
          const arcs = readJson('relationship-arcs.v1.json');
          const combat = readJson('combat-guide.v1.json');
          const history = readJson('history-atlas.v1.json');
          const lab = readJson('setting-decision-lab.v1.json');
          const themes = readJson('character-themes.v1.json');
          const franchise = readJson('franchise-strategy.v1.json');
          const themeSource = fs.readFileSync('src/game/data/characterThemeColors.ts', 'utf8');
          const profileSource = fs.readFileSync('public/lorebook/profile-enhancement.js', 'utf8');
          const appSource = fs.readFileSync('public/lorebook/app.js', 'utf8');
          const motionSource = fs.readFileSync('public/lorebook/motion-enhancement.js', 'utf8');
          const decisionSource = fs.readFileSync('public/lorebook/decision-lab.js', 'utf8');
          const canonSource = fs.readFileSync('docs/CANON.md', 'utf8');
          const storySource = fs.readFileSync('docs/STORY.md', 'utf8');
          const starBeastCanon = fs.readFileSync('docs/character-star-beast-constellation-canon-v1.md', 'utf8');
          const fail = (message) => { console.error(message); process.exitCode = 1; };
          const allowed = new Set(['CANON', 'USER_DIRECTION', 'CANDIDATE', 'OPEN_QUESTION']);
          const allowedImplementation = new Set(['playable_data','season_seed','future_seed','official_reserve']);
          const runtimeIds = new Set([
            'yui','asa','nagi','michiru','tomori','sen','ritsu','koyori','gen','hana','yubi','madoka','shiro','tobari','nemu',
            'kuroori','kage1','kage2','kage3','kage4','ren',
          ]);
          const worldIds = new Set(world.characters.map((item) => item.id));
          const worldNames = new Set(world.characters.map((item) => item.name));
          const relationIds = new Set(world.relationships.map((item) => item.id));
          const openIds = new Set(world.openQuestions.map((item) => item.id));

          for (const [name, data] of Object.entries({world, personal, arcs, combat, history, lab, themes, franchise})) {
            if (data.schemaVersion !== 1) fail(`${name}: schemaVersion must be 1`);
          }

          const expectedCounts = [
            ['characters', world.characters.length, 21],
            ['profiles', personal.profiles.length, 21],
            ['combat', combat.entries.length, 21],
            ['themes', themes.characters.length, 21],
            ['relationships', world.relationships.length, 24],
            ['arcs', arcs.arcs.length, 12],
            ['ensembles', arcs.ensembles.length, 4],
            ['history threads', history.objectThreads.length, 5],
            ['decisions', lab.decisions.length, 8],
            ['IP pillars', franchise.entryPillars.length, 5],
            ['series titles', franchise.series.length, 3],
          ];
          for (const [label, actual, expected] of expectedCounts) {
            if (actual !== expected) fail(`${label}: expected ${expected}, got ${actual}`);
          }
          if (history.timeLayers.length !== 3) fail('history must keep reality/night/dawn layers');
          if (franchise.popularityDimensions.length < 6) fail('popularity must remain multi-dimensional');
          if (franchise.relationshipLanes.length < 5) fail('commercial relationship lanes incomplete');

          const unique = (list, label) => {
            if (new Set(list).size !== list.length) fail(`duplicate ${label}`);
          };
          unique(world.characters.map((item) => item.id), 'character id');
          unique(world.characters.map((item) => item.name), 'character name');
          unique(world.relationships.map((item) => item.id), 'relationship id');
          unique(personal.profiles.map((item) => item.lorebookId), 'profile lorebookId');
          unique(personal.profiles.map((item) => item.runtimeId), 'profile runtimeId');
          unique(combat.entries.map((item) => item.lorebookId), 'combat lorebookId');
          unique(themes.characters.map((item) => item.lorebookId), 'theme lorebookId');
          unique(arcs.arcs.map((item) => item.relationshipId), 'arc relationship id');
          unique(history.objectThreads.map((item) => item.id), 'history thread id');
          unique(lab.decisions.map((item) => item.id), 'decision id');

          for (const character of world.characters) {
            if (!character.name || !character.core || !character.growth) fail(`incomplete character: ${character.id}`);
            if (!allowed.has(character.status)) fail(`invalid character status: ${character.id}/${character.status}`);
          }
          for (const relation of world.relationships) {
            if (!worldIds.has(relation.from) || !worldIds.has(relation.to)) fail(`orphan relation: ${relation.id}`);
            if (relation.from === relation.to) fail(`self relation: ${relation.id}`);
            if (!allowed.has(relation.status)) fail(`invalid relation status: ${relation.id}/${relation.status}`);
          }
          for (const item of [...world.timeline, ...world.openQuestions, ...history.timeLayers]) {
            if (!allowed.has(item.status)) fail(`invalid content status: ${item.id}/${item.status}`);
          }

          // Explicit user-promoted Title 1 canon. These guards replace the obsolete all-candidate gate.
          const expectedOpen = [
            'q-night-origin','q-night-maintainer','q-star-beast-origin','q-object-crossing',
            'q-era-map','q-kuroori-yui-seal','q-night-geography','q-sequel',
          ].sort();
          const actualOpen = [...openIds].sort();
          if (JSON.stringify(actualOpen) !== JSON.stringify(expectedOpen)) fail(`open-question drift: ${actualOpen.join(',')}`);
          if (world.story?.engineStatus !== 'CANON') fail('Black Ink behavior law must remain Title 1 CANON');
          if (!world.story?.engineCandidate?.includes('一つの意味だけが正しい')) fail('Black Ink fixation law missing from read model');
          const yuiTomori = world.relationships.find((item) => item.id === 'rel-yui-tomori');
          if (!yuiTomori || yuiTomori.status !== 'CANON' || yuiTomori.type !== 'object_lineage') fail('Yui/Tomori must remain CANON object_lineage');
          if (!yuiTomori.summary.includes('血縁Canonではない')) fail('Yui/Tomori no-blood guardrail missing');
          for (const id of ['timeline-real-eras','timeline-object-lineage','timeline-night','timeline-dawn']) {
            if (world.timeline.find((item) => item.id === id)?.status !== 'CANON') fail(`${id} must remain CANON`);
          }
          if (!canonSource.includes('一つの意味だけが正しい')) fail('CANON.md lost Black Ink fixation law');
          if (!storySource.includes('同じ物理ランタン')) fail('STORY.md lost same physical lantern canon');
          if (!starBeastCanon.includes('血縁Canonではない')) fail('Star Beast canon lost Yui/Tomori no-blood rule');
          if (!appSource.includes("engineStatus === 'CANON'")) fail('Lorebook must render Black Ink law as CANON');

          for (const profile of personal.profiles) {
            if (!worldIds.has(profile.lorebookId) || !worldNames.has(profile.name)) fail(`profile/world drift: ${profile.lorebookId}`);
            if (!runtimeIds.has(profile.runtimeId)) fail(`unexpected runtimeId: ${profile.runtimeId}`);
            for (const key of ['birthday','ageImpression','favoriteFood','hobby','smallHabit','likes','dislikes','dailyLifeScene']) {
              if (!profile[key]) fail(`profile ${profile.lorebookId} missing ${key}`);
            }
          }
          if (profileSource.includes('profile.zodiac')) fail('deprecated birthday zodiac must not be rendered');
          for (const id of runtimeIds) {
            if (!personal.profiles.some((item) => item.runtimeId === id)) fail(`missing runtime mapping: ${id}`);
          }

          for (const entry of combat.entries) {
            if (!worldIds.has(entry.lorebookId) || !runtimeIds.has(entry.runtimeId)) fail(`combat mapping drift: ${entry.lorebookId}`);
            if (!allowedImplementation.has(entry.implementationStatus)) fail(`invalid implementation status: ${entry.lorebookId}`);
            const profile = personal.profiles.find((item) => item.lorebookId === entry.lorebookId);
            if (!profile || profile.runtimeId !== entry.runtimeId) fail(`combat/profile runtime drift: ${entry.lorebookId}`);
            for (const key of ['vessel','lineage','firstAction','blank','role','starter','playFeel','strength','weakness']) {
              if (!entry[key]) fail(`combat ${entry.lorebookId} missing ${key}`);
            }
            for (const key of ['lampArt','inheritedLight','dawnLight']) {
              if (!entry.arts?.[key]) fail(`combat ${entry.lorebookId} missing art ${key}`);
            }
          }

          const primary = new Map();
          const starColors = new Map();
          const constellations = new Map();
          for (const entry of themes.characters) {
            if (!worldIds.has(entry.lorebookId) || !runtimeIds.has(entry.runtimeId)) fail(`theme mapping drift: ${entry.lorebookId}`);
            const profile = personal.profiles.find((item) => item.lorebookId === entry.lorebookId);
            if (!profile || profile.runtimeId !== entry.runtimeId) fail(`theme/profile runtime drift: ${entry.lorebookId}`);
            for (const value of [entry.primary?.hex, entry.accent?.hex, entry.constellation?.colorHex]) {
              if (!/^#[0-9A-F]{6}$/.test(value ?? '')) fail(`invalid uppercase HEX: ${entry.lorebookId}/${value}`);
            }
            if (!themeSource.includes(`displayName: '${entry.name}'`) || !themeSource.includes(entry.primary.hex) || !themeSource.includes(entry.constellation.colorHex)) fail(`theme source drift: ${entry.lorebookId}`);
            for (const [map, key] of [[primary, entry.primary.hex],[starColors, entry.constellation.colorHex],[constellations, entry.constellation.key]]) {
              map.set(key, [...(map.get(key) ?? []), entry]);
            }
          }
          for (const [hex, users] of primary) {
            if (users.length !== 1) fail(`primary HEX must be unique: ${hex}/${users.map((item) => item.name).join(',')}`);
          }
          const validateShared = (kind, key, users) => {
            if (users.length < 2) return;
            const families = new Set(users.map((item) => item.paletteFamilyKey));
            if (families.size !== 1 || families.has(null) || families.has(undefined)) fail(`${kind} duplicate lacks one family: ${key}`);
            if (users.some((item) => !item.sharedReason)) fail(`${kind} duplicate lacks reason: ${key}`);
          };
          for (const [key, users] of starColors) validateShared('star color', key, users);
          for (const [key, users] of constellations) validateShared('constellation', key, users);
          const duplicates = [...constellations.entries()].filter(([, users]) => users.length > 1).map(([key]) => key).sort();
          if (JSON.stringify(duplicates) !== JSON.stringify(['canes-venatici','leo'])) fail(`unexpected constellation duplicates: ${duplicates.join(',')}`);
          if (!themes.rules?.birthdayZodiac?.includes('deprecated')) fail('theme DB must deprecate birthday zodiac');
          for (const id of ['yui','tomori']) {
            const entry = themes.characters.find((item) => item.lorebookId === id);
            if (!entry?.sharedReason?.includes('同じ物理ランタン') || !entry.sharedReason.includes('血縁Canonではない')) fail(`${id} shared Leo reason drift`);
          }

          for (const arc of arcs.arcs) {
            if (!relationIds.has(arc.relationshipId)) fail(`orphan arc: ${arc.relationshipId}`);
            for (const key of ['firstRead','usefulFriction','failureExposure','chosenTrust','dawnProof']) if (!arc[key]) fail(`arc ${arc.relationshipId} missing ${key}`);
          }
          for (const ensemble of arcs.ensembles) {
            if ((ensemble.members?.length ?? 0) < 3) fail(`ensemble too small: ${ensemble.id}`);
            for (const member of ensemble.members ?? []) if (!worldIds.has(member)) fail(`orphan ensemble member: ${ensemble.id}/${member}`);
          }

          for (const thread of history.objectThreads) {
            if (!allowed.has(thread.status)) fail(`invalid history status: ${thread.id}/${thread.status}`);
            if ((thread.members?.length ?? 0) < 2) fail(`history thread too small: ${thread.id}`);
            for (const member of thread.members) if (!worldIds.has(member)) fail(`orphan history member: ${thread.id}/${member}`);
            for (const key of ['known','gap','payoff','confidence']) if (!thread[key] || (key === 'known' && !thread.known.length)) fail(`history ${thread.id} missing ${key}`);
          }
          const lantern = history.objectThreads.find((item) => item.id === 'thread-lantern');
          if (!lantern || lantern.status !== 'CANON' || !lantern.known.some((item) => item.includes('同じ物理ランタン'))) fail('confirmed lantern thread drift');
          if (history.eraMethod?.status !== 'CANON' || history.eraMethod?.layers?.length !== 4) fail('Relative Era method must remain CANON with four layers');
          if (!history.statusRule?.includes('never inferred as CANON')) fail('history gap guardrail missing');

          for (const decision of lab.decisions) {
            if (!openIds.has(decision.openQuestionId)) fail(`decision has no current OPEN question: ${decision.id}`);
            if ((decision.options?.length ?? 0) < 2) fail(`decision needs multiple options: ${decision.id}`);
            if (!decision.options.some((option) => option.id === decision.recommendedOptionId)) fail(`decision recommended option missing: ${decision.id}`);
            if (!decision.recommendation || !(decision.doNotLockYet?.length)) fail(`decision guardrail incomplete: ${decision.id}`);
            for (const option of decision.options) for (const key of ['coherence','emotion','futureFreedom','risk']) {
              if (!Number.isInteger(option[key]) || option[key] < 1 || option[key] > 5) fail(`invalid decision score: ${decision.id}/${option.id}/${key}`);
            }
          }
          unique(lab.recommendedDecisionOrder, 'decision order entry');
          if (lab.recommendedDecisionOrder.length !== lab.decisions.length) fail('decision order must cover all decisions');
          if (!lab.statusRule?.includes('Resolved Title 1 laws')) fail('Decision Lab must not reopen resolved Title 1 canon');
          if (decisionSource.includes('AI DESIGN RECOMMENDATION')) fail('AI-like recommendation label must remain removed');

          if (franchise.source !== 'docs/series-commercial-franchise-architecture-v1.md') fail('franchise source drift');
          if (JSON.stringify(franchise.series.map((item) => item.id)) !== JSON.stringify(['yoruno-1','yoruno-2','yoruno-3'])) fail('series order drift');
          for (const title of franchise.series) if (!title.question || !title.mustPay?.length || !title.mustNotDo?.length) fail(`series contract incomplete: ${title.id}`);
          if (!franchise.commercialGuardrails?.allowedFromPopularity?.length || !franchise.commercialGuardrails?.forbiddenFromPopularity?.length) fail('commercial popularity guardrails missing');
          if (!franchise.commercialGuardrails.forbiddenFromPopularity.some((item) => item.includes('forced romance'))) fail('commercial rules must forbid forced romance');
          if (!franchise.commercialGuardrails.forbiddenFromPopularity.some((item) => item.includes('Main Mystery'))) fail('commercial rules must protect Main Mystery truth');

          for (const source of ['docs/CANON.md','docs/CHARACTERS.md','docs/night-black-ink-star-beast-canon-v1.md','docs/series-commercial-franchise-architecture-v1.md']) {
            if (!world.authority?.sources?.includes(source)) fail(`world authority source missing: ${source}`);
          }
          if (personal.source !== 'docs/character-personal-profile-canon-v1.md') fail('profile source drift');
          if (arcs.source !== 'docs/character-relationship-arc-book-v1.md') fail('arc source drift');
          if (!combat.sources?.includes('src/game/data/characterCanon.ts') || !combat.sources?.includes('src/game/data/reserveCharacterCanon.ts')) fail('combat source drift');
          if (!history.sources?.includes('docs/night-black-ink-star-beast-canon-v1.md')) fail('history current canon source missing');
          if (!themes.sources?.includes('src/game/data/characterThemeColors.ts') || !themes.sources?.includes('docs/character-star-beast-constellation-canon-v1.md')) fail('theme source drift');

          for (const token of ['--dawn-progress','--sky-top','--sky-horizon','--star-opacity']) if (!motionSource.includes(token)) fail(`dawn motion missing ${token}`);
          if (!motionSource.includes("['夜半', 'MIDNIGHT']") || !motionSource.includes("['朝', 'MORNING']")) fail('night-to-morning labels missing');
          if (motionSource.includes('installPointerLight') || motionSource.includes('installCardLight')) fail('pointer glow must remain removed');

          if (process.exitCode) process.exit(process.exitCode);
          console.log(`Lorebook OK: 21 characters / 24 relationships / 12 arcs / 5 history threads / 8 open decisions / 21 palettes / 5 IP pillars / series 1-3`);
          NODE

      - name: Verify enhancement bootstrap and static entrypoint
        run: |
          grep -q './styles.css' public/lorebook/index.html
          grep -q './app.js' public/lorebook/index.html
          grep -q './enhancements.js' public/lorebook/index.html
          grep -q 'id="prologue"' public/lorebook/index.html
          grep -q 'id="skipPrologue"' public/lorebook/index.html
          grep -q 'id="readingProgress"' public/lorebook/index.html
          for module in profile-enhancement relationship-enhancement combat-enhancement history-enhancement decision-lab theme-enhancement franchise-enhancement motion-enhancement; do grep -q "./${module}.js" public/lorebook/enhancements.js; done
          ! grep -q 'relationship-enhancement.js' public/lorebook/profile-enhancement.js
          for pair in 'profile-enhancement.js:profile.css' 'relationship-enhancement.js:relationship.css' 'combat-enhancement.js:combat.css' 'history-enhancement.js:history.css' 'decision-lab.js:decision-lab.css' 'theme-enhancement.js:theme.css' 'franchise-enhancement.js:franchise.css' 'motion-enhancement.js:motion.css'; do
            js="${pair%%:*}"; css="${pair##*:}"; grep -q "./${css}" "public/lorebook/${js}";
          done
          for file in styles.css profile.css relationship.css combat.css history.css decision-lab.css theme.css franchise.css motion.css app.js enhancements.js profile-enhancement.js relationship-enhancement.js combat-enhancement.js history-enhancement.js decision-lab.js theme-enhancement.js franchise-enhancement.js motion-enhancement.js; do test -f "public/lorebook/$file"; done
          for file in world-bible.v1.json personal-profiles.v1.json relationship-arcs.v1.json combat-guide.v1.json history-atlas.v1.json setting-decision-lab.v1.json character-themes.v1.json franchise-strategy.v1.json; do test -f "public/lorebook/data/$file"; done
          test -f docs/night-black-ink-star-beast-canon-v1.md
          test -f docs/series-commercial-franchise-architecture-v1.md

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify deployable Vite output
        run: |
          pnpm build
          test -f dist/lorebook/index.html
          for file in styles.css profile.css relationship.css combat.css history.css decision-lab.css theme.css franchise.css motion.css app.js enhancements.js profile-enhancement.js relationship-enhancement.js combat-enhancement.js history-enhancement.js decision-lab.js theme-enhancement.js franchise-enhancement.js motion-enhancement.js; do test -f "dist/lorebook/$file"; done
          for file in world-bible.v1.json personal-profiles.v1.json relationship-arcs.v1.json combat-guide.v1.json history-atlas.v1.json setting-decision-lab.v1.json character-themes.v1.json franchise-strategy.v1.json; do test -f "dist/lorebook/data/$file"; done

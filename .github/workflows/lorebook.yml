name: Lorebook

on:
  pull_request:
    paths:
      - 'public/lorebook/**'
      - 'docs/lorebook-**'
      - 'docs/CANON.md'
      - 'docs/STORY.md'
      - 'docs/RELATIONSHIPS.md'
      - 'docs/night-black-ink-star-beast-canon-v1.md'
      - 'docs/series-commercial-franchise-architecture-v1.md'
      - 'docs/character-star-beast-constellation-canon-v1.md'
      - 'src/game/data/characterThemeColors.ts'
      - '.github/workflows/lorebook.yml'
  push:
    branches:
      - main
    paths:
      - 'public/lorebook/**'
      - 'docs/lorebook-**'
      - 'docs/CANON.md'
      - 'docs/STORY.md'
      - 'docs/RELATIONSHIPS.md'
      - 'docs/night-black-ink-star-beast-canon-v1.md'
      - 'docs/series-commercial-franchise-architecture-v1.md'
      - 'docs/character-star-beast-constellation-canon-v1.md'
      - 'src/game/data/characterThemeColors.ts'
      - '.github/workflows/lorebook.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          for file in app.js enhancements.js profile-enhancement.js relationship-enhancement.js combat-enhancement.js history-enhancement.js decision-lab.js theme-enhancement.js franchise-enhancement.js motion-enhancement.js; do
            node --check "public/lorebook/$file"
          done

      - name: Validate lorebook schemas and references
        run: |
          node <<'NODE'
          const fs = require('fs');
          const world = JSON.parse(fs.readFileSync('public/lorebook/data/world-bible.v1.json', 'utf8'));
          const personal = JSON.parse(fs.readFileSync('public/lorebook/data/personal-profiles.v1.json', 'utf8'));
          const arcs = JSON.parse(fs.readFileSync('public/lorebook/data/relationship-arcs.v1.json', 'utf8'));
          const combat = JSON.parse(fs.readFileSync('public/lorebook/data/combat-guide.v1.json', 'utf8'));
          const history = JSON.parse(fs.readFileSync('public/lorebook/data/history-atlas.v1.json', 'utf8'));
          const lab = JSON.parse(fs.readFileSync('public/lorebook/data/setting-decision-lab.v1.json', 'utf8'));
          const themes = JSON.parse(fs.readFileSync('public/lorebook/data/character-themes.v1.json', 'utf8'));
          const franchise = JSON.parse(fs.readFileSync('public/lorebook/data/franchise-strategy.v1.json', 'utf8'));
          const themeSource = fs.readFileSync('src/game/data/characterThemeColors.ts', 'utf8');
          const profileSource = fs.readFileSync('public/lorebook/profile-enhancement.js', 'utf8');
          const motionSource = fs.readFileSync('public/lorebook/motion-enhancement.js', 'utf8');
          const decisionSource = fs.readFileSync('public/lorebook/decision-lab.js', 'utf8');
          const fail = (message) => { console.error(message); process.exitCode = 1; };
          const allowed = new Set(['CANON', 'USER_DIRECTION', 'CANDIDATE', 'OPEN_QUESTION']);
          const allowedImplementation = new Set(['playable_data','season_seed','future_seed','official_reserve']);
          const worldIds = new Set(world.characters.map((c) => c.id));
          const worldNames = new Set(world.characters.map((c) => c.name));
          const relationIds = new Set(world.relationships.map((r) => r.id));
          const openQuestionIds = new Set(world.openQuestions.map((item) => item.id));
          const runtimeIds = new Set([
            'yui', 'asa', 'nagi', 'michiru', 'tomori',
            'sen', 'ritsu', 'koyori', 'gen', 'hana', 'yubi', 'madoka', 'shiro', 'tobari', 'nemu',
            'kuroori', 'kage1', 'kage2', 'kage3', 'kage4', 'ren',
          ]);

          for (const [name, data] of Object.entries({world, personal, arcs, combat, lab, themes, franchise})) {
            if (data.schemaVersion !== 1) fail(`${name} schemaVersion must be 1`);
          }
          if (history.schemaVersion !== 2) fail(`history schemaVersion must be 2, got ${history.schemaVersion}`);
          if (world.characters.length !== 21) fail(`expected Current21, got ${world.characters.length}`);
          if (personal.profiles.length !== 21) fail(`expected 21 personal profiles, got ${personal.profiles.length}`);
          if (combat.entries.length !== 21) fail(`expected 21 combat guide entries, got ${combat.entries.length}`);
          if (themes.characters.length !== 21) fail(`expected 21 theme entries, got ${themes.characters.length}`);
          if (world.relationships.length !== 24) fail(`expected 24 priority relationships, got ${world.relationships.length}`);
          if (arcs.arcs.length !== 12) fail(`expected 12 production relationship arcs, got ${arcs.arcs.length}`);
          if (arcs.ensembles.length !== 4) fail(`expected 4 ensemble relationship groups, got ${arcs.ensembles.length}`);
          if (history.timeLayers.length !== 3) fail(`expected 3 history time layers, got ${history.timeLayers.length}`);
          if (history.objectThreads.length !== 5) fail(`expected 5 object history threads, got ${history.objectThreads.length}`);
          if (lab.decisions.length !== world.openQuestions.length) fail(`decision lab/open question mismatch: ${lab.decisions.length}/${world.openQuestions.length}`);
          if (franchise.entryPillars.length !== 5) fail(`expected five commercial entry pillars, got ${franchise.entryPillars.length}`);
          if (franchise.popularityDimensions.length < 6) fail('popularity model must keep multiple preference dimensions');
          if (franchise.relationshipLanes.length < 5) fail('commercial relationship lanes are incomplete');
          if (franchise.series.length !== 3) fail(`expected 1/2/3 series architecture, got ${franchise.series.length}`);

          if (new Set(world.characters.map((c) => c.id)).size !== world.characters.length) fail('duplicate character id');
          if (new Set(world.characters.map((c) => c.name)).size !== world.characters.length) fail('duplicate character name');
          if (new Set(world.relationships.map((r) => r.id)).size !== world.relationships.length) fail('duplicate relationship id');
          if (new Set(personal.profiles.map((p) => p.lorebookId)).size !== personal.profiles.length) fail('duplicate profile lorebookId');
          if (new Set(personal.profiles.map((p) => p.runtimeId)).size !== personal.profiles.length) fail('duplicate profile runtimeId');
          if (new Set(combat.entries.map((entry) => entry.lorebookId)).size !== combat.entries.length) fail('duplicate combat lorebookId');
          if (new Set(combat.entries.map((entry) => entry.runtimeId)).size !== combat.entries.length) fail('duplicate combat runtimeId');
          if (new Set(themes.characters.map((entry) => entry.lorebookId)).size !== themes.characters.length) fail('duplicate theme lorebookId');
          if (new Set(themes.characters.map((entry) => entry.runtimeId)).size !== themes.characters.length) fail('duplicate theme runtimeId');
          if (new Set(arcs.arcs.map((arc) => arc.relationshipId)).size !== arcs.arcs.length) fail('duplicate relationship arc id');
          if (new Set(history.objectThreads.map((thread) => thread.id)).size !== history.objectThreads.length) fail('duplicate history thread id');
          if (new Set(lab.decisions.map((decision) => decision.id)).size !== lab.decisions.length) fail('duplicate setting decision id');

          for (const character of world.characters) {
            if (!character.name || !character.core || !character.growth) fail(`incomplete character: ${character.id}`);
            if (!allowed.has(character.status)) fail(`unknown character status: ${character.id}/${character.status}`);
          }
          for (const relation of world.relationships) {
            if (!worldIds.has(relation.from) || !worldIds.has(relation.to)) fail(`orphan relation: ${relation.id}`);
            if (relation.from === relation.to) fail(`self relation: ${relation.id}`);
            if (!allowed.has(relation.status)) fail(`unknown relation status: ${relation.id}/${relation.status}`);
          }
          for (const item of [...world.timeline, ...world.openQuestions, ...history.timeLayers]) {
            if (!allowed.has(item.status)) fail(`unknown content status: ${item.id}/${item.status}`);
          }

          const expectedOpenQuestions = [
            'q-night-nature', 'q-black-ink-engine', 'q-night-maker', 'q-star-beast',
            'q-yui-tomori', 'q-era-map', 'q-kuroori', 'q-sequel',
          ].sort();
          const actualOpenQuestions = [...openQuestionIds].sort();
          if (JSON.stringify(actualOpenQuestions) !== JSON.stringify(expectedOpenQuestions)) fail(`human-promotion open-question drift: ${actualOpenQuestions.join(',')}`);
          if (!world.authority?.rule?.includes('自動的に正史へ昇格しない')) fail('world authority must preserve no-auto-canon rule');
          if (world.story?.engineStatus === 'CANON') fail('Black Ink engine must remain CANDIDATE until explicit human promotion');
          if (!world.story?.engineCandidate) fail('Black Ink engine candidate must remain explicit');
          const yuiTomori = world.relationships.find((item) => item.id === 'rel-yui-tomori');
          if (!yuiTomori || yuiTomori.status !== 'CANDIDATE') fail('Yui/Tomori relation must remain CANDIDATE until explicit human promotion');
          if (yuiTomori.type !== 'mystery') fail('Yui/Tomori relation must remain a mystery before promotion');
          if (world.timeline.some((item) => ['timeline-real-eras','timeline-object-lineage','timeline-night','timeline-dawn'].includes(item.id) && item.status === 'CANON')) fail('time model must not auto-promote to CANON');

          for (const profile of personal.profiles) {
            if (!worldIds.has(profile.lorebookId)) fail(`profile missing world character: ${profile.lorebookId}`);
            if (!worldNames.has(profile.name)) fail(`profile display name missing from world bible: ${profile.name}`);
            if (!runtimeIds.has(profile.runtimeId)) fail(`unexpected runtimeId: ${profile.name}/${profile.runtimeId}`);
            for (const key of ['birthday','ageImpression','favoriteFood','hobby','smallHabit','likes','dislikes','dailyLifeScene']) {
              if (!profile[key]) fail(`incomplete personal profile ${profile.lorebookId}: ${key}`);
            }
          }
          if (profileSource.includes('profile.zodiac')) fail('birthday-derived zodiac must not be rendered; favoriteConstellation supersedes it');
          for (const runtimeId of runtimeIds) {
            if (!personal.profiles.some((profile) => profile.runtimeId === runtimeId)) fail(`missing stable runtimeId mapping: ${runtimeId}`);
          }

          for (const entry of combat.entries) {
            if (!worldIds.has(entry.lorebookId)) fail(`combat entry missing world character: ${entry.lorebookId}`);
            if (!runtimeIds.has(entry.runtimeId)) fail(`unexpected combat runtimeId: ${entry.lorebookId}/${entry.runtimeId}`);
            const personalEntry = personal.profiles.find((profile) => profile.lorebookId === entry.lorebookId);
            if (!personalEntry || personalEntry.runtimeId !== entry.runtimeId) fail(`combat/profile runtime mapping drift: ${entry.lorebookId}`);
            if (!allowedImplementation.has(entry.implementationStatus)) fail(`invalid implementation status: ${entry.lorebookId}/${entry.implementationStatus}`);
            for (const key of ['vessel','lineage','firstAction','blank','role','starter','playFeel','strength','weakness']) {
              if (!entry[key]) fail(`incomplete combat guide ${entry.lorebookId}: ${key}`);
            }
            for (const key of ['lampArt','inheritedLight','dawnLight']) {
              if (!entry.arts?.[key]) fail(`incomplete arts guide ${entry.lorebookId}: ${key}`);
            }
          }

          const primaryColors = new Map();
          const constellationColors = new Map();
          const constellationKeys = new Map();
          for (const entry of themes.characters) {
            if (!worldIds.has(entry.lorebookId)) fail(`theme missing world character: ${entry.lorebookId}`);
            if (!runtimeIds.has(entry.runtimeId)) fail(`unexpected theme runtimeId: ${entry.lorebookId}/${entry.runtimeId}`);
            const profile = personal.profiles.find((item) => item.lorebookId === entry.lorebookId);
            if (!profile || profile.runtimeId !== entry.runtimeId) fail(`theme/profile runtime mapping drift: ${entry.lorebookId}`);
            for (const value of [entry.primary?.hex, entry.accent?.hex, entry.constellation?.colorHex]) {
              if (!/^#[0-9A-F]{6}$/.test(value ?? '')) fail(`invalid uppercase HEX: ${entry.lorebookId}/${value}`);
            }
            if (!entry.constellation?.key || !entry.constellation?.name || !entry.constellation?.starBeast) fail(`incomplete star-beast theme: ${entry.lorebookId}`);
            if (!themeSource.includes(`displayName: '${entry.name}'`)) fail(`theme source displayName drift: ${entry.lorebookId}/${entry.name}`);
            if (!themeSource.includes(entry.primary.hex) || !themeSource.includes(entry.constellation.colorHex)) fail(`theme source HEX drift: ${entry.lorebookId}`);
            const primaryUsers = primaryColors.get(entry.primary.hex) ?? [];
            primaryUsers.push(entry);
            primaryColors.set(entry.primary.hex, primaryUsers);
            const starUsers = constellationColors.get(entry.constellation.colorHex) ?? [];
            starUsers.push(entry);
            constellationColors.set(entry.constellation.colorHex, starUsers);
            const constellationUsers = constellationKeys.get(entry.constellation.key) ?? [];
            constellationUsers.push(entry);
            constellationKeys.set(entry.constellation.key, constellationUsers);
          }
          for (const [hex, users] of primaryColors) {
            if (users.length !== 1) fail(`primary theme color must be unique: ${hex}/${users.map((item) => item.name).join(',')}`);
          }
          const validateMeaningfulDuplicate = (kind, key, users) => {
            if (users.length < 2) return;
            const familyKeys = new Set(users.map((item) => item.paletteFamilyKey));
            if (familyKeys.size !== 1 || familyKeys.has(null) || familyKeys.has(undefined)) fail(`${kind} duplicate missing shared palette family: ${key}`);
            for (const user of users) {
              if (!user.sharedReason) fail(`${kind} duplicate missing reason: ${key}/${user.name}`);
            }
          };
          for (const [hex, users] of constellationColors) validateMeaningfulDuplicate('constellation color', hex, users);
          for (const [key, users] of constellationKeys) validateMeaningfulDuplicate('constellation', key, users);
          const duplicatedConstellations = [...constellationKeys.entries()].filter(([, users]) => users.length > 1).map(([key]) => key).sort();
          if (JSON.stringify(duplicatedConstellations) !== JSON.stringify(['canes-venatici','leo'])) fail(`unexpected constellation duplicates: ${duplicatedConstellations.join(',')}`);
          if (!themes.rules?.birthdayZodiac?.includes('deprecated')) fail('theme DB must explicitly deprecate birthday zodiac');

          for (const arc of arcs.arcs) {
            if (!relationIds.has(arc.relationshipId)) fail(`orphan relationship arc: ${arc.relationshipId}`);
            for (const key of ['firstRead','usefulFriction','failureExposure','chosenTrust','dawnProof']) {
              if (!arc[key]) fail(`incomplete relationship arc ${arc.relationshipId}: ${key}`);
            }
          }
          for (const ensemble of arcs.ensembles) {
            if (!ensemble.members?.length || ensemble.members.length < 3) fail(`ensemble must have 3+ members: ${ensemble.id}`);
            for (const member of ensemble.members ?? []) {
              if (!worldIds.has(member)) fail(`orphan ensemble member: ${ensemble.id}/${member}`);
            }
          }

          for (const thread of history.objectThreads) {
            if (thread.status !== 'CANDIDATE') fail(`history thread must remain CANDIDATE: ${thread.id}/${thread.status}`);
            if (!thread.members?.length || thread.members.length < 2) fail(`history thread requires 2+ members: ${thread.id}`);
            for (const member of thread.members) {
              if (!worldIds.has(member)) fail(`orphan history thread member: ${thread.id}/${member}`);
            }
            for (const key of ['known','gap','payoff','evidenceState']) {
              if (!thread[key] || (key === 'known' && thread.known.length === 0)) fail(`incomplete history thread ${thread.id}: ${key}`);
            }
            if ('confidence' in thread) fail(`legacy history confidence field is forbidden: ${thread.id}`);
          }
          if (history.eraMethod?.status !== 'AUTHOR_CANDIDATE_NON_CANON_EXCEPT_UPSTREAM_LOCKS') fail('History era method status drift');
          if (history.eraMethod?.characterCount !== 36 || history.eraMethod?.current21Count !== 21 || history.eraMethod?.future15Count !== 15) fail('History era method roster counts drift');
          if (history.eraMethod?.lanes?.filter((lane) => lane.kind === 'REALITY_LANE').length !== 5) fail('History era method must keep five chronological Reality lanes');
          if (history.eraMethod?.lanes?.filter((lane) => lane.kind === 'MYSTERY_SPECIAL_NOT_SIXTH_REALITY_ERA').length !== 1) fail('History era method must keep one non-chronological Mystery special');
          if (history.eraMethod?.upstreamLocks?.length !== 5) fail('History era method must keep five upstream-current locks');
          if (history.eraMethod?.exactYearFrozen !== false) fail('History exact year must remain Open');
          if (history.eraMethod?.future15MeansFutureEra !== false) fail('Future15 must not become future-era origin');
          if (!history.statusRule?.includes('remain Open') || !history.statusRule?.includes('never inferred as Canon')) fail('history atlas must preserve Open/Candidate gap guardrail');

          for (const decision of lab.decisions) {
            if (!openQuestionIds.has(decision.openQuestionId)) fail(`decision without open question: ${decision.id}/${decision.openQuestionId}`);
            if (!decision.options?.length || decision.options.length < 2) fail(`decision requires multiple options: ${decision.id}`);
            if (!decision.options.some((option) => option.id === decision.recommendedOptionId)) fail(`missing recommended option: ${decision.id}/${decision.recommendedOptionId}`);
            if (!decision.recommendation || !decision.doNotLockYet?.length) fail(`decision missing recommendation guardrails: ${decision.id}`);
            for (const option of decision.options) {
              for (const key of ['coherence','emotion','futureFreedom','risk']) {
                if (!Number.isInteger(option[key]) || option[key] < 1 || option[key] > 5) fail(`invalid decision score: ${decision.id}/${option.id}/${key}`);
              }
            }
          }
          if (new Set(lab.recommendedDecisionOrder).size !== lab.decisions.length) fail('decision order must cover each decision exactly once');
          for (const decisionId of lab.recommendedDecisionOrder) {
            if (!lab.decisions.some((decision) => decision.id === decisionId)) fail(`unknown decision in order: ${decisionId}`);
          }
          if (!lab.statusRule?.includes('CANDIDATE')) fail('decision lab must explicitly remain CANDIDATE');
          if (decisionSource.includes('AI DESIGN RECOMMENDATION')) fail('author UI must not use AI-like recommendation label');

          const expectedSeries = ['yoruno-1','yoruno-2','yoruno-3'];
          if (JSON.stringify(franchise.series.map((item) => item.id)) !== JSON.stringify(expectedSeries)) fail('series architecture must preserve 1/2/3 order');
          for (const title of franchise.series) {
            if (!title.question || !title.mustPay?.length || !title.mustNotDo?.length) fail(`incomplete series contract: ${title.id}`);
          }
          if (franchise.source !== 'docs/series-commercial-franchise-architecture-v1.md') fail('franchise source drift');
          if (!franchise.commercialGuardrails?.allowedFromPopularity?.length || !franchise.commercialGuardrails?.forbiddenFromPopularity?.length) fail('commercial popularity guardrails missing');
          if (!franchise.commercialGuardrails.forbiddenFromPopularity.some((item) => item.includes('forced romance'))) fail('commercial guardrail must forbid forced romance');
          if (!franchise.commercialGuardrails.forbiddenFromPopularity.some((item) => item.includes('Main Mystery'))) fail('commercial guardrail must protect Main Mystery truth');

          if (!world.authority?.sources?.includes('docs/CANON.md')) fail('CANON.md must remain an authority source');
          if (!world.authority?.sources?.includes('docs/CHARACTERS.md')) fail('CHARACTERS.md must remain an authority source');
          if (personal.source !== 'docs/character-personal-profile-canon-v1.md') fail('personal profile source drift');
          if (arcs.source !== 'docs/character-relationship-arc-book-v1.md') fail('relationship arc source drift');
          if (!combat.sources?.includes('src/game/data/characterCanon.ts')) fail('combat guide main source drift');
          if (!combat.sources?.includes('src/game/data/reserveCharacterCanon.ts')) fail('combat guide reserve source drift');
          if (!history.sources?.includes('docs/CHARACTERS.md')) fail('history atlas source drift');
          if (!themes.sources?.includes('src/game/data/characterThemeColors.ts')) fail('theme read model source drift');
          if (!themes.sources?.includes('docs/character-star-beast-constellation-canon-v1.md')) fail('star-beast theme source drift');

          for (const token of ['--dawn-progress','--sky-top','--sky-horizon','--star-opacity']) {
            if (!motionSource.includes(token)) fail(`dawn motion controller missing ${token}`);
          }
          if (!motionSource.includes("['夜半', 'MIDNIGHT']") || !motionSource.includes("['朝', 'MORNING']")) fail('dawn phase labels missing');
          if (motionSource.includes('installPointerLight') || motionSource.includes('installCardLight')) fail('AI-like pointer glow motion must stay removed');

          if (process.exitCode) process.exit(process.exitCode);
          console.log(`Lorebook OK: ${world.characters.length} characters / ${personal.profiles.length} profiles / ${combat.entries.length} combat guides / ${themes.characters.length} palettes / ${world.relationships.length} relationships / ${arcs.arcs.length} arcs / ${history.objectThreads.length} history threads / ${lab.decisions.length} decisions / ${franchise.entryPillars.length} IP pillars / ${franchise.series.length} series titles`);
          NODE

      - name: Verify enhancement bootstrap and static entrypoint
        run: |
          grep -q './styles.css' public/lorebook/index.html
          grep -q './app.js' public/lorebook/index.html
          grep -q './enhancements.js' public/lorebook/index.html
          grep -q 'id="prologue"' public/lorebook/index.html
          grep -q 'id="skipPrologue"' public/lorebook/index.html
          grep -q 'id="readingProgress"' public/lorebook/index.html
          for module in profile-enhancement relationship-enhancement combat-enhancement history-enhancement decision-lab theme-enhancement franchise-enhancement motion-enhancement; do grep -q "./${module}.js" public/lorebook/enhancements.js; done
          ! grep -q 'relationship-enhancement.js' public/lorebook/profile-enhancement.js
          grep -q './profile.css' public/lorebook/profile-enhancement.js
          grep -q './relationship.css' public/lorebook/relationship-enhancement.js
          grep -q './combat.css' public/lorebook/combat-enhancement.js
          grep -q './history.css' public/lorebook/history-enhancement.js
          grep -q './decision-lab.css' public/lorebook/decision-lab.js
          grep -q './theme.css' public/lorebook/theme-enhancement.js
          grep -q './franchise.css' public/lorebook/franchise-enhancement.js
          grep -q './motion.css' public/lorebook/motion-enhancement.js
          for file in styles.css profile.css relationship.css combat.css history.css decision-lab.css theme.css franchise.css motion.css app.js enhancements.js profile-enhancement.js relationship-enhancement.js combat-enhancement.js history-enhancement.js decision-lab.js theme-enhancement.js franchise-enhancement.js motion-enhancement.js; do test -f "public/lorebook/$file"; done
          for file in world-bible.v1.json personal-profiles.v1.json relationship-arcs.v1.json combat-guide.v1.json history-atlas.v1.json setting-decision-lab.v1.json character-themes.v1.json franchise-strategy.v1.json; do test -f "public/lorebook/data/$file"; done
          test -f docs/series-commercial-franchise-architecture-v1.md

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify deployable Vite output
        run: |
          pnpm build
          test -f dist/lorebook/index.html
          for file in styles.css profile.css relationship.css combat.css history.css decision-lab.css theme.css franchise.css motion.css app.js enhancements.js profile-enhancement.js relationship-enhancement.js combat-enhancement.js history-enhancement.js decision-lab.js theme-enhancement.js franchise-enhancement.js motion-enhancement.js; do test -f "dist/lorebook/$file"; done
          for file in world-bible.v1.json personal-profiles.v1.json relationship-arcs.v1.json combat-guide.v1.json history-atlas.v1.json setting-decision-lab.v1.json character-themes.v1.json franchise-strategy.v1.json; do test -f "dist/lorebook/data/$file"; done

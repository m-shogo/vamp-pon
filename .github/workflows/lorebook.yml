name: Lorebook

on:
  pull_request:
    paths:
      - 'public/lorebook/**'
      - 'docs/lorebook-**'
      - '.github/workflows/lorebook.yml'
  push:
    branches:
      - main
    paths:
      - 'public/lorebook/**'
      - 'docs/lorebook-**'
      - '.github/workflows/lorebook.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: node --check public/lorebook/app.js

      - name: Validate world-bible schema and references
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'public/lorebook/data/world-bible.v1.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const fail = (message) => { console.error(message); process.exitCode = 1; };
          const allowed = new Set(['CANON', 'USER_DIRECTION', 'CANDIDATE', 'OPEN_QUESTION']);
          const ids = new Set(data.characters.map((c) => c.id));

          if (data.schemaVersion !== 1) fail('schemaVersion must be 1');
          if (data.characters.length !== 21) fail(`expected Current21, got ${data.characters.length}`);
          if (new Set(data.characters.map((c) => c.id)).size !== data.characters.length) fail('duplicate character id');
          if (new Set(data.relationships.map((r) => r.id)).size !== data.relationships.length) fail('duplicate relationship id');

          for (const character of data.characters) {
            if (!character.name || !character.core || !character.growth) fail(`incomplete character: ${character.id}`);
            if (!allowed.has(character.status)) fail(`unknown character status: ${character.id}/${character.status}`);
          }
          for (const relation of data.relationships) {
            if (!ids.has(relation.from) || !ids.has(relation.to)) fail(`orphan relation: ${relation.id}`);
            if (relation.from === relation.to) fail(`self relation: ${relation.id}`);
            if (!allowed.has(relation.status)) fail(`unknown relation status: ${relation.id}/${relation.status}`);
          }
          for (const item of [...data.timeline, ...data.openQuestions]) {
            if (!allowed.has(item.status)) fail(`unknown content status: ${item.id}/${item.status}`);
          }
          if (!data.authority?.sources?.includes('docs/CANON.md')) fail('CANON.md must remain an authority source');
          if (!data.authority?.sources?.includes('docs/CHARACTERS.md')) fail('CHARACTERS.md must remain an authority source');
          if (process.exitCode) process.exit(process.exitCode);
          console.log(`Lorebook OK: ${data.characters.length} characters / ${data.relationships.length} relationships / ${data.openQuestions.length} open questions`);
          NODE

      - name: Verify static entrypoint references
        run: |
          grep -q './styles.css' public/lorebook/index.html
          grep -q './app.js' public/lorebook/index.html
          test -f public/lorebook/styles.css
          test -f public/lorebook/app.js
          test -f public/lorebook/data/world-bible.v1.json

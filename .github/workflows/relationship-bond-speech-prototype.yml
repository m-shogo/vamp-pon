name: Relationship Bond Speech Prototype

on:
  pull_request:
    paths:
      - 'src/game/data/relationshipBondSpeechPrototypeSource.ts'
      - 'src/game/data/relationshipSpeechProgressionSource.ts'
      - 'src/game/data/currentRelationshipInventory.ts'
      - 'docs/relationship-bond-speech-prototype-v1.md'
      - 'scripts/quality/check-relationship-bond-speech-prototype.ts'
      - '.github/workflows/relationship-bond-speech-prototype.yml'
  push:
    branches: [main]
    paths:
      - 'src/game/data/relationshipBondSpeechPrototypeSource.ts'
      - 'src/game/data/relationshipSpeechProgressionSource.ts'
      - 'src/game/data/currentRelationshipInventory.ts'
      - 'docs/relationship-bond-speech-prototype-v1.md'
      - 'scripts/quality/check-relationship-bond-speech-prototype.ts'
      - '.github/workflows/relationship-bond-speech-prototype.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check prototype Bond-to-speech resolver
        run: node --experimental-strip-types scripts/quality/check-relationship-bond-speech-prototype.ts

name: Visual Asset Master Registry

on:
  pull_request:
    paths:
      - 'data/character-assets/manifests/**'
      - 'scripts/quality/check-visual-production-execution-view.ts'
      - '.github/workflows/visual-asset-master-registry.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Sync historical V2 count projections to Current inventory
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = {
            'data/character-assets/manifests/visual-production-execution-policy.v2.json': [
              ('"totalManagedRows": 480', '"totalManagedRows": 486'),
              ('"logicalNonImageRows": 214', '"logicalNonImageRows": 220'),
              ('"migratedLegacyLorebookBakedRows": 142', '"migratedLegacyLorebookBakedRows": 148'),
              ('"lorebookCompositionReadModels": 142', '"lorebookCompositionReadModels": 148'),
              ('"lorebook-foreshadow": 10', '"lorebook-foreshadow": 16'),
              ('still models 142 composition cards', 'still models 148 composition cards'),
            ],
            'data/character-assets/manifests/visual-image-generation-backlog.v1.json': [
              ('"stableManagedRows": 480', '"stableManagedRows": 486'),
              ('"logicalNonImageRows": 214', '"logicalNonImageRows": 220'),
              ('"lorebookCompositionReadModels": 142', '"lorebookCompositionReadModels": 148'),
              ('"logicalNonImage": "36 + 36 + 142 = 214"', '"logicalNonImage": "36 + 36 + 148 = 220"'),
              ('"totalManaged": "266 + 214 = 480"', '"totalManaged": "266 + 220 = 486"'),
              ('"migratedLegacyLorebookRows": 142', '"migratedLegacyLorebookRows": 148'),
              ('"lorebookCompositionReadModels": 142', '"lorebookCompositionReadModels": 148'),
              ('"foreshadow": 10', '"foreshadow": 16'),
              ('142 Lorebook profile/era/reality-root/relationship/foreshadow cards', '148 Lorebook profile/era/reality-root/relationship/foreshadow cards'),
              ('all 142 to composition/read-model rows', 'all 148 to composition/read-model rows'),
              ('Do not create 142 Lorebook PNG replacements', 'Do not create 148 Lorebook PNG replacements'),
            ],
            'scripts/quality/check-visual-production-execution-view.ts': [
              ('currentItems.length !== 480', 'currentItems.length !== 486'),
              ('stable managed row count must remain 480', 'stable managed row count must remain 486'),
              ('legacyBakedRows.length !== 142 || migratedRows.length !== 142', 'legacyBakedRows.length !== 148 || migratedRows.length !== 148'),
              ('expected 142 legacy/migrated Lorebook rows', 'expected 148 legacy/migrated Lorebook rows'),
              ('nonImage !== 214', 'nonImage !== 220'),
              ('expected 214 non-image logical rows', 'expected 220 non-image logical rows'),
              ('Guide/DB must remain 142 compositions', 'Guide/DB must remain 148 compositions'),
            ],
          }

          for path, replacements in files.items():
            p = Path(path)
            s = p.read_text()
            for old, new in replacements:
              s = s.replace(old, new)
            p.write_text(s)
          PY
          if ! git diff --quiet -- data/character-assets/manifests/visual-production-execution-policy.v2.json data/character-assets/manifests/visual-image-generation-backlog.v1.json scripts/quality/check-visual-production-execution-view.ts; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/character-assets/manifests/visual-production-execution-policy.v2.json \
                    data/character-assets/manifests/visual-image-generation-backlog.v1.json \
                    scripts/quality/check-visual-production-execution-view.ts
            git commit -m 'test: sync V2 audit counts to current inventory'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate V2 audit execution view after count sync
        run: node --experimental-strip-types scripts/quality/check-visual-production-execution-view.ts

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate Visual Asset Master Registry and coverage inventory
        run: pnpm visual-assets:check
      - name: Validate generation backlog governance, counts, and duplicate binaries
        run: node --experimental-strip-types scripts/quality/check-visual-generation-governance.ts
      - name: Validate live Character Design Sheet production adapter
        run: node --experimental-strip-types scripts/quality/check-character-design-sheet-production-entrypoint.ts
      - name: Validate item physical/evolution lineage collision queue
        run: node --experimental-strip-types scripts/quality/check-visual-item-lineage-review-queue.ts
      - name: Validate deduped current visual production execution view
        run: node --experimental-strip-types scripts/quality/check-visual-production-execution-view.ts
      - name: Validate Gunjo record foundation editable masters
        run: node --experimental-strip-types scripts/quality/check-gunjo-record-foundation-masters.ts
      - name: Validate Dream infrastructure and sky moon foundation masters
        run: node --experimental-strip-types scripts/quality/check-world-dream-sky-foundation-masters.ts
      - name: Validate Modern IAU88 vector-system boundary
        run: node --experimental-strip-types scripts/quality/check-modern-iau88-project-line-art-vector-master.ts
      - name: Validate Core5 era environment and population-household authoring briefs
        run: node --experimental-strip-types scripts/quality/check-core5-era-environment-household-authoring-brief.ts
      - name: Validate Core5 era setting-board production contract
        run: node --experimental-strip-types scripts/quality/check-core5-era-setting-board-production-contract.ts
      - name: Validate Core5 era setting-board evidence packets
        run: node --experimental-strip-types scripts/quality/check-core5-era-setting-board-evidence-packets.ts
      - name: Validate Sakuyaza Current naming and Gunjo record-taxonomy visual masters
        run: node --experimental-strip-types scripts/quality/check-visual-current-group-record-master.ts
      - name: Validate Sakuyaza legacy-ID migration facade
        run: node --experimental-strip-types scripts/quality/check-sakuyaza-legacy-migration.ts
      - name: Validate fixed pre-game world master rows
        run: node --experimental-strip-types scripts/quality/check-visual-pre-game-fixed-master-rows.ts
      - name: Validate source-derived pre-game master rows
        run: node --experimental-strip-types scripts/quality/check-visual-pre-game-source-master-inventory.ts
      - name: Validate existing TOP and Loading reuse classification
        run: node --experimental-strip-types scripts/quality/check-visual-existing-top-loading-reuse-audit.ts
      - name: Validate Guide and DB master-reuse policy
        run: node --experimental-strip-types scripts/quality/check-visual-guide-db-reuse-policy.ts
      - name: Audit all indexed Asset Factory output paths
        run: node --experimental-strip-types scripts/quality/check-visual-existing-contract-output-audit.ts
      - name: Validate dynamic Gunjo visual subject admission
        run: node --experimental-strip-types scripts/quality/check-visual-gunjo-subject-admission.ts
      - name: Validate Story authority visual coverage gaps
        run: node --experimental-strip-types scripts/quality/check-visual-story-authority-coverage-audit.ts
      - name: Validate visual gap resolution ledger
        run: node --experimental-strip-types scripts/quality/check-visual-audit-resolution-ledger.ts
